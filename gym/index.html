<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Log</title>
<style>
:root{--bg:#0e0e0f;--s1:#17171a;--s2:#202024;--bd:#2d2d33;--tx:#ece8e1;--mu:#968f85;--ac:#c38d4f;--ac2:#e2b37c;--ok:#7bb072;--mid:#d6b05a;--bad:#d06c57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:18px;flex:1}
.brand b{color:var(--ac2)}
.lang{background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:14px;color:var(--ac2);font-weight:700}
main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;color:var(--mu);padding:13px 4px;font-size:14.5px}
.tabs button.on{color:var(--ac2);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{border-color:var(--ac)}
.big{font-size:26px;font-weight:800;line-height:1.25;margin:2px 0 6px}
.mu{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--s2);border-radius:11px;padding:11px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#160e05;font-weight:800}
.btn.w{width:100%}
.btn.sm{padding:6px 11px;font-size:14px;min-height:36px}
.btn.dan{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.mt{margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.warn{margin-top:10px;padding:9px 11px;border-radius:10px;background:#2a1a15;color:#f0b3a3;font-size:14px}
.note-ok{margin-top:10px;padding:9px 11px;border-radius:10px;background:#18241a;color:#b7dbb0;font-size:14px}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.list .it:last-child{border-bottom:0}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.pill.full{color:var(--ok);border-color:#3b5a37}
.pill.core{color:var(--mid);border-color:#5c4d2a}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#33261a;color:var(--ac2);white-space:nowrap}
h2{font-size:15px;color:var(--mu);font-weight:600;margin:18px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* ---- session (compact) ---- */
#sess{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--bd)}
.stitle{font-weight:800;font-size:18px;flex:1}
.corec{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.corec.done{background:#1c2a1a;color:var(--ok)}
.sbody{padding:10px 10px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.meta{display:flex;gap:8px;padding:8px 10px}
.meta label{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.meta .inp{min-height:36px;padding:5px 8px}
.inp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;outline:none}
.inp:focus{border-color:var(--ac)}
.ex{padding:10px 11px;margin-bottom:8px;border-radius:12px}
.ex.core{border-inline-start:3px solid var(--ac)}
.exh{display:flex;align-items:center;gap:7px}
.exname{background:none;border:0;padding:0;font-weight:800;font-size:16px;text-align:start;cursor:pointer}
.chk{margin-inline-start:auto;color:var(--ok);font-weight:800}
.lastl{font-size:12.5px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmsg{font-size:12.5px;border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.pmsg.ok{background:#1c2a1a;color:#a6d69c}
.pmsg.mid{background:#2b2616;color:#e5c97f}
.pmsg.bad{background:#2a1a15;color:#f0b3a3}
.tnote{font-size:13px;color:#cfc6b8;background:var(--s2);border-radius:8px;padding:6px 9px;margin-top:7px}
.erow{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;margin-top:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px}
.cell .lb{font-size:10.5px;color:var(--mu);line-height:1.2}
.cell .inp{width:46px;min-height:40px;padding:6px 2px;text-align:center;font-weight:700;font-size:17px}
.cell.wc .inp{width:62px;border-color:#4a3a28}
.cell .inp::placeholder{color:#55504a;font-weight:500}
.sb{width:34px;height:40px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);font-size:17px;padding:0}
.eopt{display:flex;align-items:center;gap:6px;margin-top:8px}
.cl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--bd);border-radius:99px;padding:4px 11px 4px 8px;cursor:pointer}
.cl input{width:18px;height:18px;accent-color:var(--ac);margin:0}
.cl.on{border-color:#3b5a37;color:var(--ok)}
.mini{font-size:13px;border:1px solid var(--bd);background:none;border-radius:99px;padding:4px 11px;color:var(--mu)}
.mini.on{color:var(--ac2);border-color:#5c4d2a}
.ex .noteI{margin-top:7px;min-height:38px;padding:6px 9px;font-size:14px}
.endbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#sess[hidden],[hidden]{display:none!important}
.mbox{background:var(--s1);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 10px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--mu)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
pre.cardtxt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:14px/1.6 system-ui,sans-serif;margin:0 0 12px;unicode-bidi:plaintext}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--s1);border-radius:99px;padding:8px 14px;color:var(--mu)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#160e05;font-weight:800}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700}
.icb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2b30;border:1px solid var(--bd);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td{padding:8px 4px;border-bottom:1px solid var(--bd)}
select.inp{appearance:auto}
</style>
</head>
<body>

  <div class="brand" id="brand"></div>
  <button class="btn sm pri" id="updBtn" hidden></button>

</header>

<nav class="tabs">
  <button data-tab="home" class="on"></button>
  <button data-tab="hist"></button>
  <button data-tab="prog"></button>
  <button data-tab="data"></button>
</nav>
<section id="sess" hidden></section>
<div id="modal" hidden><div class="mbox"></div></div>
<div id="toast"></div>

/* قاعدة الزيادة: الهدف كامل نضيف في يومين منفصلين على نفس الوزن */
function progState(t,h){
  if(!h.length)return null;
  const W=+h[0].w||0;let q=0,n=0;
  for(const x of h){if((+x.w||0)!==W)break;n++;if(x.clean&&x.sets.length>=t.sets&&x.sets.every(r=>r>=t.goal))q++}
  if(q>=2)return{k:'up'};if(n>=5)return{k:'stuck',n};if(q===1)return{k:'q1'};return null;
}
function progMsg(t,h,unit){

  if(p.k==='up')return{c:'ok',t:unit?L.pUpU(t.sets,t.goal):L.pUp(t.sets,t.goal)};
  if(p.k==='stuck')return{c:'bad',t:L.pStuck(p.n)};
  return{c:'mid',t:L.pQ1(t.sets,t.goal)};
}

}

/* نص منظم للتحليل بالذكاء الاصطناعي */
function aiText(s,skip){
  const L=T(),out=[];
  const dObj=S.program.days.find(x=>x.id===s.day);
  const tpl=dObj?dObj.ex:[];
  const coreAll=tpl.filter(t=>t.core),coreDone=coreAll.filter(t=>s.ex.some(e=>e.exId===t.id)).length;
  out.push(L.aiHead(s.dayName,s.cycle));
  out.push(`${L.aiDate}: ${s.date} (${fmtD(s.date)})`);
  if(coreAll.length)out.push(L.aiCore(coreDone,coreAll.length));
  out.push(L.aiUnits);out.push(L.aiRule);out.push('');
  s.ex.forEach((e,i)=>{
    const u=e.unit?' '+unitTxt(e.unit):'';
    out.push(`${i+1}. ${e.name}${e.core?' '+L.aiCoreTag:''}`);
    out.push(`   ${L.aiTarget}: ${e.tsets||e.sets.length}×${e.treps||''}${u}`);
    out.push(`   ${L.aiWeight}: ${noW(e.w)?(e.unit?'—':L.bw):(+e.w)+' kg'}`);
    out.push(`   ${L.aiSets}: ${e.sets.join(', ')}${u}`);
    out.push(`   ${L.aiForm}: ${e.clean?L.aiClean:L.aiNotClean}`);
    const h=exHist(e.exId,skip).filter(x=>x.date<=s.date);const prev=h[0];
    if(prev)out.push(`   ${L.aiLast} (${prev.date}): ${noW(prev.w)?'—':(+prev.w)+' kg'} — ${prev.sets.join('/')}${u}${prev.clean?', '+L.clean:''}`);
    const p=progState({sets:e.tsets||e.sets.length,goal:e.goal||e.treps||12},[Object.assign({date:s.date},e)].concat(h));
    if(p)out.push(`   ${L.aiStatus}: ${p.k==='stuck'?L.st2.stuck(p.n):L.st2[p.k]}`);
    if(e.note)out.push(`   ${L.aiNote}: ${e.note}`);
    out.push('');
  });
  const miss=tpl.filter(t=>!s.ex.some(e=>e.exId===t.id)).map(t=>t.name);
  if(miss.length)out.push(`${L.aiNotDone}: ${miss.join(', ')}`);
  return out.join('\n').trim();
}

/* تحويل المسودة لجلسة (من غير حفظ) */
function buildFromDraft(){
  const d=S.draft,ex=[];
  for(const e of d.ex){const sets=e.sets.map(num).filter(v=>!isNaN(v)&&v>0);if(!sets.length)continue;const w=num(e.w);
    ex.push({exId:e.exId,name:e.name,unit:e.unit,core:e.core,goal:e.goal,tsets:e.tsets,treps:e.treps,w:isNaN(w)?'':w,sets,clean:!!e.clean,note:(e.note||'').trim()})}
  if(!ex.length)return null;

  const all=d.ex.every(e=>ex.some(x=>x.exId===e.exId));
  return{id:d.editing||d.id,date:d.date||today(),day:d.day,dayName:d.dayName,cycle:+num(d.cycle)||1,ex,status:all?'full':core?'core':'part',ts:Date.now()};

  const d=S.draft,s=buildFromDraft();
  if(!s){toast(T().noSets);return}
  const i=d.editing?S.sessions.findIndex(x=>x.id===d.editing):-1;
  if(i>-1){s.ts=S.sessions[i].ts;S.sessions[i]=s}else S.sessions.push(s);
  S.draft=null;openTips.clear();save();closeSession();
  toast(s.status==='full'?T().savedFull:s.status==='core'?T().savedCore:T().saved);
  autoFile();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  go('home');
}
function shareDraft(){const s=buildFromDraft();if(!s){toast(T().noSets);return}shareText(aiText(s,S.draft.editing))}
function exHistModal(exId){
  const L=T();let nm='',dn='';for(const d of S.program.days){const t=d.ex.find(x=>x.id===exId);if(t){nm=t.name;dn=d.name}}
  const h=exHist(exId);if(!nm&&h[0])nm=h[0].name;
  modal(`<h3 class="en" style="text-align:start">${esc(nm)}</h3><div class="mu" style="margin-bottom:8px"><span class="en">${esc(dn)}</span> · ${L.sessCount(h.length)}</div>
  ${h.length?`<table class="h">${h.map(x=>`<tr><td>${fmtD(x.date)}</td><td class="en">${fw(x.w)}</td><td class="en">${esc(setsStr(x))}</td><td>${x.clean?`<span style="color:var(--ok)">${L.clean}</span>`:''}</td></tr>`).join('')}</table>`:`<div class="empty">${L.noData}</div>`}
  <button class="btn w mt" data-a="closeM">${L.close}</button>`);
}

/* ================= السجل ================= */
function renderHistory(){
  const L=T(),ds=done();
  let h=`<div class="card"><div class="mu" style="margin-bottom:6px">${L.exPick}</div><select class="inp" id="exPick"><option value="">${L.exPickPh}</option>${S.program.days.map(d=>`<optgroup label="${esc(d.name)}">${d.ex.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
  if(!ds.length)h+=`<div class="empty">${L.noSess}</div>`;
  else h+=`<div class="card list">${ds.map(s=>`<div class="it" data-a="sess" data-id="${s.id}"><div class="sp"><div style="font-weight:700"><bdi>${esc(s.dayName)}</bdi></div><div class="mu">${fmtD(s.date)} · <span class="en">Cycle ${s.cycle}</span> · ${L.exN(s.ex.length)}</div></div>${statusPill(s)}</div>`).join('')}</div>`;
  $('#view').innerHTML=h;
  $('#exPick').onchange=e=>{if(e.target.value)exHistModal(e.target.value);e.target.value=''};
}
function sessModal(id){
  const L=T(),s=S.sessions.find(x=>x.id===id);if(!s)return;
  modal(`<h3><bdi>${esc(s.dayName)}</bdi> · ${fmtD(s.date)}</h3><pre class="cardtxt">${esc(cardText(s))}</pre>
  <div class="row"><button class="btn pri sp" data-a="copyS" data-id="${s.id}">${L.copyCard}</button><button class="btn sp" data-a="aiS" data-id="${s.id}">${L.shareAI}</button></div>
  <div class="row mt"><button class="btn sp" data-a="editS" data-id="${s.id}">${L.edit}</button><button class="btn dan sp" data-a="delS" data-id="${s.id}">${L.del}</button></div>
  <button class="btn w ghost mt" data-a="closeM">${L.close}</button>`);
}

/* ================= البرنامج ================= */
let pDay='U1';
function renderProgram(){
  const L=T();
  if(!S.program.days.some(d=>d.id===pDay))pDay=S.program.days[0].id;
  const d=day(pDay);
  $('#view').innerHTML=`<div class="chips">${S.program.days.map(x=>`<button class="en${x.id===pDay?' on':''}" data-a="pday" data-d="${x.id}">${esc(x.name)}</button>`).join('')}</div>
  <div class="card">${d.ex.map((t,i)=>{const l=exHist(t.id)[0];return `<div class="prow"><div class="sp"><div class="nm"><span class="en">${esc(t.name)}</span> ${t.core?`<span class="tag">${L.coreL}</span>`:''}</div><div class="mu"><span class="en">${fw(l?l.w:t.w)} | ${t.sets}×${t.reps}</span>${t.unit?' '+esc(unitTxt(t.unit)):''}</div></div>
    <button class="icb" data-a="up" data-i="${i}" aria-label="up">▲</button><button class="icb" data-a="down" data-i="${i}" aria-label="down">▼</button><button class="icb" data-a="editT" data-i="${i}" aria-label="edit">✎</button></div>`}).join('')||`<div class="empty">—</div>`}</div>
  <button class="btn w" data-a="addT">${L.addEx}</button>
  <button class="btn w mt" data-a="copyT">${L.copyTpl} <bdi>${esc(d.name)}</bdi></button>
  <div class="mu mt" style="padding:0 4px">${L.progHint}</div>`;
}
function tplModal(i){
  const L=T(),d=day(pDay),t=i>-1?d.ex[i]:{name:'',w:'',sets:3,reps:12,goal:12,unit:'',core:false,note:''};
  modal(`<h3>${i>-1?L.editEx:L.newEx}</h3>
  <label class="fld">${L.name}<input class="inp en" id="tName" value="${esc(t.name)}" style="text-align:left"></label>
  <div class="fgrid"><label class="fld">${L.weight}<input class="inp" id="tW" inputmode="decimal" value="${esc(t.w)}"></label><label class="fld">${L.sets}<input class="inp" id="tS" inputmode="numeric" value="${esc(t.sets)}"></label><label class="fld">${L.reps}<input class="inp" id="tR" inputmode="numeric" value="${esc(t.reps)}"></label></div>
  <div class="fgrid"><label class="fld">${L.goal}<input class="inp" id="tG" inputmode="numeric" value="${esc(t.goal)}"></label><label class="fld" style="grid-column:span 2">${L.unit}<select class="inp" id="tU">${['','ث','خطوة'].map(u=>`<option value="${u}" ${t.unit===u?'selected':''}>${L.units[u]}</option>`).join('')}</select></label></div>
  <label class="cl" style="margin:4px 0 12px"><input type="checkbox" id="tC" ${t.core?'checked':''}>${L.coreEx}</label>
  <label class="fld">${L.instr}<textarea class="inp" id="tN" rows="2">${esc(t.note)}</textarea></label>
  <div class="mu" style="margin-bottom:10px">${L.tplHint}</div>
  <div class="row"><button class="btn pri sp" data-a="saveT" data-i="${i}">${L.saveB}</button>${i>-1?`<button class="btn dan" data-a="delT" data-i="${i}">${L.del}</button>`:''}<button class="btn ghost" data-a="closeM">${L.cancel}</button></div>`);
}
function saveTpl(i){
  const name=$('#tName').value.trim();if(!name){toast(T().nameReq);return}
  const g=k=>{const v=num($(k).value);return isNaN(v)?'':v};
  const d=day(pDay),t=i>-1?d.ex[i]:{id:uid()};
  Object.assign(t,{name,w:g('#tW'),sets:Math.max(1,g('#tS')||3),reps:g('#tR')||12,goal:g('#tG')||g('#tR')||12,unit:$('#tU').value,core:$('#tC').checked,note:$('#tN').value.trim()});
  if(i<0)d.ex.push(t);save();closeModal();renderProgram();
}

/* ================= النسخة الاحتياطية (.md) ================= */
const FS='showSaveFilePicker' in window;
const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('gymlog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  return{get:k=>db().then(d=>new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})),
         set:(k,v)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}))}})();
const cellMd=s=>String(s??'').replace(/\|/g,'/').replace(/\r?\n/g,' ');
const rowMd=a=>'| '+a.map(cellMd).join(' | ')+' |';
function backupMD(){
  const L=T(),o=[];
  const now=new Date().toLocaleString(loc(),{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  o.push(`# ${L.mdTitle}`,'',`${L.mdExported}: ${now} · ${L.mdSessions}: ${S.sessions.length} · v${VER}`,'');
  o.push(`## ${L.mdProgram}`,'');
  for(const d of S.program.days){
    o.push(`### ${d.name}`,'',rowMd(L.mdCols),rowMd(L.mdCols.map(()=>'---')));
    d.ex.forEach((t,i)=>{const l=exHist(t.id)[0];o.push(rowMd([i+1,t.name,fw(l?l.w:t.w),`${t.sets}×${t.reps}${t.unit?' '+unitTxt(t.unit):''}`,t.core?L.yes:'',t.note]))});
    o.push('',`${L.coreLine}: ${coreNames(d).join(' + ')}`,'');
  }
  o.push(`## ${L.mdLog}`,'');
  for(const s of done()){
    o.push(`### ${s.date} — ${s.dayName} · Cycle ${s.cycle} · ${L.st[s.status]||''}`,'',rowMd(L.mdSCols),rowMd(L.mdSCols.map(()=>'---')));
    for(const e of s.ex)o.push(rowMd([e.name+(e.core?' ★':''),fw(e.w),e.sets.join(' / ')+(e.unit?' '+unitTxt(e.unit):''),e.clean?L.yes:'',e.note]));
    o.push('');
  }
  const data=JSON.stringify({app:'gymlog',v:1,exported:new Date().toISOString(),data:{program:S.program,sessions:S.sessions,settings:S.settings,draft:S.draft}}).replace(/-->/g,'--\\u003e');
  o.push('---','',`<!-- GYMLOG-DATA · ${L.mdData}`,data,'-->','');
  return o.join('\n');
}
function parseBackup(txt){
  const m=txt.match(/<!--\s*GYMLOG-DATA[^\n]*\n([\s\S]*?)\n?-->/);
  const o=JSON.parse(m?m[1]:txt);return o.data||o;
}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function markBackup(){S.settings.lastBackup=Date.now();save()}
async function backupNow(){
  if(FS){try{const h=await idb.get('fh');if(h&&await writeLinked(h,true)){toast(T().savedFile);refresh();return}}catch(e){}}
  download(`gym-backup-${today()}.md`,backupMD(),'text/markdown');markBackup();toast(T().dlDone);refresh();
}
async function shareBackup(){
  const t=backupMD();let err='';
  // أندرويد مش بيسمح بمشاركة .md، فبنبعته .txt (نفس المحتوى بالظبط)
  try{const f=new File([t],`gym-backup-${today()}.txt`,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});markBackup();toast(T().sent);refresh();return}
  }catch(e){if(e.name==='AbortError')return;err=e.name}
  if(navigator.share&&t.length<60000){try{await navigator.share({text:t});markBackup();toast(T().sentText);refresh();return}catch(e){if(e.name==='AbortError')return;err=err||e.name}}
  download(`gym-backup-${today()}.md`,t,'text/markdown');markBackup();refresh();toast(T().shareFail(err));
}
async function linkFile(){
  try{const h=await showSaveFilePicker({suggestedName:'gym-log.md',types:[{description:'Gym log',accept:{'text/markdown':['.md']}}]});
    await idb.set('fh',h);S.settings.linked=h.name;await writeLinked(h,true);toast(T().linked);refresh()}
  catch(e){if(e.name!=='AbortError')toast(T().linkFail)}
}
async function writeLinked(h,ask){
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted'&&ask)p=await h.requestPermission({mode:'readwrite'});
  if(p!=='granted')return false;
  const w=await h.createWritable();await w.write(backupMD());await w.close();markBackup();return true;
}
async function autoFile(){if(!FS)return;try{const h=await idb.get('fh');if(h)await writeLinked(h,true)}catch(e){}}
function exportCSV(){
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=[T().csvH];
  for(const s of done().reverse())for(const e of s.ex)rows.push([s.date,s.cycle,s.dayName,e.name,e.w,e.sets.join('/'),e.sets.length,e.sets.reduce((a,b)=>a+b,0),e.clean?'1':'0',e.core?'1':'0',e.note]);
  download(`gym-log-${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');toast(T().csvDone);
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=parseBackup(r.result);
    if(!d.program||!Array.isArray(d.program.days)||!Array.isArray(d.sessions))throw 0;
    if(!confirm(T().confRestore(d.sessions.length)))return;
    S={v:1,program:d.program,sessions:d.sessions,settings:Object.assign({cycle:8},d.settings||{},{lang:LANG}),draft:d.draft||null};save();toast(T().restored);go('home')}
    catch(e){toast(T().badFile)}};
  r.readAsText(file);
}
function refresh(){if(tab==='data')renderData();if(tab==='home')renderHome()}
async function renderData(){
  const L=T(),lb=S.settings.lastBackup,n=S.sessions.length;
  let persisted=null;try{persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null}catch(e){}
  if(tab!=='data')return;
  $('#view').innerHTML=`<div class="card"><div class="mu">${L.onPhone}</div><div class="big">${n} <span class="mu">${L.sessions}</span></div>
    <div class="mu">${L.lastBk}: ${lb?new Date(lb).toLocaleString(loc(),{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):L.never}</div>
    ${persisted===true?`<div class="note-ok">${L.persisted}</div>`:''}</div>
  ${FS?`<div class="card"><div style="font-weight:700;margin-bottom:4px">${L.autoT}</div><div class="mu" style="margin-bottom:10px">${S.settings.linked?L.autoLinked('<span class="en">'+esc(S.settings.linked)+'</span>'):L.autoHint}</div><button class="btn w" data-a="link">${S.settings.linked?L.relinkB:L.linkB}</button></div>`:''}
  <div class="card"><div style="font-weight:700;margin-bottom:4px">${L.bkT}</div><div class="mu" style="margin-bottom:10px">${L.bkHint}</div>
    <button class="btn pri w" data-a="backup">${L.bkSave}</button>
    <button class="btn w mt" data-a="share">${L.bkShare}</button>
    <label class="btn w mt" style="cursor:pointer">${L.restore}<input type="file" id="imp" accept=".md,.txt,.json,text/markdown,text/plain,application/json" hidden></label></div>
  <div class="card"><div style="font-weight:700;margin-bottom:4px">${L.csvT}</div><div class="mu" style="margin-bottom:10px">${L.csvHint}</div><button class="btn w" data-a="csv">${L.csvB}</button></div>
  <div class="card"><label class="fld" style="margin:0">${L.cycleL}<input class="inp" id="cyc0" inputmode="numeric" value="${esc(S.settings.cycle)}"></label></div>
  <div class="mu" style="text-align:center">${L.ver}: ${VER}</div>`;
  $('#imp').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};
  $('#cyc0').onchange=e=>{const v=num(e.target.value);if(v>0){S.settings.cycle=v;save();toast(L.cycleSaved)}};
}

/* ================= الأحداث ================= */
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('.tabs button');if(tb){go(tb.dataset.tab);return}
  if(ev.target.id==='modal'){closeModal();return}
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,d=S.draft,L=T();
  switch(a){
    case 'lang':LANG=LANG==='en'?'ar':'en';S.settings.lang=LANG;save();applyLang();if(!$('#sess').hidden)renderSession();if(!$('#modal').hidden)closeModal();go(tab);break;
    case 'start':startSession(b.dataset.d);break;
    case 'resume':openSession();break;
    case 'closeS':closeSession();break;
    case 'commit':commit();break;
    case 'shareDraft':shareDraft();break;
    case 'discard':if(confirm(d.editing?L.confCancelEdit:L.confDiscard)){S.draft=null;openTips.clear();save();closeSession()}break;
    case 'addset':d.ex[i].sets.push('');save();renderSession();break;
    case 'rmset':if(d.ex[i].sets.length>1){d.ex[i].sets.pop();save();renderSession()}break;
    case 'tgl':{const k=b.dataset.k;openTips.has(k)?openTips.delete(k):openTips.add(k);renderSession();if(k[0]==='n'){const inp=document.querySelector(`.ex[data-i="${k.slice(1)}"] .noteI`);inp&&inp.focus()}break}
    case 'hist':exHistModal(b.dataset.id);break;
    case 'sess':sessModal(b.dataset.id);break;
    case 'copyS':copy(cardText(S.sessions.find(x=>x.id===b.dataset.id)));break;
    case 'aiS':{const s=S.sessions.find(x=>x.id===b.dataset.id);if(s)shareText(aiText(s,s.id));break}
    case 'editS':editSession(b.dataset.id);break;
    case 'delS':if(confirm(L.confDel)){S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);save();closeModal();go(tab)}break;
    case 'closeM':closeModal();break;
    case 'pday':pDay=b.dataset.d;renderProgram();break;
    case 'up':case 'down':{const ex=day(pDay).ex,j=a==='up'?i-1:i+1;if(j>=0&&j<ex.length){[ex[i],ex[j]]=[ex[j],ex[i]];save();renderProgram()}break}
    case 'editT':tplModal(i);break;
    case 'addT':tplModal(-1);break;
    case 'saveT':saveTpl(i);break;
    case 'delT':if(confirm(L.confDelEx)){day(pDay).ex.splice(i,1);save();closeModal();renderProgram()}break;
    case 'copyT':copy(tplCard(day(pDay)));break;
    case 'backup':backupNow();break;
    case 'share':shareBackup();break;
    case 'link':linkFile();break;
    case 'csv':exportCSV();break;
  }
});
const sess=$('#sess');
function onField(ev){
  const t=ev.target,d=S.draft;if(!d)return;
  if(t.id==='sDate'){d.date=t.value;save();return}
  if(t.id==='sCyc'){const n=num(t.value);if(n>0)d.cycle=n;save();return}
  const c=t.closest('.ex');if(!c)return;const e=d.ex[+c.dataset.i],f=t.dataset.f;
  if(f==='w')e.w=t.value;else if(f==='s')e.sets[+t.dataset.j]=t.value;else if(f==='c'){e.clean=t.checked;t.closest('.cl').classList.toggle('on',t.checked)}else if(f==='n')e.note=t.value;else return;
  save();updCore();
}
sess.addEventListener('input',onField);sess.addEventListener('change',onField);
sess.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const all=[...sess.querySelectorAll('input.inp')];const k=all.indexOf(ev.target);if(k>-1&&all[k+1]){ev.preventDefault();all[k+1].focus()}});

/* ================= التثبيت والتحديث ================= */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){const u=$('#updBtn');u.hidden=false;u.onclick=()=>reg.waiting&&reg.waiting.postMessage('skip')}};
    show();reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')show()})});
  }).catch(()=>{});
  let r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!r){r=true;location.reload()}});
}
applyLang();go('home');
</script>
