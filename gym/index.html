<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Log</title>
<style>
:root{--scb:#000;--sci:#0c0c0c;--font:system-ui,"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;--fnum:inherit;--rad:14px;--radb:11px;--radp:99px;--bw:1px;--sh:none;--ttl:none;--ls:0;--bg:#0e0e0f;--s1:#17171a;--s2:#202024;--bd:#2d2d33;--tx:#ece8e1;--mu:#968f85;--ac:#c38d4f;--ac2:#e2b37c;--ok:#7bb072;--mid:#d6b05a;--bad:#d06c57;--onac:#160e05;--hero:#1d1810;--tx2:#cfc6b8;--ph:#55504a;--okbd:#3b5a37;--okbg:#1c2a1a;--midbd:#5c4d2a;--midbg:#2b2616;--badbg:#2a1a15;--acbd:#4a3a28;--acbg:#33261a;--oktx:#a6d69c;--midtx:#e5c97f;--badtx:#f0b3a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font)}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:18px;flex:1}
main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;color:var(--mu);padding:13px 2px;font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--ac2);font-weight:700;box-shadow:inset 0 2px 0 var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hl{border-color:var(--ac)}
.big{font-size:26px;font-weight:800;line-height:1.25;margin:2px 0 6px}
.mu{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--s2);border-radius:11px;padding:11px 14px;font-size:15px;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:800}
.btn.w{width:100%}
.btn.sm{padding:6px 11px;font-size:14px;min-height:36px}
.btn.dan{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.mt{margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.warn{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--badbg);color:var(--badtx);font-size:14px}
.note-ok{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--okbg);color:var(--oktx);font-size:14px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--acbg);color:var(--ac2);white-space:nowrap}
h2{font-size:15px;color:var(--mu);font-weight:600;margin:18px 2px 8px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
/* ---- session (compact) ---- */
#sess{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--bd)}
.stitle{font-weight:800;font-size:18px;flex:1}
.corec{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.corec.done{background:var(--okbg);color:var(--ok)}
.sbody{padding:10px 10px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.inp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;outline:none}
.inp:focus{border-color:var(--ac)}
.ex{padding:10px 11px;margin-bottom:8px;border-radius:12px}
.ex.core{border-inline-start:3px solid var(--ac)}
.exh{display:flex;align-items:center;gap:7px}
.exname{background:none;border:0;padding:0;font-weight:800;font-size:16px;text-align:start;cursor:pointer}
.chk{margin-inline-start:auto;color:var(--ok);font-weight:800}
.pmsg{font-size:12.5px;border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.pmsg.ok{background:var(--okbg);color:var(--oktx)}
.pmsg.mid{background:var(--midbg);color:var(--midtx)}
.pmsg.bad{background:var(--badbg);color:var(--badtx)}
.tnote{font-size:13px;color:var(--tx2);background:var(--s2);border-radius:8px;padding:6px 9px;margin-top:7px}
.sb{width:34px;height:40px;border-radius:9px;border:1px solid var(--bd);background:var(--s2);font-size:17px;padding:0}
.cl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--bd);border-radius:99px;padding:4px 11px 4px 8px;cursor:pointer}
.cl input{width:18px;height:18px;accent-color:var(--ac);margin:0}
.cl.on{border-color:var(--okbd);color:var(--ok)}
.mini{font-size:13px;border:1px solid var(--bd);background:none;border-radius:99px;padding:4px 11px;color:var(--mu)}
.mini.on{color:var(--ac2);border-color:var(--midbd)}
.ex .noteI{margin-top:7px;min-height:38px;padding:6px 9px;font-size:14px}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#sess[hidden],[hidden]{display:none!important}
.mbox{background:var(--s1);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 10px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--mu)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
pre.cardtxt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:14px/1.6 system-ui,sans-serif;margin:0 0 12px;unicode-bidi:plaintext}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--s1);border-radius:99px;padding:8px 14px;color:var(--mu)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:800}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:700}
.icb{background:var(--s2);border:1px solid var(--bd);border-radius:9px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td{padding:8px 4px;border-bottom:1px solid var(--bd)}
select.inp{appearance:auto}
.btn.rec{border:2px solid var(--ok);color:var(--oktx);background:var(--okbg)}
.btn.rec{white-space:nowrap}
.btn.rec::after{content:' ✓';color:var(--ok)}
#sess .shead{padding-bottom:10px}
.pbar{height:3px;background:var(--s2);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:2}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.sbody{padding-bottom:calc(28px + env(safe-area-inset-bottom))!important}
.meta2{display:flex;gap:8px;margin-bottom:10px}
.meta2 label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.meta2 label.cy{flex:.45}
.meta2 .inp{min-height:40px;padding:6px 9px}
.ex{padding:12px 12px 12px;margin-bottom:12px;border-radius:14px;border-inline-start-width:1px}
.ex.core{border-inline-start:4px solid var(--ac)}
.ex.dn{border-color:var(--okbd);background:var(--okbg)}
.ex.dn.core{border-inline-start-color:var(--ok)}
.exno{flex:none;width:24px;height:24px;border-radius:50%;background:var(--s2);color:var(--mu);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.ex.dn .exno{background:var(--ok);color:var(--onac)}
.exname{font-size:18px;font-weight:800;flex:1;min-width:0}
.tgt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin:6px 0 0;font-size:13px;color:var(--mu)}
.tgt b{color:var(--tx);font-size:14px}
.wrow{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--bg);border:1px solid var(--acbd);border-radius:12px;padding:6px 8px}
.wrow .wi{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:800;min-height:48px;border:0;background:none;padding:0}
.wrow .un{font-size:13px;color:var(--mu);width:14px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:flex-end}
.scell{flex:1;min-width:58px;display:flex;flex-direction:column;gap:2px;align-items:stretch}
.scell .lb{font-size:11px;color:var(--mu);text-align:center}
.scell .inp{height:56px;text-align:center;font-size:24px;font-weight:800;padding:0}
.sadd{display:flex;flex-direction:column;gap:4px}
.sadd .sb{width:40px;height:26px;font-size:16px;line-height:1}
.cl.big{padding:9px 16px 9px 12px;font-size:14.5px;min-height:44px}
.cl.big input{width:22px;height:22px}
.sfoot{position:static;display:flex;gap:8px;padding:6px 10px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sfoot .btn{min-height:52px;font-size:16px}
.sfoot .sp{flex:1}
.hero{border-color:var(--ac);background:linear-gradient(180deg,var(--hero) 0,var(--s1) 60%);padding:14px 14px 12px}
.rot{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:12px}
.rs{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.rs.ld{color:var(--ok);border-color:var(--okbd)}
.rs.nx{color:var(--onac);background:var(--ac);border-color:var(--ac);font-weight:800}
.hero .big{font-size:30px;margin:0 0 8px}
.xl{border-top:1px solid var(--bd);margin-top:4px}
.xr{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14.5px}
.xr .xn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.xr.c .xn{color:var(--ac2)}
.xr .xs{font-style:normal;color:var(--ac);font-size:12px}
.xr .xw{color:var(--mu);font-size:13px;white-space:nowrap}
.coreline{font-size:12.5px;color:var(--mu);margin-top:9px;line-height:1.5}
.big2{min-height:56px;font-size:17px}
.alt{margin-top:10px}
.alt summary{color:var(--mu);font-size:13.5px;padding:8px 2px;cursor:pointer;list-style:none;text-align:center}
.alt summary::-webkit-details-marker{display:none}
.alt[open] summary{color:var(--ac2)}
.wkc{display:flex;align-items:center;gap:14px;padding:11px 14px}
.dots{display:flex;gap:7px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd)}
.dots i.goal{border-color:var(--midbd)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.wkt{font-weight:800;font-size:15px}
.bkn{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);background:var(--s1);border:1px dashed var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.bkn div{flex:1}
.sl{display:flex;flex-direction:column;gap:6px}
.sc{display:flex;align-items:center;gap:10px;padding:7px 11px;background:var(--s1);border:1px solid var(--bd);border-inline-start:4px solid var(--mu);border-radius:10px;cursor:pointer;min-height:48px}
.sc.full{border-inline-start-color:var(--ok)}.sc.core{border-inline-start-color:var(--mid)}.sc.part{border-inline-start-color:var(--bad)}
.sc:active{background:var(--s2)}
.sc .n{font-weight:800;font-size:15px;line-height:1.25}
.sc .d{font-size:12px;color:var(--mu);line-height:1.3}
.sc .sp{min-width:0}
.sc .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.sc.full .st{color:var(--ok);background:var(--okbg)}.sc.core .st{color:var(--mid);background:var(--midbg)}.sc.part .st{color:var(--bad);background:var(--badbg)}
html[data-th="sand"],html[data-th="book"]{--scb:#fbf6e8;--sci:#fffaf0}
html[data-th="plate"]{--bg:#0b0b0a;--s1:#151513;--s2:#1f1f1c;--bd:#3a3a33;--tx:#f3f1e8;--mu:#9b9887;--ac:#e9c232;--ac2:#ffe371;--ok:#6fcf6a;--mid:#e9c232;--bad:#ff5b3a;--onac:#111100;--hero:#1a1808;--tx2:#d6d3c2;--ph:#5a5848;--okbd:#2f5a2d;--okbg:#142414;--midbd:#6b5a00;--midbg:#2a2400;--badbg:#2e150e;--acbd:#5a4c10;--acbg:#231f08;--oktx:#9ae596;--midtx:#ffec7f;--badtx:#ff9a82;--font:"Bahnschrift","Arial Narrow","Roboto Condensed","Noto Sans Arabic",system-ui,sans-serif;--fnum:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--rad:3px;--radb:3px;--radp:3px;--bw:2px;--sh:5px 5px 0 rgba(242,194,0,.16);--ttl:uppercase;--ls:.06em}
html[data-th="book"]{--bg:#efe6d0;--s1:#fbf6e8;--s2:#e9dfc6;--bd:#b9ad8e;--tx:#1f2430;--mu:#6a6552;--ac:#1f3a8a;--ac2:#15286b;--ok:#2f6b3a;--mid:#8a6a10;--bad:#a3341f;--onac:#ffffff;--hero:#f4ecd6;--tx2:#343a4a;--ph:#a39b82;--okbd:#9cc3a3;--okbg:#e3efdd;--midbd:#d3bd78;--midbg:#f6ecc8;--badbg:#f6ddd3;--acbd:#9aa8d6;--acbg:#e4e8f6;--oktx:#1f5a2c;--midtx:#6b5208;--badtx:#8a2a18;--font:Georgia,"Noto Naskh Arabic","Times New Roman",serif;--fnum:Georgia,serif;--rad:4px;--radb:4px;--radp:4px;--bw:1.5px;--sh:2px 3px 0 rgba(31,36,48,.14);--ttl:none;--ls:0}
html[data-th="pulse"]{--bg:#04080b;--s1:#08121a;--s2:#0d1d28;--bd:#14363f;--tx:#dff7f2;--mu:#6f9aa0;--ac:#19e3c1;--ac2:#6ff5de;--ok:#4be38a;--mid:#e8c04a;--bad:#ff6b6b;--onac:#02130f;--hero:#082228;--tx2:#b8dad6;--ph:#335259;--okbd:#1d5a3a;--okbg:#07201a;--midbd:#5a4a14;--midbg:#1f1a08;--badbg:#2a0f12;--acbd:#127a6b;--acbg:#06241f;--oktx:#8cf0b3;--midtx:#f0d27a;--badtx:#ff9d9d;--font:system-ui,"Noto Sans Arabic","Segoe UI",sans-serif;--fnum:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--rad:6px;--radb:5px;--radp:5px;--bw:1px;--sh:0 0 14px rgba(25,227,193,.12);--ttl:uppercase;--ls:.12em}
html[data-th="dawn"]{--bg:#1a1535;--s1:#2a2147;--s2:#382d5c;--bd:#54467f;--tx:#f7eae0;--mu:#b3a3c8;--ac:#f1bc95;--ac2:#ffe0bf;--ok:#8fe3a8;--mid:#f1d49e;--bad:#ff8a7a;--onac:#2a1810;--hero:#3d2a55;--tx2:#e6d6e6;--ph:#7a6b99;--okbd:#3f7a58;--okbg:#1d3a33;--midbd:#8a6a2a;--midbg:#3a2f22;--badbg:#4a2530;--acbd:#a67a56;--acbg:#43303f;--oktx:#b6f0c6;--midtx:#fffac5;--badtx:#ffc0b6;--font:system-ui,"Noto Sans Arabic","Segoe UI",sans-serif;--fnum:inherit;--rad:24px;--radb:18px;--radp:99px;--bw:1px;--sh:0 8px 30px rgba(10,5,30,.35);--ttl:none;--ls:0}

/* ====== هيكل مشترك للثيمات (الشكل مش اللون بس) ====== */
.card,.ex,.sc,.bkn,.wrow,.warn,.note-ok,.tnote,.pmsg{border-radius:var(--rad)}
.card,.ex,.sc,.wrow{border-width:var(--bw)}
.card,.ex,.sc{box-shadow:var(--sh)}
.btn,.inp,.sb,.icb,.cl,.mini,.chips button{border-radius:var(--radb)}
.tag,.rs,.corec,.sc .st{border-radius:var(--radp)}
.mbox{border-radius:var(--rad) var(--rad) 0 0}
.wi,.scell .inp,.xw,.d,.wkt,.exno,.cycle,table.h td{font-family:var(--fnum)}
.big,.brand,.stitle,.exname,h2,.sc .n,.rs,.tabs button{text-transform:var(--ttl);letter-spacing:var(--ls)}
/* --- ورشة: ستنسل صناعي، شريط تحذير، ظل صلب --- */
html[data-th=plate] .hero{position:relative;overflow:hidden;padding-top:24px}
html[data-th=plate] .hero::before{content:'';position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(-45deg,#f2c200 0 12px,#0b0b0a 12px 24px)}
html[data-th=plate] .big{font-weight:900}
html[data-th=plate] .btn.pri{box-shadow:4px 4px 0 #000;border:2px solid #000}
html[data-th=plate] .btn.pri:active{box-shadow:none;transform:translate(3px,3px)}
html[data-th=plate] .top{border-bottom:3px solid var(--ac)}
html[data-th=plate] .tabs{border-top:3px solid var(--ac)}
html[data-th=plate] .tabs button.on{background:var(--ac);color:#111;box-shadow:none}
html[data-th=plate] .sc{border-inline-start-width:8px}
html[data-th=plate] .ex.core{border-inline-start-width:8px}
html[data-th=plate] .scell .inp{background:#000;border:2px solid var(--bd)}
html[data-th=plate] .scell .inp:focus{border-color:var(--ac)}
/* --- دفتر: ورق مسطّر، حبر أزرق، كروت كأنها ملصوقة --- */
html[data-th=book] body,html[data-th=book] #sess{background-color:var(--bg);background-image:repeating-linear-gradient(transparent 0 31px,rgba(60,90,160,.2) 31px 32px),linear-gradient(90deg,transparent 0 46px,rgba(190,60,50,.35) 46px 47px,transparent 47px)}
html[data-th=book] .top,html[data-th=book] .shead{background:var(--bg)}
html[data-th=book] .top{border-bottom:2px double var(--bd)}
html[data-th=book] .big,html[data-th=book] .brand{font-style:italic;font-weight:700}
html[data-th=book] .card,html[data-th=book] .ex{background-image:none}
html[data-th=book] .hero{background:var(--hero);border-style:solid}
html[data-th=book] .sc:nth-child(odd){transform:rotate(-.35deg)}
html[data-th=book] .sc:nth-child(even){transform:rotate(.3deg)}
html[data-th=book] .btn.pri{box-shadow:2px 3px 0 rgba(31,36,48,.35)}
html[data-th=book] .tabs{background:var(--s1);border-top:2px double var(--bd)}
html[data-th=book] .scell .inp,html[data-th=book] .wrow{background:#fffdf5}
html[data-th=book] .inp{background:#fffdf5}
html[data-th=book] .mbox{background:var(--s1)}
/* --- نبض: شاشة قياس، شبكة، توهّج --- */
html[data-th=pulse] body,html[data-th=pulse] #sess{background-image:linear-gradient(rgba(25,227,193,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,193,.05) 1px,transparent 1px);background-size:26px 26px}
html[data-th=pulse] .hero{border-color:var(--ac);box-shadow:0 0 0 1px var(--acbd),0 0 26px rgba(25,227,193,.22)}
html[data-th=pulse] .big{font-weight:700;text-shadow:0 0 14px rgba(25,227,193,.35)}
html[data-th=pulse] .btn.pri{box-shadow:0 0 18px rgba(25,227,193,.45);font-weight:800}

#sess .r2 .tgt{display:block;margin:0;flex:1;min-width:0;font-size:12px;line-height:1.4}
#sess .r2 .tgt b{font-size:14px;margin-inline-end:6px}
#sess .wrow{margin:0;padding:3px;gap:2px;flex:none}
#sess .wrow .wi{width:56px;flex:none;font-size:20px;min-height:38px}
#sess .wrow .un{width:auto;font-size:12px}
#sess .pmsg{font-size:12px;padding:3px 8px;margin-top:5px}
#sess .sets{margin-top:7px;gap:6px;align-items:center;flex-wrap:wrap}
#sess .scell{flex:1 1 44px;min-width:44px}
#sess .scell .inp{height:46px;font-size:20px}
#sess .sadd{flex-direction:column;gap:3px;flex:none}
#sess .sadd .sb{width:30px;height:21px;font-size:14px}
#sess .mini{font-size:13px;padding:5px 11px;min-height:32px}
#sess .mini.fill{color:var(--ac2);border-color:var(--acbd)}

#sess .cl.big input{width:18px;height:18px}
#sess .meta2{gap:8px;margin-bottom:8px}
#sess .meta2 .inp{min-height:38px;font-size:14px}

#sess .ex,html[data-th] #sess .ex{background:var(--scb);border:1px solid var(--bd);border-inline-start-width:3px}
#sess .ex.dn,html[data-th] #sess .ex.dn{background:color-mix(in srgb,var(--ok) 10%,var(--scb));border-color:var(--okbd)}
#sess .ex.wn,html[data-th] #sess .ex.wn{background:color-mix(in srgb,var(--mid) 9%,var(--scb));border-color:var(--midbd)}
#sess .ex .inp,#sess .ex .wrow{background:var(--sci);border-color:var(--bd)}
#sess .nrow{display:flex;gap:6px;margin-top:7px;align-items:center}
#sess .nrow .noteI{flex:1;min-width:0;height:36px;font-size:13.5px;padding:0 10px;margin:0}
#sess .nrow .mini{flex:none;white-space:nowrap}
#sess .tnote{background:var(--sci);margin-top:6px;line-height:1.6}
#sess .tnote .pmsg{margin-top:5px}
.srow{display:flex;gap:8px;margin-bottom:8px}.srow .inp{flex:1;min-width:0}.srow .btn{flex:none;white-space:nowrap;font-size:13px;padding:0 12px}
#sess .wrow{padding:3px 10px 3px 4px;gap:4px}#sess .wrow .wi{width:84px}

html .brand .wm{align-items:center;gap:6px}
html .brand .wm i,html[data-th] .brand .wm i{font-size:15px;font-weight:300;letter-spacing:.16em;margin:0;color:var(--tx);opacity:1}
html .brand .wm b,html[data-th] .brand .wm b{font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--ac2);opacity:1}
.lhist{margin-top:12px}.lht{font-size:13px;color:var(--mu);margin-bottom:4px}.lht b{color:var(--tx)}.tag.cnt{background:var(--s2);color:var(--tx2)}
html[data-th=granite] #sess .ex{background:linear-gradient(180deg,#14181d,#0f1317);border-color:rgba(255,255,255,.08);border-bottom:1px solid rgba(216,193,140,.35)}
html[data-th=granite] #sess .ex.dn{background:linear-gradient(180deg,#14221b,#0f1a15);border-color:var(--okbd)}
html[data-th=granite] #sess .ex.wn{background:linear-gradient(180deg,#221e14,#1a170f);border-color:var(--midbd)}
/* ===== v49: أهداف لمس أكبر + placeholder أوضح إنه مقترح ===== */
#sess .sadd{gap:6px}
#sess .sadd .sb{width:44px;height:40px;font-size:20px}
#sess .shead .btn{min-height:44px;min-width:56px}
#sess .nrow .noteI{height:44px}
#sess .nrow .mini{min-height:44px;padding:4px 14px}
#sess .wrow .wi{min-height:44px}
#sess .meta2 .inp{min-height:44px}
#sess .exname{min-height:44px;display:flex;align-items:center}
#sess .scell .inp::placeholder{color:var(--mu);opacity:.55;font-weight:500;font-size:17px}

const HIST=[];/* السجل القديم اتشال من الكود العام (v50). بياناتك على الموبايل وفي النسخ الاحتياطية */
function histSess(h,id){
  const dd=h.id?S.program.days.find(d=>d.id===h.id):null;
  const ex=h.ex.map(e=>{
    const pe=S.program.days.flatMap(d=>d.ex).find(q=>q.name===e.n);
    const top=Math.max(...e.s);
    return{exId:pe?pe.id:'h:'+e.n,name:e.n,unit:e.u||'',core:false,goal:top,tsets:e.s.length,treps:top,w:e.w,sets:e.s.slice(),clean:false,note:e.t||''};
  });
  return{id,date:h.d,day:dd?dd.id:'',dayName:dd?dd.name:h.dn,cycle:h.c,status:'full',ts:new Date(h.d+'T12:00:00').getTime(),ex,imp:1};
}
function importHist(){
  if((S.mig||0)>=3)return 0;
  const have=new Set(S.sessions.map(s=>s.date));let n=0;
  for(const h of HIST){if(have.has(h.d))continue;S.sessions.push(histSess(h,uid()+n));n++}
  S.impN=n;return n;
}
/* v4: سجل كامل من الملاحظات القديمة. بيستبدل الجلسات المستوردة بس، وجلساتك اللي سجلتها بنفسك مبتتلمسش */
function importHist4(){
  const by=new Map(S.sessions.map(s=>[s.date,s]));let n=0;
  for(const h of HIST){
    const old=by.get(h.d);if(old&&!old.imp)continue;
    if(old){const i=S.sessions.indexOf(old);S.sessions[i]=histSess(h,old.id)}else S.sessions.push(histSess(h,uid()+n));
    n++;
  }
  S.impN=n;return n;
}
function migrate(){
  if((S.mig||0)<2){
    for(const d of S.program.days){
      const sp=d.ex.find(e=>e.name==='Shoulder Press');if(sp)sp.core=false;
      if(d.id==='L1'||d.id==='L2'){const i=d.ex.findIndex(e=>e.name==='Plank');if(i===0&&d.ex.length>1)d.ex.push(d.ex.splice(0,1)[0])}
    }
    S.mig=2;pendMig=true;
  }
  if((S.mig||0)<3){importHist();S.mig=3}
  if((S.mig||0)<4){importHist4();S.mig=4}
  if((S.mig||0)<5){for(const x of S.sessions)if(x.imp){const dd=S.program.days.find(d=>d.name===x.dayName);x.status=dd&&dd.ex.every(t=>x.ex.some(e=>e.name===t.name))?'full':'imp'}S.mig=5}
}

  LANG=S.settings.lang;
  migrate();
  /* مسودة قديمة: لو اليوم ده اتحفظ فعلًا بنفس التاريخ، أو المسودة فاضية وقديمة، تتشال */
  if(S.draft&&!S.draft.editing){
    const dr=S.draft,filled=(dr.ex||[]).some(e=>(e.sets||[]).some(v=>String(v).trim()!==''));
    const saved=S.sessions.some(x=>x.date===dr.date&&(x.day===dr.day||x.dayName===dr.dayName));
    if(!filled&&(saved||dr.date<today()))S.draft=null;
  }
  await loadSync();
  save();await sq;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}

function calcCycle(dayId){const l=done()[0];if(!l)return S.settings.cycle||1;const o=S.program.days.map(d=>d.id),i=dayIdx(l);return i<0?l.cycle:(o.indexOf(dayId)<=i?l.cycle+1:l.cycle)}

function exHist(exId,skip){const out=[];
  const me=S.program.days.flatMap(d=>d.ex).find(x=>x.id===exId),nm=me?nk(me.name):null;
  for(const s of done()){if(s.id===skip)continue;const e=s.ex.find(x=>x.exId===exId)||(nm&&s.ex.find(x=>nk(x.name)===nm));if(e)out.push(Object.assign({date:s.date,cycle:s.cycle},e))}return out}

function setsStr(e){const a=e.sets;const u=e.unit?' '+unitTxt(e.unit):'';if(!a.length)return '';return a.every(r=>r===a[0])?`${a.length}×${a[0]}${u}`:a.join('/')+u}

/* قاعدة الزيادة: الهدف كامل في يومين منفصلين على نفس الوزن */
function progState(t,h){
  if(!h.length)return null;
  const W=+h[0].w||0;let q=0,n=0;
  for(const x of h){if((+x.w||0)!==W)break;n++;if(x.sets.length>=t.sets&&x.sets.every(r=>r>=t.goal))q++}
  if(q>=2)return{k:'up'};if(n>=5)return{k:'stuck',n};if(q===1)return{k:'q1'};return null;
}
function progMsg(t,h,unit){
  const p=progState(t,h);if(!p)return null;const L=T();
  if(p.k==='up')return{c:'ok',t:unit?L.pUpU(t.sets,t.goal):L.pUp(t.sets,t.goal)};
  if(p.k==='stuck')return{c:'bad',t:L.pStuck(p.n)};
  return{c:'mid',t:L.pQ1(t.sets,t.goal)};
}
function cardText(s){
  const L=[`Cycle ${s.cycle}`,`${s.dayName} — ${s.date}`,''];
  for(const e of s.ex){L.push(e.name);L.push(`${fw(e.w)} | ${setsStr(e)}${e.clean?' | '+T().clean:''}`);if(e.note)L.push(e.note);L.push('')}
  const d=S.program.days.find(x=>x.id===s.day);const c=d?coreNames(d):s.ex.filter(e=>e.core).map(e=>e.name);
  if(c.length)L.push(T().coreLine+': '+c.join(' + '));
  return L.join('\n').trim();
}
function tplCard(d){

  for(const t of d.ex){const l=exHist(t.id)[0];L.push(t.name);L.push(`${fw(l?l.w:t.w)} | ${t.sets}×${t.reps}${t.unit?' '+unitTxt(t.unit):''}`);if(t.note)L.push(t.note);L.push('')}

/* نص منظم للتحليل بالذكاء الاصطناعي */
function aiText(s,skip){
  const L=T(),out=[];
  const dObj=S.program.days.find(x=>x.id===s.day);
  const tpl=dObj?dObj.ex:[];
  const coreAll=tpl.filter(t=>t.core),coreDone=coreAll.filter(t=>s.ex.some(e=>e.exId===t.id)).length;
  out.push(L.aiHead(s.dayName,s.cycle));
  out.push(`${L.aiDate}: ${s.date} (${fmtD(s.date)})`);
  if(coreAll.length)out.push(L.aiCore(coreDone,coreAll.length));
  out.push(L.aiUnits);out.push(L.aiRule);out.push('');
  s.ex.forEach((e,i)=>{
    const u=e.unit?' '+unitTxt(e.unit):'';
    out.push(`${i+1}. ${e.name}${e.core?' '+L.aiCoreTag:''}`);
    out.push(`   ${L.aiTarget}: ${e.tsets||e.sets.length}×${e.treps||''}${u}`);
    out.push(`   ${L.aiWeight}: ${noW(e.w)?(e.unit?'—':L.bw):(+e.w)+' kg'}`);
    out.push(`   ${L.aiSets}: ${e.sets.join(', ')}${u}`);
    if(e.clean)out.push(`   ${L.aiForm}: ${L.aiClean}`);
    const h=exHist(e.exId,skip).filter(x=>x.date<=s.date);const prev=h[0];
    if(prev)out.push(`   ${L.aiLast} (${prev.date}): ${noW(prev.w)?'—':(+prev.w)+' kg'} — ${prev.sets.join('/')}${u}${prev.clean?', '+L.clean:''}`);
    const p=progState({sets:e.tsets||e.sets.length,goal:e.goal||e.treps||12},[Object.assign({date:s.date},e)].concat(h));
    if(p)out.push(`   ${L.aiStatus}: ${p.k==='stuck'?L.st2.stuck(p.n):L.st2[p.k]}`);
    if(e.note)out.push(`   ${L.aiNote}: ${e.note}`);
    out.push('');
  });
  const miss=tpl.filter(t=>!s.ex.some(e=>e.exId===t.id)).map(t=>t.name);
  if(miss.length)out.push(`${L.aiNotDone}: ${miss.join(', ')}`);
  return out.join('\n').trim();
}

['DB Shoulder Press','shoulders',10,3,10,'','اقعد بضهر مسنود، دمبل عند الأذن. ادفع لفوق من غير ما تقفل الكوع وتحكّم في النزول. ماتقوّسش ضهرك.','Seated with back support, dumbbells at ear level. Press up without hard lockout and lower under control. Do not arch the back.'],
['Lateral Raises','shoulders',5,3,15,'','واقف، دمبل في كل إيد. ارفع دراعك للجنب لحد مستوى الكتف والكوع مثني شوية، والرسغ مستقيم. نزّل ببطء. الوزن الخفيف أحسن من المرجحة.','Standing, dumbbells at sides. Raise arms out to shoulder height, elbows slightly bent, wrists straight. Lower slowly. Light and strict beats heavy and swingy.'],
['Face Pull','shoulders',35,3,15,'','كابل على مستوى الوش بحبل. اسحب ناحية وشك والكوع عالي وبره، واعصر لوح الكتف ثانيتين. ده تمرين صحة الكتف الخلفي.','Rope at face height. Pull toward your face with elbows high and out, squeeze the shoulder blades for two seconds. Great for shoulder health.'],
['Rear Delt Fly','shoulders',5,3,15,'','مايل لقدام بضهر مستقيم. ارفع الدمبلات للجنب بكوع مثني شوية وعضلة الكتف الخلفية هي اللي بتشتغل. ماتسحبش بالضهر.','Hinge forward, back flat. Raise dumbbells out to the sides with slightly bent elbows, feeling the rear delts. Do not heave with the back.'],
['Front Raise','shoulders',5,3,12,'','واقف، ارفع الدمبل لقدام لحد مستوى الكتف بدراع شبه مفرود ونزّل ببطء. من غير ميل لورا.','Standing, raise the dumbbell forward to shoulder height with a nearly straight arm and lower slowly. Do not lean back.'],
['DB Shrugs','shoulders',20,3,15,'','دمبل في كل إيد، ارفع كتفك ناحية ودانك واثبت ثانية ونزّل ببطء. رفع ونزول مستقيم من غير دواير.','Dumbbell in each hand, lift shoulders toward ears, hold a second, lower slowly. Straight up and down, no circles.'],
['Triceps Pushdown','arms',25,3,12,'','واقف قدام الكابل، كوعك ثابت على جنبك. ادفع لتحت لحد ما دراعك يتفرد، والحركة من الساعد بس. ارجع ببطء.','Stand at the cable, elbows pinned to your sides. Push down until the arms are straight, moving only the forearms. Return slowly.'],
['Cable Overhead Extension','arms',15,3,12,'','ضهرك للجهاز والحبل من ورا راسك. افرد الكوع لقدام وفوق وكوعك ثابت قريّب من ودنك. ارجع ببطء.','Face away from the machine, rope behind your head. Extend the elbows forward and up, elbows fixed close to your ears. Return slowly.'],
['Overhead Triceps Extension (DB)','arms',15,3,12,'','دمبل واحد بإيديك الاتنين فوق راسك. نزّله ورا راسك بالكوع الثابت وارفع. حكم القبضة كويس قبل ما تبدأ.','One dumbbell held with both hands overhead. Lower behind the head with fixed elbows and press up. Secure your grip first.'],
['Bench Dips','arms',0,3,12,'','إيدك على حرف البنش ورجلك قدامك. انزل لحد ما الكوع يبقى ٩٠ درجة بس وارفع. لو الكتف بيوجعك، سيبها.','Hands on a bench edge, feet in front. Lower until elbows reach 90° only, then press up. Skip it if the shoulder complains.'],
['Biceps Curl','arms',7.5,3,10,'','دمبل في كل إيد، الكوع ثابت جنبك. اطلع بالدمبل ونزّل ببطء من غير مرجحة ولا ميل بالضهر.','Dumbbell in each hand, elbows fixed at your sides. Curl up and lower slowly with no swinging or leaning back.'],
['Hammer Curl','arms',7.5,3,10,'','كفوفك باصين لبعض (زي المطرقة). اطلع بالدمبل والكوع ثابت ونزّل ببطء. بيشتغل الساعد مع الباي.','Palms facing each other like a hammer. Curl up with fixed elbows and lower slowly. Works the forearm along with the biceps.'],
['EZ Bar Curl','arms',15,3,10,'','امسك البار المتعرّج بقبضة مريحة. اطلع بالبار والكوع ثابت ونزّل ببطء. القبضة دي أريح للمعصم.','Grip the EZ bar comfortably. Curl up with fixed elbows and lower slowly. The angled grip is easier on the wrists.'],
['Cable Curl','arms',15,3,12,'','واقف قدام الكابل التحتاني، الكوع ثابت. اطلع بالبار ونزّل ببطء، والكابل بيدّي شد طول الحركة.','Face the low cable, elbows fixed. Curl up and lower slowly; the cable keeps constant tension.'],
['Preacher Curl','arms',10,3,10,'','دراعك على المسند المايل. نزّل لحد ما الدراع يتفرد تقريبًا بتحكم واطلع من غير ما ترفع كتفك.','Arms on the angled pad. Lower until nearly straight under control and curl up without lifting the shoulders.'],
['Wrist Curl + Reverse','arms',20,2,15,'','ساعدك على فخذك والرسغ بره الركبة. الكف لفوق: ارفع الرسغ لفوق، وبعدين الكف لتحت: ارفع ضهر الإيد لفوق. الساعد ثابت، والرسغ بس هو اللي بيتحرك. حركة بطيئة.','Forearms on thighs, wrists past the knees. Palms up: curl the wrist up. Then palms down: raise the back of the hand. Only the wrist moves; go slowly.'],
['Leg Press','legs',60,3,10,'','ضهرك ومؤخرتك لازقين في الكرسي طول الحركة. انزل لحد زاوية ٩٠ درجة تقريبًا ومتنزلش أعمق من نقطة ما المؤخرة تتحرك. ادفع من الكعب وماتقفلش الركبة فوق.','Back and hips flat on the seat throughout. Lower to about 90° and not deeper than where the hips lift. Push through the heels; do not lock the knees.'],
['Hack Squat','legs',40,3,10,'','ضهرك على المسند وقدمك قدّام شوية. انزل ٣ ثواني ببطء وادفع من كعبك لفوق، والركبة في خط الصوابع مش جوّه.','Back on the pad, feet slightly forward. Lower for three seconds and drive up through the heels; knees track over the toes, not inward.'],
['Goblet Squat','legs',12,3,12,'','دمبل قدّام صدرك. انزل بالقرفصاء لحد ما فخادك توازي الأرض وضهرك مستقيم والكعب على الأرض، وقوم.','Dumbbell at the chest. Squat until thighs are parallel, back straight, heels down, then stand.'],
['Romanian Deadlift','legs',20,3,10,'','دمبلات قدام فخادك، ركبتك مثنية شوية. ادفع الحوض لورا وانزل بالدمبلات على رجلك وضهرك مستقيم لحد ما تحس بشد ورا الفخذ، وارجع بالحوض.','Dumbbells in front of the thighs, knees slightly bent. Push the hips back, slide the weights down the legs with a flat back until you feel the hamstrings, drive hips forward.'],
['Leg Extension','legs',25,3,12,'','اقعد وضهرك لازق. افرد رجلك لقدّام واعصر فوق ثانية ونزّل ببطء. راقب الركبة، ولو وجعت وقّف.','Sit with back flat. Extend the legs, squeeze at the top for a second, lower slowly. Watch the knees; stop if they hurt.'],
['Leg Curl','legs',25,3,12,'','الوسادة فوق الكعب. اسحب بخلفية الفخذ من غير مرجحة ولا رفع للحوض، ونزّل ببطء.','Pad just above the heels. Curl with the hamstrings, no swinging or hip lift, lower slowly.'],
['Calf Raises','legs',25,3,15,'','اطلع على أطراف صوابعك لأعلى نقطة واثبت ثانية، ونزّل لآخر مدى. مدى كامل أهم من الوزن.','Rise onto the toes, hold a second at the top, lower to a full stretch. Full range matters more than weight.'],
['Seated Calf Raise','legs',25,3,15,'','اقعد والوسادة على فخادك. ارفع كعبك لفوق واثبت ثانية ونزّل لآخر مدى. بيشتغل السمانة التحتانية.','Seated with the pad on your thighs. Raise the heels, hold a second, lower fully. Targets the deeper calf muscle.'],
['Walking Lunges','legs',8,3,12,'','دمبل في كل إيد. خطوة كبيرة لقدام وانزل بالركبة الخلفية لقرب الأرض وجذعك مستقيم، وقوم وبدّل. الركبة الأمامية ماتعدّيش صوابعك.','Dumbbells in hand. Step long, lower the back knee near the floor with an upright torso, push up and switch. Front knee stays behind the toes.'],
['Hip Thrust','legs',20,3,12,'','ضهرك العلوي على بنش ودمبل على حوضك. ادفع بحوضك لفوق لحد ما جسمك خط مستقيم واعصر المؤخرة ثانية، ونزّل ببطء.','Upper back on a bench, dumbbell on the hips. Drive the hips up to a straight line and squeeze the glutes for a second, lower slowly.'],
['Plank','core',0,3,45,'ث','على كوعك وأصابع رجلك، جسمك خط مستقيم من الراس للكعب وبطنك مشدودة. ماتسيبش وسطك ينزل ولا المؤخرة ترتفع. اتنفس عادي.','On forearms and toes, body in a straight line from head to heels, abs tight. Do not let the hips sag or rise. Keep breathing.'],
['Side Plank','core',0,2,30,'ث','على كوعك وجنب رجلك، ارفع حوضك لخط مستقيم. اثبت المدة واعمل الناحيتين.','On one forearm and the side of the foot, lift the hips into a straight line. Hold, then switch sides.'],
['Dead Bug','core',0,3,10,'','نايم على ضهرك، إيدك ورجلك لفوق. نزّل إيد ورجل عكس بعض ببطء وضهرك لازق في الأرض، وبدّل.','On your back, arms and legs up. Lower opposite arm and leg slowly while keeping the lower back on the floor, then switch.'],
['Hanging Knee Raise','core',0,3,10,'','متعلّق في البار، اطلع بركبتك لصدرك ببطء من غير مرجحة ونزّل بتحكم.','Hang from the bar, raise knees to the chest slowly without swinging, lower under control.'],
['Cable Crunch','core',20,3,12,'','راكع قدام الكابل بحبل عند راسك. اطلع بنفسك لتحت بتقوّس بطنك والحوض ثابت، وارجع ببطء.','Kneel facing the cable with the rope at the head. Crunch down by curling the abs while the hips stay fixed; return slowly.'],
["Farmer's Walk",'core',20,3,25,'خطوة','دمبل تقيل في كل إيد. امشي بخطوات ثابتة وكتفك لورا وجذعك مشدود. القبضة هي أول نقطة تلامس، وماتسيبش الوزن لحد ما تخلّص الخطوات.','A heavy dumbbell in each hand. Walk with steady steps, shoulders back, torso tight. Grip is the limiter; do not drop the weights until the steps are done.']
];

const sysName=s=>(LANG==='ar'?s.ar:s.en)[0],sysDesc=s=>(LANG==='ar'?s.ar:s.en)[1];
function sysInit(){if(!S.sys)S.sys={cur:'ul4',saved:{}}}
function switchSys(id){
  sysInit();const sp=SYSTEMS.find(x=>x.id===id);if(!sp||id===S.sys.cur)return;
  S.sys.saved[S.sys.cur]={days:S.program.days};
  let days=S.sys.saved[id]&&S.sys.saved[id].days;
  if(!days)days=(sp.days||[]).length?sp.days.map((d,k)=>({id:'D'+uid()+k,name:d[0],ex:d[1].map(x=>mk(x[0],x[1],x[2],x[3]))})):seed().program.days;
  delete S.sys.saved[id];S.program.days=days;S.sys.cur=id;pDay=days[0].id;save();queueBackup();
}

const DET={"Flat Dumbbell Press": ["صدر (الجزء الأوسط) + مقدمة الكتف + ترايسبس", "اضبط البنش مسطح. اقعد والدمبلين على فخدك، وارجع لورا وارفعهم لمستوى الصدر بمساعدة الركبة. اسند ضهرك على البنش، اضغط كتفك لورا ولتحت (كأنك بتحط لوحين كتف في جيبك)، وارجلك ثابتة على الأرض.", "انزل بالدمبل ٢–٣ ثواني لحد ما الكوع يوصل لمستوى الصدر وتحس بتمدد. ادفع لفوق في حركة قوسية لحد ما الدمبلين يتقابلوا فوق صدرك من غير ما يخبطوا. زفير وإنت بتدفع، وشهيق وإنت بتنزل.", "نزول سريع وارتداد على الصدر. كوع مفتوح ٩٠ درجة على الجنب (الأفضل ٤٥–٦٠ درجة). رفع الكتف للأذن. رفع المؤخرة من على البنش.", "لو الدمبل بيتهز أو الكتف بيوجعك، قلّل الوزن. الصدر هو اللي يشتغل، مش الكتف."], "Incline Dumbbell Press": ["أعلى الصدر + مقدمة الكتف + ترايسبس", "البنش مايل ٣٠–٤٥ درجة (مش أكتر وإلا يبقى كتف). اقعد وضهرك لازق، الكتف لورا ولتحت، والقدم ثابتة.", "انزل لحد جانب أعلى الصدر في ٢–٣ ثواني، الكوع ٤٥–٦٠ درجة من الجسم. ادفع لفوق وقرّب الدمبلين من بعض من غير تخبيط. ركّز إن أعلى الصدر هو اللي بيشتغل.", "بنش مايل زيادة فيتحوّل لكتف. تقويس الضهر وسحب الكتف لقدام. نزول لحد ما الكوع يعدي مستوى الكتف بكتير.", "لو مش حاسس بأعلى الصدر، خفّض الميل درجة وقلّل الوزن."], "Chest Press Machine": ["صدر + ترايسبس + مقدمة الكتف", "اضبط الكرسي بحيث المقابض في مستوى منتصف الصدر بالظبط. ضهرك وراسك لازقين في المسند والكتف لورا ولتحت. القدم ثابتة.", "ادفع المقابض لقدام لحد ما الدراع يتفرد تقريبًا من غير قفل عنيف، وارجع ببطء ٢–٣ ثواني لحد ما تحس بتمدد في الصدر. زفير وإنت بتدفع.", "رفع الكتف. فصل الضهر عن المسند. إسقاط الوزن بسرعة. قفل الكوع بعنف.", "الماكينة بتثبّتك، فركّز على العضلة وسيطر على النزول. ده تمرين ممتاز للوصول للفشل بأمان."], "Floor Press": ["صدر + ترايسبس (مدى حركة محدود وآمن على الكتف)", "نايم على الأرض، الركب مثنية والقدم ثابتة. دمبل في كل إيد على صدرك، الكوع ٤٥–٦٠ درجة من الجسم.", "انزل ببطء لحد ما الكوع يلمس الأرض، وقف ثانية من غير ما تسترخي، وادفع لفوق بقوة. زفير وإنت بتدفع.", "ارتداد الكوع على الأرض. نزول سريع. فرد الكوع لبره ٩٠ درجة.", "التوقف على الأرض بيشيل ارتداد الحركة ويخلي القوة كلها من العضلة. وكمان بيحمي الكتف."], "Push-Up": ["صدر + ترايسبس + مقدمة الكتف + جذع", "إيدك أعرض من كتفك شوية تحت الصدر. الجسم خط مستقيم من الراس للكعب: شد البطن والمؤخرة، من غير ما الوسط يهبط.", "انزل بصدرك لحد ما يقرّب من الأرض في ٢ ثانية، الكوع ٤٥ درجة. ادفع لحد ما الدراع يتفرد. شهيق وإنت بتنزل، وزفير وإنت بتطلع. لو صعب، اعملها من الركبة.", "نزول نص حركة. الوسط بيهبط أو المؤخرة ترتفع. فتح الكوع على الجنب.", "الجودة قبل العدد. اعمل التمرين لحد ما الشكل يبوظ مش لحد ما تقع."], "Cable Fly": ["صدر (عزل) + مقدمة الكتف", "اضبط الكابلين على ارتفاع الكتف أو أعلى شوية. امسك مقبض في كل إيد، وقف خطوة لقدام برجل ثابتة، الصدر مفتوح والكوع مثني شوية ومتثبت.", "قرّب الإيدين قدام صدرك في قوس واسع كأنك بتحضن شجرة، وعصّر الصدر ثانية في النص. ارجع ببطء ٣ ثواني لحد ما تحس بتمدد جامد في الصدر.", "تحويل الحركة لضغط (ثني الكوع وفرده). وزن تقيل يخلّيك تتحرك بجسمك. رفع الكتف.", "زاوية الكوع تفضل ثابتة طول الحركة. التمدد في النهاية هو نص الفايدة."], "Pec Deck": ["صدر (عزل)", "اضبط الكرسي بحيث المقابض في مستوى الصدر. ضهرك لازق، الكتف لورا ولتحت، والكوع مثني شوية.", "قرّب الذراعين لبعض لحد ما تتقابل قدام صدرك وعصّر ثانية. ارجع ببطء ٣ ثواني ومتخلّيش الوزن يتلاشى (ماتسيبش الأوزان تخبط). متنزلش بالكوع وراء خط الجسم.", "رفع الكتف. استخدام الزخم. الرجوع لورا زيادة عن اللازم على الكتف.", "أحسن تمرين لـ \"التعصير\" في آخر التمرينة. خفّف الوزن واستمتع بالانقباض."], "Lat Pulldown": ["ظهر عريض (لات) + بايسبس + الجزء الخلفي للكتف", "اضبط الفخدين تحت الوسادة. امسك البار أعرض من كتفك بشوية. اميل ضهرك لورا شوية (١٠–١٥ درجة)، الصدر طالع.", "ابدأ بشد لوح الكتف لتحت، وبعدين اسحب البار لحد أعلى الصدر وكأنك بتضغط كوعك في جيبك. عصّر ثانية، وارجع ببطء لحد ما الدراع يتفرد وتحس بتمدد في اللات.", "سحب البار ورا الرقبة. تأرجح بالجسم كله. السحب بالإيد بدل الضهر.", "فكّر إنك بتسحب بكوعك مش بإيدك. ركّز على إن الضهر هو اللي يشتغل."], "Seated Row": ["منتصف الظهر + لات + بايسبس + مؤخرة الكتف", "اقعد وصدرك على المسند (أو ضهرك مستقيم). الركب مثنية شوية. امسك المقبض والدراع متفرد وضهرك محايد.", "اسحب المقبض لبطنك وقرّب لوحي الكتف من بعض، وعصّر ثانية. ارجع ببطء وسيب الكتف يتمدد لقدام وانت ضهرك مستقيم.", "لف الضهر وتأرجح. شد الكتف للأذن. سحب بالبايسبس بس.", "تخيّل إنك بتحط كوعك في جيبك الورانيّ. مش رقم الوزن اللي يهم، الانقباض هو اللي يهم."], "T-Bar Row": ["منتصف وسُمك الظهر + لات + مؤخرة الكتف", "قف على الماكينة والصدر على الوسادة (لو فيه) أو انحنِ ٤٥ درجة وضهرك مستقيم. امسك المقابض والركبة مثنية شوية.", "اسحب الوزن ناحية بطنك مع تقريب لوحي الكتف، وعصّر ثانية. انزل ببطء لحد ما الدراع يتفرد بدون ما تدوّر ضهرك.", "تدوير الضهر. استخدام الجسم كله للدفع. رفع الراس زيادة.", "لو تحس بألم في أسفل الضهر، استخدم الوسادة أو قلّل الوزن."], "Chest-Supported Row": ["منتصف الظهر + لات + مؤخرة الكتف (من غير ضغط على أسفل الضهر)", "اضبط البنش المايل ٣٠–٤٥ درجة. نام على صدرك، دمبل في كل إيد والدراع متفرد، وراسك محايد.", "اسحب الدمبلين لجنبك وقرّب الكتفين، وعصّر ثانية. ارجع ببطء. الجسم ثابت تمامًا والحركة من الدراع والكتف.", "رفع الصدر من البنش. شد بالرقبة. الحركة بالزخم.", "لأنك مسنود، مفيش غش. استخدم الوزن اللي يخلّيك تحس بالظهر، مش الدراع."], "One-Arm DB Row": ["لات + منتصف الظهر + بايسبس", "حط ركبة وإيد على بنش، الضهر مستقيم والموازي للأرض. الدمبل في الإيد التانية والدراع متفرد.", "اسحب الدمبل ناحية وركك مش ناحية كتفك، مع تقريب لوح الكتف. عصّر ثانية وارجع ببطء. ثبّت الجسم بدون لف.", "لف الكتف والجسم عشان ترفع. سحب الدمبل لفوق ناحية الكتف. تدوير الضهر.", "فكّر إنك بتحط الدمبل في جيب البنطلون. اعمل نفس العدّات للجنبين."], "Straight-Arm Pulldown": ["لات (عزل)", "قف قدام الكابل العالي، امسك البار أو الحبل والدراع متفرد، وانحنِ شوية من الوسط والضهر مستقيم.", "نزّل الإيدين لحد الفخدين مع الدراع متفرد تقريبًا، وعصّر اللات ثانية. ارجع ببطء لحد ما تحس بتمدد.", "ثني الكوع كتير فيتحوّل لسحب. استخدام الجسم للتأرجح. وزن تقيل.", "تمرين عزل. وزن خفيف وانقباض قوي. ممتاز كإحماء للات."], "Pull-Up": ["لات + بايسبس + منتصف الظهر + قبضة", "امسك البار أعرض من كتفك، كف لبره. علّق بدراع متفرد، اضغط الكتف لتحت، وشد البطن.", "اسحب نفسك لحد ما دقنك تعدي البار وإنت بتقرّب الكوع من جسمك. عصّر ثانية، وانزل ٣ ثواني لحد ما الدراع يتفرد تمامًا.", "تأرجح الجسم (kipping). نصف حركة. رفع الكتف للأذن.", "لو مش قادر تعمله كامل، اعمل نزول بطيء بس (٥ ثواني) أو استخدم ماكينة المساعدة."], "Back Extension": ["أسفل الضهر + مؤخرة + هامسترينج", "اضبط الماكينة بحيث الوسادة تحت عظمة الحوض. القدم ثابتة والجسم خط مستقيم والإيد على الصدر أو ورا الراس.", "انزل من الوسط ببطء لحد ما تحس بتمدد في الهامسترينج، وارجع لحد ما الجسم يبقى خط مستقيم. عصّر المؤخرة في الآخر.", "تقويس الضهر زيادة لفوق. استخدام الزخم. النزول لدرجة تدوّر الضهر.", "متتخطاش الخط المستقيم لفوق. الهدف تقوية مش تمدد زيادة."], "Shoulder Press": ["كتف (مقدمة وجانب) + ترايسبس", "اضبط الكرسي والمقابض على مستوى الكتف. ضهرك لازق، الصدر طالع، والبطن مشدود.", "ادفع لفوق لحد ما الدراع يتفرد تقريبًا، وارجع ببطء لحد ما الكوع يوصل لمستوى الكتف. زفير وإنت بتدفع.", "تقويس الضهر. رفع الكتف للأذن. نزول لحد تحت الكتف بكتير.", "لو بتدفع بقوة ومش حاسس بالكتف، قلّل الوزن وركّز على السيطرة."], "DB Shoulder Press": ["كتف + ترايسبس + جذع", "اقعد على بنش بضهر مستقيم (أو مايل ٨٥ درجة). الدمبلين عند الكتف والكوع تحتهم، الكف لقدام.", "ادفع لفوق لحد ما الدمبلين يتقابلوا فوق راسك من غير تخبيط. انزل ببطء لحد مستوى الأذن. الجذع مشدود.", "تقويس أسفل الضهر. تفتيح الكوع على الجنب بزيادة. رمي الدمبلين بسرعة.", "الدمبل بيحتاج توازن، فالوزن هيكون أقل من الماكينة. ده طبيعي."], "Lateral Raises": ["كتف جانبي (الجزء الأوسط)", "قف والدمبل في كل إيد جنب فخدك، الكوع مثني شوية، الصدر طالع، والجسم ثابت.", "ارفع الدمبلين على الجنب لحد مستوى الكتف، والكوع أعلى من الإيد شوية (كأنك بتصب مياه). وقف ثانية وانزل ٣ ثواني.", "تأرجح الجسم. رفع الدمبل فوق الكتف. شد الكتف للأذن. وزن تقيل.", "الوزن الخفيف هو الحل. الكتف الجانبي عضلة صغيرة بتتعب بسرعة."], "Face Pull": ["مؤخرة الكتف + منتصف الترابيس + الروتيتور كاف", "اضبط الكابل على مستوى الوجه. امسك الحبل والكف لجوه وقف خطوة لورا والجسم ثابت.", "اسحب الحبل ناحية وشك وافتح الإيدين على الجنب (كأنك بتعمل بايسبس مزدوج)، وعصّر لوحي الكتف. ارجع ببطء.", "وزن تقيل فتتأرجح. السحب لمستوى الصدر بدل الوجه. رفع الكتف.", "تمرين صحة للكتف. وزن خفيف وعدّات كتير (١٥–٢٠). ده بيحمي كتفك."], "Rear Delt Fly": ["مؤخرة الكتف + منتصف الظهر", "انحنِ من الوسط والضهر مستقيم (أو اقعد على البنش وصدرك على الوسادة). الدمبلين تحتك والكوع مثني شوية.", "افتح الدمبلين على الجنب لحد مستوى الظهر، وعصّر لوحي الكتف. وقف ثانية وارجع ببطء.", "تحريك الجسم. رفع الدمبل لفوق الظهر. وزن تقيل.", "ده عضلة صغيرة. وزن خفيف وانقباض قوي ٢ ثانية."], "Front Raise": ["مقدمة الكتف", "قف والدمبل في الإيد قدام فخدك، الكوع مثني شوية والجسم ثابت.", "ارفع الدمبل لقدام لحد مستوى الكتف، وقف ثانية وانزل ببطء. تبادل الإيدين أو معًا.", "تأرجح الجسم. رفع فوق الكتف. وزن تقيل.", "مقدمة الكتف بتشتغل أصلًا في كل تمارين الدفع. ده تمرين اختياري."], "DB Shrugs": ["الترابيس العلوي + قبضة", "قف والدمبل في كل إيد جنب فخدك، الدراع متفرد، والصدر طالع، والراس محايد.", "ارفع الكتف لأعلى ناحية الأذن، وعصّر ثانية في القمة، وانزل ببطء. من غير لف الكتف ولا ثني الكوع.", "لف الكتف في دايرة. ثني الكوع. حركة صغيرة جدًا.", "اضغط قبضتك وإنت بترفع عشان تدرّب القبضة معاها. حركة عمودية بس."], "Triceps Pushdown": ["ترايسبس (الرأس الجانبي والوسطي)", "قف قدام الكابل العالي، الكوع ملزق في جنبك والكف لتحت على البار أو الحبل. وقف خطوة والجسم ثابت.", "اضغط لتحت لحد ما الدراع يتفرد تمامًا وعصّر الترايسبس ثانية. ارجع ببطء لحد ما الدراع يوصل لـ ٩٠ درجة. الكوع ثابت.", "تحريك الكوع لقدام. استخدام الجسم والكتف. وزن تقيل.", "الكوع يفضل ملزق في جنبك طول الحركة. الحركة من الكوع بس."], "Cable Overhead Extension": ["ترايسبس (الرأس الطويل) — أكبر جزء في الدراع", "اضبط الكابل على الأرض (أو أسفل)، وقف وضهرك للماكينة، امسك الحبل فوق راسك والكوع مثني.", "افرد الدراع لفوق مع تثبيت الكوع جنب الراس. عصّر ثانية وارجع ببطء لحد ما تحس بتمدد جامد.", "فتح الكوع على الجنب. تقويس الضهر. استخدام الجسم.", "الرأس الطويل بيشتغل أكتر لما الدراع فوق الراس. ده أهم تمرين لحجم الترايسبس."], "Overhead Triceps Extension (DB)": ["ترايسبس (الرأس الطويل)", "اقعد أو قف وامسك دمبل بالإيدين من تحته، فوق راسك والدراع متفرد. الكوع قريب من الراس.", "انزل الدمبل ورا راسك لحد ما الكوع يوصل لـ ٩٠ درجة أو أكتر، وارجع لفوق وعصّر الترايسبس. الكوع ثابت.", "فتح الكوع لبره. تقويس الضهر. نزول سريع وارتداد.", "لو الدمبل ثقيل، اعمل الحركة بإيد واحدة. التمدد في الأسفل هو الفايدة."], "Bench Dips": ["ترايسبس + مقدمة الكتف + صدر سفلي", "إيدك ورا ضهرك على بنش، الأصابع لقدام، والرجلين مفرودة (أو مثنية لو صعب). الكوع ورا.", "انزل بجسمك لحد ما الكوع يوصل ٩٠ درجة، وادفع لفوق وعصّر الترايسبس. زفير وإنت بتطلع.", "نزول زيادة بيضغط الكتف. فتح الكوع لبره. رفع الكتف.", "لو بيوجعك الكتف، وقف أو اعمل بديل بالكابل. الكتف أهم."], "Biceps Curl": ["بايسبس + براكيالس", "قف والدمبل في كل إيد، الكف لقدام، الكوع ملزق في جنبك، والصدر طالع.", "اثني الكوع لحد ما الدمبل يوصل الكتف، وعصّر البايسبس ثانية. انزل ٣ ثواني لحد ما الدراع يتفرد تمامًا.", "تأرجح الجسم. تحريك الكوع لقدام. نزول نص حركة.", "لو الجسم بيتحرك، الوزن تقيل. حرّك الكوع في مكانه."], "Hammer Curl": ["براكيالس + الساعد + بايسبس", "قف والدمبل في كل إيد، الكف لجوه (كأنك ماسك شاكوش). الكوع ملزق.", "اثني لحد الكتف وعصّر ثانية. انزل ببطء. تبادل الإيدين أو معًا.", "تأرجح. تحريك الكوع. وزن تقيل.", "بيضخّم سمك الدراع والساعد. بيحمي الكوع أكتر من الكيرل العادي."], "EZ Bar Curl": ["بايسبس", "امسك البار على الجزء المتعرج بقبضة كف لفوق. قف والكوع ملزق والصدر طالع.", "اثني الكوع لحد الصدر وعصّر ثانية. انزل ببطء ٣ ثواني.", "تأرجح الجسم. تحريك الكوع. نزول جزئي.", "القبضة المائلة أريح على المعصم من البار المستقيم."], "Cable Curl": ["بايسبس", "قف قدام الكابل المنخفض، امسك البار أو الحبل، الكوع ملزق.", "اثني لحد الكتف وعصّر ثانية. انزل ببطء. الكابل بيدّيك شد ثابت طول الحركة.", "تحريك الجسم. الكوع بيتحرك. نزول سريع.", "الكابل بيحافظ على الشد حتى في آخر الحركة، فبيكمّل التمارين التانية كويس."], "Preacher Curl": ["بايسبس (الرأس القصير) — عزل كامل", "اقعد وإيدك على وسادة البريتشر والكوع في أول الوسادة. امسك البار أو الدمبل.", "اثني لحد الكتف وعصّر. انزل ببطء ٣ ثواني ومتفردش الدراع تمامًا لو بتحس بشد زيادة على الكوع.", "نزول سريع وفرد مفاجئ بيضر الكوع. رفع الكتف.", "دقة التمرين دي أهم من الوزن. الوسادة بتشيل الغش."], "Wrist Curl + Reverse": ["الساعد (ثانيات وباسطات) + قبضة", "اقعد وحط الساعد على فخدك أو بنش، الإيد برا الحافة والكف لفوق (للثني) أو لتحت (للبسط). دمبل خفيف.", "ثني المعصم لفوق ببطء وعصّر، وبعدين انزل. كرّر ثم اقلب الكف واعمل البسط. حركة المعصم بس.", "وزن تقيل. حركة سريعة. تحريك الساعد.", "الوزن خفيف جدًا. القبضة القوية بتحسّن كل تمارين السحب."], "Leg Press": ["كوادز + مؤخرة + هامسترينج", "اضبط الكرسي بحيث الركبة ٩٠ درجة تقريبًا في النزول. القدم على اللوح بعرض الكتف، وضهرك ومؤخرتك لازقين.", "انزل لحد ما الركبة تيجي ٩٠ درجة، وادفع بالكعب والقدم كلها. متقفلش الركبة بعنف في آخر الدفع. زفير وانت بتدفع.", "رفع المؤخرة من الكرسي (بيدوّر الضهر). نزول زيادة. قفل الركبة بعنف. ركبة بتتحرك لجوه.", "وضع القدم عالي = مؤخرة وهامسترينج أكتر. واطي = كوادز أكتر."], "Hack Squat": ["كوادز + مؤخرة", "وقف على اللوح، الكتف تحت الوسادة، والضهر لازق. القدم بعرض الكتف أو أعرض شوية.", "انزل لحد ما الفخد يوازي الأرض أو أكتر، وادفع بالكعب. الركبة تتحرك فوق الأصابع. زفير وإنت بتدفع.", "رفع الكعب. نزول زيادة بتدوير الضهر. قفل الركبة بعنف.", "ممتاز لتركيز الكوادز مع أمان على الضهر."], "Goblet Squat": ["كوادز + مؤخرة + جذع", "امسك دمبل بالإيدين قدام صدرك، القدم أعرض من الكتف شوية والأصابع لبره شوية.", "انزل لحد ما الفخد يوازي الأرض وكوعك بين ركبتيك، وصدرك طالع. ادفع بالكعب والقدم كلها. زفير وإنت بتطلع.", "دوران الركبة لجوه. رفع الكعب. تدوير الضهر.", "الدمبل قدامك بيخلّي الجسم مستقيم طبيعيًا. تعلّم السكوات بيه الأول."], "Romanian Deadlift": ["هامسترينج + مؤخرة + أسفل الضهر", "قف والبار (أو الدمبل) قدام فخدك، القدم بعرض الورك، والركبة مثنية شوية والصدر طالع.", "ادفع الورك لورا والبار قريب من رجلك لحد ما تحس بتمدد جامد في الهامسترينج (غالبًا تحت الركبة). ارجع بدفع الورك لقدام وعصّر المؤخرة. الضهر مستقيم طول الوقت.", "تدوير الضهر. ثني الركبة كتير فيتحوّل لسكوات. البار بعيد عن الجسم.", "حرّك الورك لورا مش الضهر لتحت. ابدأ بوزن خفيف جدًا لحد ما تتقن الحركة."], "Leg Extension": ["كوادز (عزل)", "اضبط الوسادة على مفصل الكعب. ضهرك لازق والركبة عند حافة الكرسي.", "افرد الرجل لحد ما تتفرد تقريبًا وعصّر الكوادز ثانية. انزل ببطء ٣ ثواني.", "حركة سريعة وارتداد. وزن تقيل. رفع المؤخرة.", "تمرين عزل. لو في ألم في الركبة، قلّل الوزن أو اعمل حركة أقل."], "Leg Curl": ["هامسترينج (عزل)", "اضبط الوسادة على الكعب. نام أو اقعد حسب الماكينة، والركبة على حافة الكرسي.", "اثني الركبة وقرّب الكعب من المؤخرة وعصّر ثانية. ارجع ببطء ٣ ثواني.", "رفع المؤخرة. حركة سريعة. وزن تقيل.", "الجزء السلبي (النزول البطيء) هو أهم جزء للهامسترينج."], "Calf Raises": ["سمانة (الغاستروكنيميوس)", "قف على حافة درجة أو ماكينة، الكعب في الهواء، والركبة متفردة تقريبًا.", "انزل الكعب لتحت لتمدد كامل، وارتفع لأقصى حد على أطراف الأصابع، وعصّر ثانية. حركة بطيئة ومتحكم فيها.", "حركة سريعة وارتداد. مدى حركة صغير. ثني الركبة.", "السمانة بتتحمل عدّات كتير. اعمل التمدد الكامل في كل مرة."], "Seated Calf Raise": ["سمانة (السوليوس)", "اقعد وحط الركبة تحت الوسادة وأصابعك على اللوح. الكعب حر.", "انزل الكعب لتمدد كامل وارتفع لأقصى حد، عصّر ثانية. حركة بطيئة.", "حركة سريعة. مدى صغير. رفع الركبة.", "مع الركبة المثنية، السوليوس هي اللي بتشتغل. ده بيكمّل التمرين الواقف."], "Walking Lunges": ["كوادز + مؤخرة + هامسترينج + توازن", "قف والدمبل في كل إيد جنبك والصدر طالع. خطوة كبيرة لقدام.", "انزل لحد ما الركبة الخلفية تقرب من الأرض والأمامية ٩٠ درجة. ادفع بالكعب الأمامي وتقدّم للخطوة التالية. زفير وإنت بتطلع.", "ركبة أمامية تعدي الأصابع كتير. خطوة صغيرة. تحرك الجسم لقدام.", "خطوة أكبر = مؤخرة أكتر. خطوة أصغر = كوادز أكتر."], "Hip Thrust": ["مؤخرة + هامسترينج", "ضهرك العلوي على بنش، القدم على الأرض بعرض الورك والركبة ٩٠ درجة في القمة. الوزن (بار أو دمبل) على الحوض.", "ادفع الورك لفوق بالكعب لحد ما الجسم يبقى خط مستقيم من الكتف للركبة، وعصّر المؤخرة ثانية. انزل ببطء.", "تقويس أسفل الضهر. رفع الذقن. قدم بعيدة أو قريبة زيادة.", "الذقن لتحت والنظر لقدام يمنع تقويس الضهر. عصّر المؤخرة بقوة."], "Plank": ["جذع (عضلات البطن العميقة) + كتف + مؤخرة", "على الساعد والكوع تحت الكتف، الجسم خط مستقيم من الراس للكعب. شد البطن والمؤخرة.", "اثبت في الوضع ده بدون ما الوسط يهبط ولا المؤخرة ترتفع. تنفس بانتظام. الهدف الوقت بالثواني.", "هبوط الوسط. رفع المؤخرة. حبس النفس.", "لو الشكل بيبوظ، وقف. ٣٠ ثانية بشكل كامل أحسن من ٦٠ بشكل غلط."], "Side Plank": ["جذع جانبي (المائل) + مؤخرة جانبية + كتف", "على الساعد والكوع تحت الكتف، الجسم خط مستقيم من الراس للكعب على الجنب. ارفع الحوض.", "اثبت مع الجسم خط مستقيم والحوض مرفوع. تنفس بانتظام. اعمل الجنبين بنفس الوقت.", "هبوط الحوض. لف الجسم لقدام أو ورا. حبس النفس.", "لو صعب، اثني الركبة السفلى وابدأ منها."], "Dead Bug": ["جذع (البطن العميقة) + تحكم في الضهر", "نام على ضهرك، الإيدين لفوق والركبة ٩٠ درجة فوق الورك. اضغط أسفل الضهر على الأرض.", "انزل دراع وساق من الجنب المعاكس ببطء، وأسفل ضهرك لازق في الأرض. ارجع وبدّل. زفير وإنت بتنزل.", "تقويس أسفل الضهر. حركة سريعة. حبس النفس.", "لو الضهر بيطلع من الأرض، قلّل مدى الحركة. التحكم أهم من المدى."], "Hanging Knee Raise": ["بطن سفلية + الفخد الأمامي + قبضة", "علّق على بار بدراع متفرد، اضغط الكتف لتحت، والجسم ثابت.", "ارفع الركبة لحد الصدر بلف الحوض لفوق (مش بس الفخد)، وعصّر البطن ثانية. انزل ببطء من غير تأرجح.", "تأرجح الجسم. رفع الفخد بس من غير حوض. نزول سريع.", "لف الحوض لفوق هو اللي بيشغّل البطن. لو الجسم بيتأرجح، وقف ثانية بين العدّات."], "Cable Crunch": ["بطن (مستقيمة)", "اركع قدام الكابل العالي، امسك الحبل ورا راسك أو جنب الوجه، والورك ثابت.", "لف العمود الفقري لتحت وقرّب الكوع من الركبة بتقوس البطن، وعصّر ثانية. ارجع ببطء. الورك ثابت طول الحركة.", "سحب الحبل بالإيد. تحريك الورك. وزن تقيل.", "الحركة من البطن مش من الورك. زفير بقوة مع الانقباض."], "Farmer's Walk": ["قبضة + ترابيس + جذع + ساعد", "دمبل تقيل في كل إيد جنبك، الصدر طالع والكتف لورا ولتحت، والبطن مشدود.", "امشي بخطوات ثابتة وقصيرة وجسمك مستقيم ونظرك لقدام، للمسافة أو الوقت المحدد. تنفس بانتظام والقبضة مقفولة طول الوقت.", "ميلان الجسم. رفع الكتف للأذن. خطوات سريعة ومهتزة. إفلات الوزن بدري.", "لو القبضة بتخون قبل العضلات، ده هو الهدف من التمرين. حط الوزن بهدوء مش ترميه."]};

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const pipe=async(bytes,S2)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(S2)).arrayBuffer());

async function deriveKey(pass,salt,iter){
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
/* كل اللي محتاجينه عشان الاسترجاع يرجّع كل حاجة (نفس الشكل في الملف وGitHub) */
const snapData=()=>({program:S.program,sessions:S.sessions,settings:S.settings,draft:S.draft||null,sys:S.sys||null,custom:S.custom||[],mig:S.mig||0});
async function packBackup(){
  const payload=enc.encode(JSON.stringify({app:'gymlog',v:1,at:Date.now(),data:snapData()}));
  let z=null;try{z=await pipe(payload,new CompressionStream('gzip'))}catch(e){}
  const {iv,ct}=await sealBytes(BKEY,z||payload);
  return JSON.stringify({app:'gymlog-enc',v:1,kdf:'PBKDF2-SHA256',iter:SYNC.iter,salt:SYNC.salt,iv:b64(iv),z:z?1:0,ct:b64(ct)});
}
async function openBackup(txt,keyOrPass){
  const o=JSON.parse(txt);if(o.app!=='gymlog-enc')throw new Error('fmt');
  const key=typeof keyOrPass==='string'?await deriveKey(keyOrPass,unb64(o.salt),o.iter):keyOrPass;
  let p;try{p=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}catch(e){throw new Error('pass')}
  if(o.z)p=await pipe(p,new DecompressionStream('gzip'));
  return JSON.parse(dec.decode(p));
}
async function getToken(){const t=await idb.get('bk.token');if(!t||!BKEY)throw new Error('notoken');return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:t.iv},BKEY,t.ct))}
async function gh(method,url,body,accept,tok){
  tok=tok||await getToken();
  const r=await fetch('https://api.github.com'+url,{method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+tok,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  return r;
}
const ghErr=r=>new Error(r.status===401||r.status===403?'token':r.status===404?'repo':'http'+r.status);
async function ensureBranch(tok){
  const R=SYNC.repo;let r=await gh('GET',`/repos/${R}/git/ref/heads/${SYNC.branch}`,null,null,tok);
  if(r.ok)return;if(r.status!==404&&r.status!==409)throw ghErr(r);
  const rr=await gh('GET',`/repos/${R}`,null,null,tok);if(!rr.ok)throw ghErr(rr);
  const def=(await rr.json()).default_branch;
  let br=await gh('GET',`/repos/${R}/git/ref/heads/${def}`,null,null,tok);
  if(!br.ok&&(br.status===404||br.status===409)){
    const init=await gh('PUT',`/repos/${R}/contents/README.md`,{message:'init',content:btoa('Gym Log backup\n'),branch:def},null,tok);
    if(!init.ok)throw ghErr(init);
    br=await gh('GET',`/repos/${R}/git/ref/heads/${def}`,null,null,tok);
  }
  if(!br.ok)throw ghErr(br);
  const sha=(await br.json()).object.sha;
  r=await gh('POST',`/repos/${R}/git/refs`,{ref:'refs/heads/'+SYNC.branch,sha},null,tok);
  if(!r.ok&&r.status!==422)throw ghErr(r);
}
async function putBackup(text){
  const url=`/repos/${SYNC.repo}/contents/${SYNC.path}`;
  for(let k=0;k<2;k++){
    let sha;const g=await gh('GET',`${url}?ref=${SYNC.branch}`);
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw ghErr(g);
    const p=await gh('PUT',url,Object.assign({message:'sync '+new Date().toISOString().slice(0,16),content:b64(enc.encode(text)),branch:SYNC.branch},sha?{sha}:{}));
    if(p.ok)return;if(p.status!==409&&p.status!==422)throw ghErr(p);
  }
  throw new Error('conflict');
}
async function readRemote(tok){
  const r=await gh('GET',`/repos/${SYNC.repo}/contents/${SYNC.path}?ref=${SYNC.branch}`,null,'application/vnd.github.raw+json',tok);
  if(r.status===404)throw new Error('nofile');if(!r.ok)throw ghErr(r);return r.text();
}
async function runBackup(verify){
  if(!SYNC.on||!BKEY||running||!navigator.onLine)return false;
  running=true;const my=chg;let ok=false;
  try{
    await ensureBranch();
    await putBackup(await packBackup());
    if(verify){const back=await openBackup(await readRemote(),BKEY);if(!back.data||back.data.sessions.length!==S.sessions.length)throw new Error('verify')}
    if(chg===my)SYNC.dirty=false;SYNC.missed=0;SYNC.last=Date.now();SYNC.n=S.sessions.length;SYNC.err='';ok=true;markBackup();
  }catch(e){SYNC.err=String(e.message||e)}
  running=false;await saveSync();
  if(ok&&chg!==my)runBackup();
  refresh();return ok;
}

const HIST_MIG=5;/* آخر ترحيل بيستورد السجل القديم: بعد الاسترجاع مايتعادش أبدًا */
function cleanSession(s){
  if(!s||typeof s!=='object'||typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Array.isArray(s.ex))return null;
  const ex=s.ex.filter(e=>e&&typeof e.name==='string'&&Array.isArray(e.sets)).map(e=>Object.assign({},e,{sets:e.sets.map(Number).filter(v=>!isNaN(v)),exId:e.exId||'h:'+e.name,unit:e.unit||'',note:e.note||''}));
  return Object.assign({},s,{id:s.id||uid(),dayName:String(s.dayName||s.day||'?'),cycle:+s.cycle||1,status:s.status||'part',ts:+s.ts||new Date(s.date+'T12:00:00').getTime(),ex});
}
function cleanRestore(d){
  if(!d||!d.program||!Array.isArray(d.program.days)||!Array.isArray(d.sessions))throw new Error('fmt');
  const days=d.program.days.filter(x=>x&&x.id&&Array.isArray(x.ex)).map(x=>Object.assign({},x,{name:String(x.name||x.id),ex:x.ex.filter(t=>t&&t.id&&typeof t.name==='string')}));
  if(!days.length)throw new Error('fmt');
  const ss=d.sessions.map(cleanSession).filter(Boolean);
  return{days,ss,bad:d.sessions.length-ss.length};
}
async function applyRestore(d){

function backupMD(){

    d.ex.forEach((t,i)=>{const l=exHist(t.id)[0];o.push(rowMd([i+1,t.name,fw(l?l.w:t.w),`${t.sets}×${t.reps}${t.unit?' '+unitTxt(t.unit):''}`,t.core?L.yes:'',t.note]))});

      <label class="fld">${L.syncRepo}<input class="inp en" id="gRepo" placeholder="owner/gym-data" value="${esc(SYNC.repo)}" autocapitalize="off" autocomplete="off" style="text-align:left"></label>
      <label class="fld">${L.syncTok}<input class="inp en" id="gTok" type="password" autocomplete="off" style="text-align:left"></label>
      <label class="fld">${L.syncP1}<input class="inp" id="gP1" type="password" autocomplete="new-password"></label>
      <label class="fld">${L.syncP2}<input class="inp" id="gP2" type="password" autocomplete="new-password"></label>
      <div class="warn" style="margin:0 0 10px">${L.syncWarn}</div>
      <button class="btn pri w" data-a="syncOn">${L.syncEnable}</button>
      <button class="btn w mt" data-a="syncRestore">${L.syncRestore}</button><div class="mu mt">${L.syncRestoreHint}</div>`}</div>
  ${FS?`<div class="card"><div style="font-weight:700;margin-bottom:4px">${L.autoT}</div><div class="mu" style="margin-bottom:10px">${S.settings.linked?L.autoLinked('<span class="en">'+esc(S.settings.linked)+'</span>'):L.autoHint}</div><button class="btn w" data-a="link">${S.settings.linked?L.relinkB:L.linkB}</button></div>`:''}
  <div class="card"><div style="font-weight:700;margin-bottom:4px">${L.bkT}</div><div class="mu" style="margin-bottom:10px">${L.bkHint}</div>
    <button class="btn pri w" data-a="backup">${L.bkSave}</button>
    <button class="btn w mt" data-a="share">${L.bkShare}</button>
    <label class="btn w mt" style="cursor:pointer">${L.restore}<input type="file" id="imp" accept=".md,.txt,.json,text/markdown,text/plain,application/json" hidden></label>
    ${canUndo?`<button class="btn w mt dan" data-a="undoRestore">${L.undoRestore}</button>`:''}</div>
  <div class="card"><div style="font-weight:700;margin-bottom:4px">${L.csvT}</div><div class="mu" style="margin-bottom:10px">${L.csvHint}</div><button class="btn w" data-a="csv">${L.csvB}</button></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">Language · اللغة</div><button class="btn w" data-a="lang">${L.langBtn}</button></div>
  <div class="card"><label class="fld" style="margin:0">${L.cycleL}<input class="inp" id="cyc0" inputmode="numeric" value="${esc(S.settings.cycle)}"></label></div>
`;
  $('#imp').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};
  $('#cyc0').onchange=e=>{const v=num(e.target.value);if(v>0){S.settings.cycle=v;save();toast(L.cycleSaved)}};
}

/* ================= الأحداث ================= */
document.addEventListener('input',ev=>{if(ev.target.id==='libS'){libQ=ev.target.value;const r=$('#libR');if(r)r.innerHTML=libRowsHtml()}else if(ev.target.id==='lbS'){lbQ=ev.target.value;const l=$('#lbL');if(l)l.innerHTML=libRows()}});
document.addEventListener('click',ev=>{
  if(ev.target.closest('.brand .lg')){hardRefresh();return}
  const tb=ev.target.closest('.tabs button');if(tb){navTab(tb.dataset.tab);return}
  if(ev.target.id==='modal'){closeModal();return}
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,d=S.draft,L=T();
  switch(a){
    case 'lang':$('#toast').classList.remove('on');LANG=LANG==='en'?'ar':'en';S.settings.lang=LANG;save();applyLang();if(!$('#sess').hidden)renderSession();if(!$('#modal').hidden)closeModal();go(tab);break;
    case 'start':startSession(b.dataset.d);break;
    case 'resume':openSession();break;
    case 'closeS':flushSave();closeSession();if(S.draft)queueDraftBackup();break;
    case 'commit':commit();break;
    case 'shareDraft':shareDraft();break;
    case 'discard':if(confirm(d.editing?L.confCancelEdit:L.confDiscard)){S.draft=null;openTips.clear();save();closeSession()}break;
    case 'addset':d.ex[i].sets.push('');save();renderSession();break;
    case 'rmset':if(d.ex[i].sets.length>1){d.ex[i].sets.pop();save();renderSession()}break;
    case 'tgl':{const k=b.dataset.k;openTips.has(k)?openTips.delete(k):openTips.add(k);renderSession();break}
    case 'hist':exHistModal(b.dataset.id);break;
    case 'sess':sessModal(b.dataset.id);break;
    case 'copyS':copy(cardText(S.sessions.find(x=>x.id===b.dataset.id)));break;
    case 'aiS':{const s=S.sessions.find(x=>x.id===b.dataset.id);if(s)shareText(aiText(s,s.id));break}
    case 'editS':editSession(b.dataset.id);break;
    case 'undoRestore':undoRestore();break;
    case 'delS':if(confirm(L.confDel)){S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);if(S.draft&&S.draft.editing===b.dataset.id)S.draft=null;save();queueBackup();closeModal();go(tab)}break;
    case 'closeM':closeModal();break;
    case 'pday':pDay=b.dataset.d;renderProgram();break;
    case 'exInfo':infoModal(i);break;
    case 'sysOpen':sysModal();break;
    case 'sysPick':if(confirm(tr('هتبدّل النظام. تمارينك الحالية محفوظة وترجعلها. تكمّل؟','Switch system? Your current exercises are kept. Continue?'))){switchSys(b.dataset.id);closeModal();renderProgram();toast(tr('النظام اتغيّر ✓','System changed ✓'))}break;
    case 'libOpen':libQ='';libG='all';libModal();break;
    case 'libG':libG=b.dataset.g;libModal();break;
    case 'cuNew':cuModal();break;
    case 'cuEdit':cuModal(b.dataset.n);break;
    case 'cuSave':cuSave(b.dataset.n);break;
    case 'cuDel':if(confirm(tr('تحذف التمرين ده من مكتبتك؟ برنامجك وسجلك مش هيتأثروا.','Delete this exercise from your library? Your program and log are not affected.'))){S.custom=(S.custom||[]).filter(x=>x.name!==b.dataset.n);save();queueBackup();closeModal();renderLib()}break;
    case 'lbG':lbG=b.dataset.g;{const c=$('#lbC'),l=$('#lbL');if(c)c.innerHTML=lbChips();if(l)l.innerHTML=libRows()}break;
    case 'lbAdd':modal(`<h3>${tr('تضيفه لأنهي يوم؟','Add to which day?')}</h3><div class="mu en" style="margin-bottom:10px;text-align:start">${esc(b.dataset.n)}</div>${S.program.days.map(x=>`<button class="btn w" style="margin-bottom:8px" data-a="lbPick" data-d="${x.id}" data-n="${esc(b.dataset.n)}"><bdi>${esc(x.name)}</bdi></button>`).join('')}<button class="btn ghost w" data-a="closeM">${T().close}</button>`);break
    case 'lbPick':{const dd=day(b.dataset.d);if(dd){dd.ex.push(mk(b.dataset.n));save();queueBackup();closeModal();lbRefresh();toast(tr('اتضاف لـ ','Added to ')+dd.name+' ✓')}break}
    case 'libAdd':{const t=mk(b.dataset.n);day(pDay).ex.push(t);save();queueBackup();closeModal();renderProgram();toast(tr('اتضاف ✓','Added ✓'));break}
    case 'dayAdd':{const nd={id:'D'+uid(),name:tr('يوم جديد','New day'),ex:[]};S.program.days.push(nd);pDay=nd.id;save();queueBackup();renderProgram();dayModal();break}
    case 'dayEdit':dayModal();break;
    case 'daySave':{const v=$('#dName').value.trim();if(v){day(pDay).name=v;save();queueBackup()}closeModal();renderProgram();break}
    case 'dayDel':if(confirm(tr('تحذف اليوم ده بتمارينه؟ السجل القديم مش هيتأثر.','Delete this day and its exercises? Your log is not affected.'))){S.program.days=S.program.days.filter(x=>x.id!==pDay);pDay=S.program.days[0].id;save();queueBackup();closeModal();renderProgram()}break;
    case 'up':case 'down':{const ex=day(pDay).ex,j=a==='up'?i-1:i+1;if(j>=0&&j<ex.length){[ex[i],ex[j]]=[ex[j],ex[i]];save();queueBackup();renderProgram()}break}
    case 'editT':tplModal(i);break;
    case 'addT':cuModal();break;
    case 'saveT':saveTpl(i);break;
    case 'delT':if(confirm(L.confDelEx)){day(pDay).ex.splice(i,1);save();queueBackup();closeModal();renderProgram()}break;
    case 'copyT':copy(tplCard(day(pDay)));break;
    case 'backup':backupNow();break;
    case 'share':shareBackup();break;
    case 'link':linkFile();break;
    case 'csv':exportCSV();break;
    case 'theme':S.settings.theme=b.dataset.k;thmOpen=false;save();applyTheme();renderData();break;
    case 'thmTog':thmOpen=!thmOpen;renderData();break;
    case 'syncOn':enableSync();break;
    case 'syncNow':{chg++;SYNC.dirty=true;runBackup(true).then(ok=>toast(ok?T().syncOK:T().syncErr(syncMsg(SYNC.err))));break}
    case 'syncOff':disableSync();break;
    case 'syncRestore':restoreRemote();break;
  }
});
const sess=$('#sess');
function onField(ev){
  const t=ev.target,d=S.draft;if(!d)return;
  if(t.id==='sDate'){d.date=t.value;saveSoon();return}
  if(t.id==='sCyc'){const n=num(t.value);if(n>0)d.cycle=n;save();return}
  const c=t.closest('.ex');if(!c)return;const e=d.ex[+c.dataset.i],f=t.dataset.f;
  if(f==='w')e.w=t.value;else if(f==='s')e.sets[+t.dataset.j]=t.value;else if(f==='n')e.note=t.value;else return;
  saveSoon();updCore();
}
sess.addEventListener('input',onField);sess.addEventListener('change',onField);
sess.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.target.tagName!=='INPUT')return;const all=[...sess.querySelectorAll('input.inp')];const k=all.indexOf(ev.target);if(k>-1&&all[k+1]){ev.preventDefault();all[k+1].focus()}});

/* ================= التثبيت والتحديث ================= */
let updating=false,r=false;
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js?v='+VER).then(reg=>{
    const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){const u=$('#updBtn');u.hidden=false;u.onclick=()=>{updating=true;saveUI();flushSave();reg.waiting&&reg.waiting.postMessage('skip')}}};
    show();reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')show()})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating&&!r){r=true;location.reload()}});
}
function readUI(){try{return JSON.parse(localStorage.getItem('gymlog.ui')||'null')}catch(e){return null}}
function restoreUI(u){try{if(!u||Date.now()-u.at>12*36e5)return;
  if(u.t&&u.t!=='home')navTab(u.t);
  if(u.s&&S.draft)openSession();else if(u.y)setTimeout(()=>window.scrollTo(0,u.y),50)}catch(e){}}
window.addEventListener('scroll',()=>{clearTimeout(window.__st);window.__st=setTimeout(saveUI,250)},{passive:true});
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushSave();saveUI();if(S.draft)queueDraftBackup()}});
const UI0=readUI();
boot().then(()=>{if(!S.settings.thGr){S.settings.thGr=1;S.settings.thDawn=1;S.settings.theme='granite';save()}applyLang();if(S.impN){const k=S.impN;S.impN=0;save();setTimeout(()=>toast(T().histNote(k)),600)}go('home');restoreUI(UI0);if(pendMig){toast(T().migNote);pendMig=false}});
</script>
</body>
