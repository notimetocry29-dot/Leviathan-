<style>
*{margin:0;padding:0}
body{font-family:var(--sans)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 20px calc(40px + env(safe-area-inset-bottom));zoom:var(--z)}
body{transition:background .25s,color .25s}
.in{opacity:0;transform:translateY(6px);animation:in .6s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
header{padding-top:18px;text-align:center}
.seal{position:relative;width:min(58vw,216px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.seal .ring,.seal .hands{position:absolute;inset:0;width:100%;height:100%}
.seal .hands{pointer-events:none;opacity:.6}
.seal .hands g{transform-origin:100px 100px;transform-box:view-box}
.seal h1{position:relative;font-family:"Aref Ruqaa",var(--serif);font-weight:700;font-size:min(16vw,62px);line-height:1;color:var(--ink);padding-bottom:.18em;letter-spacing:0}
.verse{margin-top:22px;font-family:"Aref Ruqaa",var(--serif);font-size:21px;line-height:1.9;color:var(--soft);display:flex;flex-direction:column;align-items:center}

.poet{font-size:10px;color:var(--mute);margin-top:4px;opacity:.85}
header h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.5;text-align:right;color:var(--ink)}
header .sub{font-size:13px;color:var(--mute);margin-top:0}
#q{margin:30px auto 0;max-width:320px;text-align:center;padding:0;cursor:pointer;transition:opacity .45s}
#q.fade{opacity:0}
#qt{font-family:var(--latin);font-style:italic;font-size:15.5px;line-height:1.6;color:var(--qc)}
#q::before{content:'';display:block;width:28px;height:1px;background:color-mix(in srgb,var(--cu) 55%,transparent);margin:0 auto 14px}
#qs{margin-top:6px;font-family:var(--latin);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--qc);opacity:.8}
html.noq #q{display:none}
.srch{margin-top:26px;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.srch svg{width:16px;height:16px;flex:none;stroke:var(--mute)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px}
.srch input::placeholder{color:var(--mute)}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 12px;font-size:12px;color:var(--mute);letter-spacing:.02em}
.lab b{font-weight:600;color:var(--soft);font-size:13px}
/* now reading */
.now{display:flex;gap:16px;align-items:stretch;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .2s,transform .15s}
.now:active{transform:scale(.99)}
.now .pl{width:104px;flex:none}
.now .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.now h2{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.35}
.by{font-family:var(--latin);font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);direction:ltr;text-align:right;margin-top:1px}
.now .at{font-size:13px;color:var(--soft);margin-top:auto}
.bar{height:2px;background:var(--line2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cu)}
.now .go{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--cu)}
.now .go span{color:var(--mute);font-size:12px}
/* shelf */
.shelf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 14px}
.bk{text-decoration:none;color:inherit;display:block;min-width:0;transition:transform .15s}
.bk .op{text-decoration:none;color:inherit;display:block}
.bk:active{transform:scale(.985)}
.pl{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#12110f;box-shadow:0 1px 0 rgba(255,255,255,.03),0 14px 30px -18px #000}
.pl svg{display:block;width:100%;height:100%}
.bk h3{font-family:var(--serif);font-size:16px;font-weight:700;margin-top:10px;line-height:1.45}
.bk .st{font-size:12px;color:var(--mute);margin-top:3px}
.bk .row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:8px}
.cont{font:inherit;font-size:12.5px;color:var(--cu);background:transparent;border:1px solid color-mix(in srgb,var(--cu) 40%,transparent);border-radius:99px;padding:2px 11px;text-decoration:none;white-space:nowrap}
.cont:active{background:color-mix(in srgb,var(--cu) 14%,transparent)}
/* field card */
.fld{display:flex;gap:16px;align-items:stretch;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .15s}
.fld:active{transform:scale(.99)}
.fld .pl{width:104px;flex:none}
.fld .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.fld h2{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.35}
.fld .qt{font-size:13px;color:var(--soft);margin-top:auto}
.fld .qt.al{color:var(--cu)}
.fld .go{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--cu)}
.fld .go span{color:var(--mute);font-size:12px}
/* favourites view */
#favs{display:none}
html.vf #favs{display:block}html.vf #lib{display:none}
.fh{display:flex;align-items:center;gap:10px;margin:18px 0 18px}
.fh h2{font-family:var(--serif);font-size:24px;font-weight:700}
.fi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fi a{flex:1;min-width:0;text-decoration:none;color:inherit}
.fi .k{font-size:11.5px;color:var(--mute)}
.fi strong{display:block;font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.6}
.fi .x{flex:none}
.empty{color:var(--mute);font-size:14px;line-height:1.9;padding:18px 0}
#res{margin-top:18px}
#res .rh{font-size:12px;color:var(--mute);margin-bottom:6px}
#res a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
#res .k{font-size:11.5px;color:var(--cu)}
#res p{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--soft);margin-top:2px}
#res mark{background:color-mix(in srgb,var(--cu) 30%,transparent);color:var(--ink);border-radius:3px;padding:0 1px}
html.srch #nowwrap,html.srch #lib .lab,html.srch #shelf,html.srch #fieldwrap{display:none}
html.nomo .in{animation:none;opacity:1;transform:none}
.bk .st.on{color:var(--cu)}
.bk.soon .pl{opacity:.5;filter:grayscale(.3)}
.bk.soon h3{color:var(--soft)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.8}
body.leave main{opacity:0;transition:opacity .22s}
@media (min-width:520px){.shelf{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}

.seal{color:var(--ink)}
.seal h1{z-index:2}
.seal .hands{z-index:1}</style>
</head>

var IDX=null,qi=document.getElementById('qi'),res=document.getElementById('res'),st0;
function nz(t){return t.replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase();}
function esc(t){return t.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function loadIdx(cb){if(IDX)return cb();fetch('search.json').then(function(r){return r.json();}).then(function(d){IDX=d;d.forEach(function(a){a.np=a.p.map(nz);});cb();}).catch(function(){res.innerHTML='<p class="empty">البحث محتاج الملف يكون متحمّل. افتح الصفحة مرة وإنت متصل بالنت.</p>';});}
function doSearch(){var q=qi.value.trim();H.classList.toggle('srch',q.length>1);if(q.length<2){res.hidden=true;return;}
 res.hidden=false;loadIdx(function(){var nq=nz(q),out=[],n=0;
  IDX.forEach(function(a){a.np.forEach(function(t,i){if(n>=40)return;var k=t.indexOf(nq);if(k<0)return;n++;
   var raw=a.p[i];// map approx position by ratio
   var s0=Math.max(0,Math.floor(k*raw.length/t.length)-70),s1=Math.min(raw.length,s0+220);
   var snip=(s0>0?'… ':'')+esc(raw.slice(s0,s1))+(s1<raw.length?' …':'');
   var words=q.split(/\s+/).filter(Boolean);words.forEach(function(w){try{snip=snip.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'<mark>$&</mark>');}catch(e){}});
   out.push('<a href="'+a.href+'"><span class="k">'+a.bt+' · '+a.t+'</span><p>'+snip+'</p></a>');});});
  res.innerHTML='<div class="rh">'+(n?(n>=40?'أول ٤٠ نتيجة':ar(n)+' نتيجة'):'مفيش نتايج')+'</div>'+out.join('');});}
qi.addEventListener('input',function(){clearTimeout(st0);st0=setTimeout(doSearch,220);});
qi.addEventListener('focus',function(){loadIdx(function(){});},{once:true});

})();
</script>
