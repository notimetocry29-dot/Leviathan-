{h:'البروتوكول السباعي',
body:`<p>بعد الفصل بين الواقعة والإطار، تمر على سبع طبقات بالترتيب، من الأظهر إلى الأخفى:</p>
<div class="tablewrap"><table class="t">
<tr><th>الطبقة</th><th>المصدر</th><th>السؤال</th></tr>
<tr><td><b>١. الأسماء</b></td><td>هوبز، لايكوف</td><td>ما الكلمات المختارة؟ ماذا لو سُميت الواقعة باسم آخر؟ وأي إطار تستدعيه كل كلمة؟</td></tr>
<tr><td><b>٢. الساحة</b></td><td>أرسطو</td><td>ما جنس الخطاب؟ من يجلس على كرسي القاضي؟ هل حدث نقل جنس؟</td></tr>
<tr><td><b>٣. الأسلحة</b></td><td>أرسطو</td><td>أي إيثوس يُبنى، وأي باثوس يُستدعى، وأي مقدمة حُذفت، وأي موضع استُعمل؟</td></tr>
<tr><td><b>٤. الوظائف</b></td><td>إنتمان</td><td>ما تعريف المشكلة، وسببها، والحكم الأخلاقي، والعلاج المقترح؟</td></tr>
<tr><td><b>٥. البديهة</b></td><td>غرامشي، بورديو</td><td>ما الذي يُقدَّم كأنه طبيعي؟ من مثقفه العضوي؟ ما الثمن المدفوع، وهل يمس الجوهر؟</td></tr>
<tr><td><b>٦. الخطاب</b></td><td>فوكو</td><td>من يحق له القول هنا وفي أي طقس؟ ما الذي لا يمكن قوله؟ أي موضوع يُكوَّن، وأي معيار يُطبَّق؟</td></tr>
<tr><td><b>٧. البنية</b></td><td>الملف صفر، هيرمان وتشومسكي</td><td>على أي درجة من سلّم الخفاء يعمل النص؟ أين السيف خلفه؟ وما المرشحات التي مر بها؟</td></tr>
</table></div>
<p>وفي النهاية، خطوتان لا تُهملان: <strong>السؤال المضاد</strong>، أي سؤال واحد يعيد النقاش إلى أرضه، و<strong>فحص الإنصاف</strong>: هل وجدت في النص ما فيه، أم ما أردت أن تجده؟</p>`,
key:'سبع طبقات من الأظهر إلى الأخفى: الأسماء، الساحة، الأسلحة، الوظائف، البديهة، الخطاب، البنية. ثم سؤال مضاد وفحص إنصاف.'},

{h:'قاعدة الغياب: لا تُسقط',
body:`<p>هذه أهم قاعدة في الملف، وهي ما يفرق الضابط عن المتآمر: <strong>ليست كل طبقة موجودة في كل نص.</strong></p>
<p>إعلان عن منتج بسيط قد لا يكون فيه شيء من طبقة «الخطاب» عند فوكو. ورسالة داخلية روتينية قد لا تحمل أي «بديهة» تستحق التفكيك. وإن أصررت على إيجاد كل الطبقات في كل شيء، ستصير محللًا لا يصدقه أحد، لأنه يرى المؤامرة في قائمة المشتريات.</p>
<p>والاختبار بسيط: <em>لكل طبقة تقول إنها موجودة، أشر إلى جملة محددة في النص.</em> إن لم تستطع، فالطبقة غائبة، أو أنك تسقطها من رأسك.</p>
<p>وهناك قاعدة مكملة: <strong>العمق لا يعني الأهمية.</strong> أحيانًا تكون أخطر حركة في النص على السطح تمامًا: كلمة واحدة مختارة بعناية. والمحلل الذي يقفز إلى «البنية» دون أن يقرأ الكلمات قد يفوته السلاح الحقيقي.</p>`,
field:`ده الفرق بينك وبين حد بيقول «كله مؤامرة». انت عندك نفس الأدوات، بس عندك قاعدة: «ورّيني الجملة». لو مش قادر تشاور على كلمة في النص بتثبت الطبقة دي، يبقى انت اللي بتألف. والانضباط ده هو اللي هيخلي كلامك يتسمع في أي نقاش.`,
key:'قاعدة الغياب: لكل طبقة تزعم وجودها، أشر إلى جملة محددة. والعمق لا يعني الأهمية؛ أخطر سلاح قد يكون كلمة على السطح.'},

{h:'ملخص التفكيك: خمسة أسطر',
body:`<p>التحليل الطويل لك أنت. لكن حين تحتاج أن تستعمله في نقاش، أو أن تشرحه لغيرك، تحتاج صيغة مضغوطة. هذه صيغة الأسطر الخمسة:</p>
<ol>
<li><strong>الواقعة:</strong> جملة محايدة واحدة.</li>
<li><strong>الإطار:</strong> كيف قُدمت الواقعة، في جملة.</li>
<li><strong>الحركة الأساسية:</strong> أخطر حركة في النص (اسم، أو نقل جنس، أو مقدمة محذوفة، أو بديهة…).</li>
<li><strong>ما الذي اختفى:</strong> السؤال أو البديل أو الفاعل الذي أخرجه الإطار من الصورة.</li>
<li><strong>السؤال المضاد:</strong> سؤال واحد يعيده.</li>
</ol>
<p>والقيد المهم: <em>اختر حركة أساسية واحدة.</em> قد تجد في النص عشر حركات، لكن في النقاش الحقيقي لا يُسمع إلا واحد. اختر الأخطر أثرًا، لا الأذكى اكتشافًا.</p>`,
key:'خمسة أسطر: الواقعة، والإطار، والحركة الأساسية (واحدة فقط)، وما اختفى، والسؤال المضاد.'},

{h:'عملية تدريبية: عنوانان لواقعة واحدة',
body:`<p>دولة متخيلة، «بلاد الوادي». إضراب لعمال النقل استمر ثلاثة أيام. والأرقام المتاحة: ٤٠٪ من الحافلات توقفت، والعمال يطالبون بزيادة ٢٠٪ في الأجور بعد ارتفاع الأسعار ٣٥٪ في سنتين.</p>
<p>العنوان الأول: <strong>«الشلل يضرب العاصمة: إضراب النقل يحرم الملايين من الوصول إلى أعمالهم»</strong>.</p>
<p>العنوان الثاني: <strong>«سائقو الحافلات يتوقفون بعد عامين من رواتب لا تلاحق الأسعار»</strong>.</p>
<p>طبّق البروتوكول بسرعة:</p>
<ul>
<li><strong>الأسماء:</strong> «الشلل يضرب» تجعل الإضراب كارثة طبيعية أو مرضًا. و«يتوقفون» فعل محايد نسبيًا.</li>
<li><strong>الساحة:</strong> الأول يضع الركاب على كرسي القاضي والعمال في قفص الاتهام (قضائي). والثاني يضع القارئ أمام سؤال عدالة الأجور.</li>
<li><strong>الوظائف:</strong> الأول: المشكلة «توقف المواصلات»، والسبب «الإضراب»، والحكم «العمال يحرمون الملايين»، والعلاج الضمني «إنهاء الإضراب». والثاني: المشكلة «أجور لا تلاحق الأسعار»، والسبب ضمني (الإدارة أو السياسة الاقتصادية)، والعلاج الضمني «رفع الأجور».</li>
<li><strong>ما اختفى:</strong> في الأول اختفت الأرقام عن الأسعار والأجور تمامًا. وفي الثاني اختفى أثر الإضراب على الركاب.</li>
</ul>
<p>ولاحظ: <em>كلا العنوانين مؤطر</em>. التحليل المنصف لا يقول «الأول كاذب والثاني صادق»، بل يقول: كل منهما أبرز نصف الواقعة. والقارئ الذي يقرأ واحدًا فقط يرى نصف العالم.</p>`,
key:'عنوانان للواقعة نفسها، وكل منهما أبرز نصفها. التحليل المنصف لا يختار عنوانًا «صادقًا»، بل يكشف ما أخفاه كل منهما.'}

worked:{
 title:'عملية كاملة: اجتماع «نظام الحضور الذكي»',
 case:`المدير العام يخاطب الموظفين في لقاء مفتوح:<br><b>«زملائي الأعزاء، في عصر التحول الرقمي، لا يمكن لمؤسسة رائدة مثلنا أن تبقى بأنظمة الورق. لذلك سنطبق ابتداءً من الشهر القادم نظام الحضور الذكي بالبصمة والتعرف على الوجه، والذي يرصد أيضًا فترات الاستراحة بدقة. هذا النظام ليس للمراقبة، بل لحمايتكم وضمان العدالة بين المجتهد والمتهاون. أغلب المؤسسات الكبرى في العالم تستخدمه. ومن لديه مخاوف، أنا متأكد أنها ستزول حين يرى النتائج. نحن عائلة واحدة، ولا شيء نخفيه عن بعضنا.»</b>`,
 steps:[
  {h:'الطبقة صفر: الواقعة والإطار', body:'<em>الواقعة:</em> نظام جديد يسجل حضور الموظفين ووجوههم ومدة استراحاتهم بدقة، يبدأ الشهر القادم. <em>الإطار:</em> تحول رقمي، وحماية، وعدالة، وعائلة. ولاحظ أن الواقعة نفسها تحمل جملة لم يتوقف عندها الخطاب: «يرصد فترات الاستراحة بدقة».'},
  {h:'١. الأسماء', body:'«الحضور الذكي» بدل «نظام مراقبة». و«التحول الرقمي» مفهوم لا يُعادى (شميت): من يعترض يبدو ضد التقدم. و«نفي الإطار»: «هذا النظام ليس للمراقبة» يفعّل كلمة المراقبة في رأس كل من يسمع (لايكوف)، وهو اعتراف ضمني بأن الكلمة كانت في الرؤوس.'},
  {h:'٢ و٣. الساحة والأسلحة', body:'القرار متخذ، فالجنس ليس مشاوريًا حقيقيًا. وهناك نقل إلى الاحتفالي: «المجتهد والمتهاون» تقسم الحضور، فمن يعترض يبدو كأنه من «المتهاونين». وموضع «الحكم السابق»: «أغلب المؤسسات الكبرى تستخدمه»، والمقدمة المحذوفة: ما تفعله المؤسسات الكبرى صحيح ومناسب لنا. وإيثوس حسن النية: «زملائي الأعزاء»، «لحمايتكم».'},
  {h:'٤. الوظائف (إنتمان)', body:'<em>المشكلة:</em> أنظمة ورقية متخلفة وظلم بين المجتهد والمتهاون. <em>السبب:</em> غياب القياس الدقيق. <em>الحكم:</em> المتهاون مذنب والنظام عادل. <em>العلاج:</em> المراقبة الدقيقة. ولم يُقدَّم أي دليل على أن هناك «متهاونين» أصلًا.'},
  {h:'٥. البديهة', body:'«نحن عائلة واحدة، ولا شيء نخفيه» تجعل الخصوصية نفسها شيئًا مشبوهًا: من يريد خصوصية «يخفي» شيئًا عن «العائلة». هذه دوكسا تحاول أن تولد: أن الشفافية الكاملة للموظف أمام الإدارة أمر طبيعي. ولاحظ أن «العائلة» لا تراقب استراحات أفرادها بالثانية.'},
  {h:'٦. الخطاب والانضباط (فوكو)', body:'هذا انضباط كامل: مراقبة دقيقة، ومعيار («المجتهد»)، وملف لكل موظف. وهو بانوبتيكون: رصد دائم للاستراحات يجعل الموظف يقيس استراحته بنفسه. وما الذي لا يمكن قوله؟ «أنا أرفض أن يُسجل وجهي». هذا الاعتراض يصير في الإطار المطروح «مخاوف ستزول».'},
  {h:'٧. البنية والملخص', body:'يعمل الخطاب على درجة «البديهة» و«حدود الكلام»، والسيف خلفه واضح: النظام يُطبق «ابتداء من الشهر القادم» بلا تصويت. <br><b>الملخص:</b> (١) نظام يرصد الحضور والوجوه والاستراحات. (٢) قُدم كتحول رقمي وعدالة وعائلة. (٣) الحركة الأساسية: «عائلة لا تخفي شيئًا» تجعل الخصوصية تهمة. (٤) ما اختفى: من يملك البيانات، ومن يراها، وكيف تُستعمل في التقييم. (٥) السؤال المضاد: «مين هيشوف بيانات الاستراحة دي، وهتدخل في التقييم ولا لأ؟».'},
  {h:'فحص الإنصاف', body:'هل كل شيء في الخطاب تلاعب؟ لا. قد يكون النظام الورقي فعلًا ظالمًا للبعض، وقد تكون هناك حاجة حقيقية لتنظيم الحضور. والتحليل لا يقول «ارفضوا النظام»، بل يكشف ما لم يُقل، ويطرح السؤال الذي يجب أن يُجاب قبل التطبيق.'}
 ],
 verdict:'من بين كل الحركات، الأخطر ليست «التحول الرقمي» ولا «المؤسسات الكبرى»، بل جملة «لا شيء نخفيه». لأنها لا تدافع عن النظام فقط، بل تعيد تعريف الخصوصية كذنب، وهذا تعريف سيبقى بعد أن يُنسى النظام.'
},

 model:`<p><b>الواقعة:</b> قرض استهلاكي سريع، عائده الفعلي حتى ٤٨٪ سنويًا مع رسوم.</p>

<p><b>٤. الوظائف:</b> المشكلة: الانتظار. السبب: الطرق القديمة («ورق ووجع دماغ»). الحكم: من ينتظر متخلف. العلاج: الاقتراض الآن.</p>

<p><b>٧. البنية:</b> النص يعمل على درجة البديهة، والسيف خلفه هو العقد والتحصيل.</p>
<p><b>الملخص:</b> (١) قرض سريع بفائدة فعلية حتى ٤٨٪. (٢) قُدم كحق وحرية وذكاء جيلي. (٣) الحركة الأساسية: تحويل الاستدانة إلى «أخذ ما تستحقه». (٤) ما اختفى: كلمة «فائدة» والتكلفة الكلية. (٥) السؤال المضاد: «لو خدت ١٠ آلاف، هرجع كام في الآخر؟».</p>

 model:`<p>(مثال) رسالة من إدارة: «حرصًا على راحتكم، تم نقل الاستراحة إلى الساعة ١١ بدل ١».</p>
<p><b>(١) الواقعة:</b> الاستراحة نُقلت من ١ إلى ١١. <b>(٢) الإطار:</b> قُدم النقل كحرص على راحة الموظفين. <b>(٣) الحركة الأساسية:</b> «حرصًا على راحتكم» تقدم قرارًا تنظيميًا كهدية، والدليل أن الرسالة لا تذكر أي سبب آخر. <b>(٤) ما اختفى:</b> سبب النقل الحقيقي (ربما تغطية ساعة الذروة)، وأن الاستراحة في ١١ أبعد عن وقت الغداء. <b>(٥) السؤال المضاد:</b> «إيه السبب التشغيلي؟ وهل ممكن يبقى فيه اختيار بين التوقيتين؟».</p>
<p><b>فحص الإنصاف:</b> قد يكون هناك سبب تشغيلي مشروع، وقد يناسب التوقيت الجديد بعض الموظفين فعلًا. المشكلة ليست في القرار، بل في تقديمه كهدية بدل شرح سببه.</p>`
},

sub:'التحصين وإعادة التأطير، وأين تنهار هذه النظريات، ونقطة الارتكاز التي لا يصنعها الميكروفون',
brief:`<h2>المهمة الأخيرة</h2>
<p>قرأت تسعة ملفات عن كيف يُصنع الرضا وتُزرع البديهة ويُروَّض الكلام. والآن سؤالان يحددان إن كان كل هذا سيجعلك أقوى أم أضعف:</p>
<p><strong>الأول: كيف تدافع؟</strong> المعرفة بالسلاح لا تحميك تلقائيًا. تحتاج تقنيات محددة، بعضها مثبت بالتجارب، تجعلك أصعب في الاختراق، وتجعل ردك في النقاش أقوى.</p>
<p><strong>والثاني: أين تنهار هذه الأدوات نفسها؟</strong> قرأت غرامشي وفوكو كضابط لا كمريد. وهذا يعني أن تعرف أين يغلط صانعو السلاح، وأين يمكن أن ينقلب السلاح على حامله. فأخطر ما يمكن أن يحدث لك بعد هذا المنهج ليس أن تُخدع، بل أن تصير لا تصدق شيئًا، أو أن تستعمل الأدوات لتتلاعب أنت.</p>
<p>وفي آخر الملف الإجابة عن السؤال الذي يلاحقك منذ الملف صفر: <em>إذا كان كل كلام يحمل إطارًا وسلطة، فعلى ماذا تقف أنت؟</em></p>`,

lesson:[
{h:'التحصين: اللقاح ضد الإقناع',
body:`<p>في ستينيات القرن العشرين قدم عالم النفس الاجتماعي <strong>ويليام ماكغواير</strong> «نظرية التحصين». والفكرة مستعارة من الطب: كما يحميك اللقاح من المرض بتعريضك لجرعة ضعيفة منه، يحميك التعرض لنسخة ضعيفة من حجة مضادة، مع تفنيدها، من الإقناع بالحجة القوية لاحقًا.</p>
<p>ولاحظ ماكغواير أن الأفكار «البديهية» التي لم تُهاجم قط هي الأضعف أمام الهجوم. الإنسان الذي لم يسمع أبدًا اعتراضًا على قناعته لا يملك أدوات الدفاع عنها، فينهار أمام أول حجة ذكية. أما من سمع الاعتراض وفكّر فيه، فقد بنى دفاعه مسبقًا.</p>
<p>وفي السنوات الأخيرة طور باحثون في جامعة كامبريدج، منهم ساندر فان دير ليندن ويون روزنبيك، الفكرة إلى ما يسمونه <strong>«التحصين المسبق»</strong>: بدل تصحيح كل خبر مضلل بعد انتشاره، علّم الناس <em>الأساليب</em> نفسها: التلاعب بالعاطفة، وانتحال صفة الخبراء، والاستقطاب، ونظريات المؤامرة. ومن تجاربهم المعروفة لعبة «الأخبار السيئة» (٢٠١٩)، يلعب فيها المستخدم دور ناشر للتضليل، فيتعلم الأساليب من الداخل. ووجدوا أن هذا يحسّن قدرة الناس على تمييز المحتوى المضلل.</p>
<p>والدرس العملي: <strong>التحصين يكون ضد الأسلوب لا ضد المحتوى.</strong> لا يمكنك أن تحفظ كل الأكاذيب الممكنة، لكن يمكنك أن تحفظ الأساليب العشرة التي تُصنع بها كل الأكاذيب.</p>`,
field:`لاحظ إن المنهج ده كله كان «تحصين مسبق». لما تشوف إعلان فيه «الناس الأذكياء اختاروا…»، دماغك دلوقتي بتقول «موضع الحكم السابق، والمقدمة المحذوفة ما يفعله كثيرون صواب». الأسلوب اتعرّى، فقوته عليك قلت. ده مش بيخليك محصن ١٠٠٪، بس بيخليك أصعب بكتير.`,
key:'التحصين: جرعة ضعيفة من الحجة المضادة مع تفنيدها. والتحصين المسبق يكون ضد الأسلوب لا المحتوى. والبديهة التي لم تُهاجم قط هي الأضعف.'},

{h:'خمس تقنيات لإعادة التأطير في نقاش حي',
body:`<p>التحليل يحدث في رأسك. لكن في الاجتماع أو النقاش تحتاج حركات سريعة. هذه خمس تقنيات، كل واحدة مبنية على ملف من المنهج:</p>
<ol>
<li><strong>سمِّ الواقعة باسمك (هوبز، لايكوف).</strong> لا تقبل اسم خصمك ولو لترفضه. إن قال «إعادة هيكلة» فقل «فصل ٤٠ موظفًا». وإن اتُّهمت بأنك «سلبي» فلا تقل «أنا مش سلبي»، بل «أنا بنبه على خطر».</li>
<li><strong>ارجع إلى السؤال الأصلي (أرسطو).</strong> حين يحدث نقل الجنس، أعد النقاش بهدوء إلى ساحته: «سيبك من مين محترم ومين لأ، إحنا بنقرر إيه بالظبط؟».</li>
<li><strong>اسحب المقدمة إلى الطاولة (أرسطو).</strong> بسؤال لا باتهام: «يعني انت شايف إن اللي جاي جديد رأيه مالوش قيمة؟». أغلب المقدمات لا تصمد في الضوء.</li>
<li><strong>اسأل عن تاريخ الميلاد (غرامشي، بورديو).</strong> حين تسمع «طبيعي» أو «من زمان»: «من إمتى؟ وهل في أماكن تانية بيتعمل غير كده؟». السؤال يحول البديهة إلى رأي يحتاج دفاعًا.</li>
<li><strong>أعد المعيار إلى صاحبه (فوكو).</strong> حين تُقاس بمعيار: «مين حط المقياس ده؟ وهل فيه مجال إنه يتراجع؟». هذا السؤال يحول «الطبيعي» إلى «قرار» له أصحاب.</li>
</ol>
<p>وقاعدة تحكم الخمس: <strong>حركة واحدة في كل مرة.</strong> من يستعمل الخمس في نقاش واحد يبدو متحذلقًا ويخسر الجمهور. اختر الحركة التي تضرب الحركة الأساسية للخصم، واترك الباقي.</p>`,
field:`ومهم جدًا: النبرة. نفس السؤال ممكن يتقال بنبرة اتهام فتخسر، أو بنبرة فضول هادي فتكسب. «انت بتقول كده عشان…؟» هجوم. «ممكن أفهم إيه اللي خلانا نعتبر ده طبيعي؟» فضول. الجمهور بيحكم على النبرة قبل المضمون، وده إيثوس أرسطو بالظبط.`,
key:'خمس حركات: سمِّ باسمك، وارجع للسؤال، واسحب المقدمة، واسأل عن تاريخ الميلاد، وأعد المعيار لصاحبه. حركة واحدة في كل مرة، وبنبرة فضول لا اتهام.'},

{h:'نقد فوكو: الارتباك المعياري والتناقض الأدائي',
body:`<p>أقوى نقدين لفوكو جاءا من داخل اليسار النقدي نفسه، لا من خصومه.</p>
<p><strong>نانسي فريزر</strong>، في مقال سنة ١٩٨١ عنوانه «فوكو عن السلطة الحديثة: رؤى تجريبية وارتباكات معيارية»، قالت ما معناه: فوكو يقدم وصفًا تجريبيًا مدهشًا لآليات السلطة، لكنه يرفض أن يقول لماذا هي سيئة. فإن كانت كل علاقة سلطة، وكل معرفة سلطة، فبأي معيار ندين نظامًا ونفضل آخر؟ ولماذا نقاوم أصلًا؟ فوكو يستعمل ضمنًا لغة الإدانة («إخضاع»، «سيطرة») دون أن يملك معيارًا يبررها.</p>
<p>و<strong>يورغن هابرماس</strong>، في «الخطاب الفلسفي للحداثة» (١٩٨٥)، وجه نقدًا أشد: فوكو يستعمل العقل والحجة والأدلة التاريخية ليثبت أن العقل والحجة والأدلة مجرد أدوات سلطة. وهذا <strong>«تناقض أدائي»</strong>: إن صحت نظريته، فهي نفسها أداة سلطة ولا سبب لقبولها. وإن كانت تستحق القبول لأنها صحيحة، فهناك إذن معيار للصحة غير السلطة.</p>
<p>وفي مناظرة تلفزيونية شهيرة سنة ١٩٧١ بين فوكو ونعوم تشومسكي، دافع تشومسكي عن وجود طبيعة إنسانية ومفهوم للعدالة يمكن أن نحتكم إليه، وبدا فوكو متشككًا في أن مفهوم «العدالة» نفسه ليس إلا أداة في الصراع. والمناظرة تلخص المشكلة: <em>هل يمكن أن تقاوم سلطة ما دون أن تملك معيارًا يقول إنها ظالمة؟</em></p>`,
field:`النقد ده هو السبب اللي خلانا من الملف صفر نقول «ناخد الآلية ونسيب العقيدة». الآلية عند فوكو حادة جدًا. بس لو خدت معاها فكرة إن «مفيش حقيقة، فيه سلطة بس»، هتلاقي نفسك مش قادر تقول إن أي حاجة ظالمة. وساعتها السلاح يكون قطع إيدك.`,
key:'فريزر: فوكو يصف بلا معيار يبرر الإدانة. هابرماس: تناقض أدائي، يستعمل العقل ليثبت أن العقل سلطة. والسؤال: هل تقاوم دون معيار؟'},

{h:'نقد غرامشي: هل الناس مخدوعون فعلًا؟',
body:`<p>أخطر ما في القراءة الشائعة لغرامشي فكرة «الوعي الزائف»: أن المحكومين لا يرون مصالحهم لأن الهيمنة غسلت أدمغتهم. وقد جاء أقوى رد عليها من عالم السياسة والأنثروبولوجيا <strong>جيمس سكوت</strong>.</p>
<p>في كتابه «أسلحة الضعفاء» (١٩٨٥) درس قرية ماليزية سنوات، ووجد أن الفلاحين الفقراء لم يكونوا مخدوعين أبدًا. كانوا يعرفون تمامًا أنهم مظلومون، لكنهم لا يثورون علنًا لأن الثورة انتحار. بدل ذلك يقاومون بأسلحة يومية: التباطؤ، والتظاهر بالجهل، والسرقة الصغيرة، والنميمة عن الأغنياء، والتخريب الهادئ.</p>
<p>ثم في «الهيمنة وفنون المقاومة» (١٩٩٠) قدم مفهومين: <strong>«النص العلني»</strong>، أي ما يقوله المحكومون أمام الأقوياء، وهو غالبًا موافقة وإذعان، و<strong>«النص الخفي»</strong>، أي ما يقولونه فيما بينهم بعيدًا عن الأعين، وهو غالبًا سخرية ورفض. والخطأ الذي يقع فيه من يتحدث عن «الهيمنة» أنه يقرأ النص العلني فقط، فيظن أن الناس راضون.</p>
<p>وهذا تصحيح مهم لك: <em>لا تفترض أن الصامتين مخدوعين.</em> كثير ممن يبدون موافقين يعرفون أكثر مما يقولون. والسؤال ليس «لماذا لا يرى الناس؟» بل كثيرًا ما يكون «ما الذي يجعل الكلام العلني مكلفًا إلى هذا الحد؟».</p>`,
field:`ده بتشوفه في أي شغل: في الاجتماع الكل موافق ومبتسم، وفي البريك الكل بيتريق على القرار. اللي يحكم على الفريق من الاجتماع بس يقول «الفريق مقتنع». سكوت بيقولك: لأ، دول عارفين كويس، بس الكلام العلني غالي. ولو انت مدير، دي أخطر معلومة: الموافقة العلنية مش دليل اقتناع.`,
key:'سكوت: المحكومون غالبًا ليسوا مخدوعين، بل يقاومون بأسلحة يومية. «النص العلني» إذعان، و«النص الخفي» رفض. الصمت ليس دليل اقتناع.'},

{h:'نقد مهندسي الرضا: ليبمان أم ديوي؟',
body:`<p>رأيت في الملف ٨ أن ليبمان وبيرنيز لم يصفا التلاعب فقط، بل رأياه ضروريًا: الجمهور عاجز عن فهم العالم المعقد، فليصنع الخبراء صورته. وهذا يحمل خطرًا يمسك أنت شخصيًا: <strong>من يتقن أدوات صناعة الرضا قد يقتنع بأنه من «الخبراء» الذين يحق لهم صناعته للآخرين.</strong></p>
<p>رد الفيلسوف الأمريكي <strong>جون ديوي</strong> في «الجمهور ومشكلاته» (١٩٢٧) بأن الحل ليس حكم نخبة تعرف أكثر، بل جمهور يتعلم: تعليم أفضل، ووسائل تواصل تسمح للناس بأن يفهموا كيف تمسهم القرارات، ونقاش حقيقي. وقال إن الخبراء ضروريون للمعرفة التقنية، لكن الناس وحدهم يعرفون أين «يوجعهم الحذاء».</p>
<p>وهذا الخلاف يضعك أمام اختيار أخلاقي واضح بعد هذا المنهج: هل ستستعمل ما تعلمته <em>لتفكك</em> التلاعب أمام الناس فيفهموا أكثر، أم <em>لتمارسه</em> عليهم لأنك «تعرف أفضل»؟ أرسطو أجاب في الملف الأول: نتعلم الحجة ونقيضها «لا لنفعل الأمرين، فلا يجوز أن نقنع الناس بالباطل».</p>`,
key:'ليبمان: الخبراء يصنعون الصورة للجمهور. ديوي: الجمهور يتعلم ويفهم أين يوجعه الحذاء. والسؤال لك: تفكك التلاعب أم تمارسه؟'},

{h:'النقد الأكبر: إن كان كل شيء إطارًا، فعلى ماذا تقف؟',
body:`<p>هذا هو السؤال الذي يلاحقك منذ الملف صفر. إذا كانت كل جملة تحمل إطارًا، وكل بديهة صُنعت، وكل معرفة متشابكة مع السلطة، فهل يبقى شيء يمكن الوثوق به؟</p>
<p>هنا مفترق طرق يصل إليه كل من يدرس هذه النظريات، وأغلب الناس يسقطون في واحد من فخين:</p>
<ul>
<li><strong>فخ السخرية:</strong> «كله كذب، كله سلطة، مفيش حاجة حقيقية». ومن يصل إلى هذا يصير أسهل في التلاعب لا أصعب، لأنه لم يعد يملك معيارًا يفرق به بين كذب أكبر وكذب أصغر، فيصدق في النهاية من يتقن السخرية معه.</li>
<li><strong>فخ المؤامرة:</strong> «كل شيء مدبر، ووراء كل خبر يد خفية». وهذا يحول أدوات التحليل إلى آلة لا تنتج إلا ما يؤكد ما في الرأس.</li>
</ul>
<p>والطريق الثالث، طريق الضابط، يحتاج <strong>نقطة ارتكاز</strong>: معيار للحق لا يصنعه الميكروفون. وفي التراث الإسلامي قول <em>يُنسب</em> إلى علي بن أبي طالب يلخص هذا المبدأ: <strong>«إن الحق لا يُعرف بالرجال؛ اعرف الحق تعرف أهله.»</strong> أي أن قيمة الكلام لا تأتي من صفة قائله ولا من سلطته ولا من الطقس الذي قيل فيه، بل من مطابقته للحق. وهذا بالضبط ما يحتاجه من يستعمل أدوات فوكو دون أن يسقط في نسبيته: أن يكشف كيف تمنح السلطة الكلام وزنًا، <em>لأنه</em> يؤمن بأن هناك وزنًا حقيقيًا لا تمنحه السلطة.</p>
<p>وبهذا تكتمل الصورة: أدوات المنهج كله تكشف <strong>كيف</strong> يُقبل الكلام ويُرفض. لكنها لا تجيب عن <strong>هل</strong> هو حق. هذا السؤال الأخير يبقى سؤالك أنت، وتحتاج له معيارًا من خارج اللعبة كلها.</p>`,
field:`الفكرة دي هي اللي بتخلي المنهج كله سلاح في إيدك مش عليك. اللي مالوش نقطة ارتكاز، كل ما يتعلم أدوات تفكيك أكتر، كل ما يبقى تايه أكتر. واللي عنده معيار ثابت للحق، كل أداة جديدة بتخليه يشوف أوضح. الأدوات بتشيل الضباب. بس لازم يكون فيه حاجة وراه تشوفها.`,
key:'فخان: السخرية (كله كذب) والمؤامرة (كله مدبر). والطريق الثالث نقطة ارتكاز: «الحق لا يُعرف بالرجال». الأدوات تكشف كيف يُقبل الكلام، لا هل هو حق.'},

{h:'عقد الضابط: ما بعد المنهج',
body:`<p>تنتهي الملفات هنا، وهذه خلاصة ما تحمله معك:</p>
<ol>
<li><strong>سلّم الخفاء:</strong> السيف، والحجة، والبديهة، وحدود الكلام. وكل درجة عليا تستند إلى السيف عند الأزمة.</li>
<li><strong>أسلحة أرسطو:</strong> الإيثوس والباثوس واللوغوس، والأجناس، والمقدمة المحذوفة، والمواضع، وكتالوج الانفعالات.</li>
<li><strong>خريطة غرامشي:</strong> الخندق والحصون، والسيطرة والقيادة، والتنازل غير الجوهري، والتحويل، والحس المشترك، والمثقف العضوي.</li>
<li><strong>أسئلة فوكو:</strong> من يحق له القول، وما الذي لا يمكن قوله، وما الموضوع الذي يُكوَّن، ومن وضع المعيار.</li>
<li><strong>مصانع الرضا:</strong> الصور في الرؤوس، وصناعة البيئة، والإطار، والوظائف الأربع، والمرشحات.</li>
<li><strong>البروتوكول السباعي</strong> وقاعدة الغياب وفحص الإنصاف.</li>
<li><strong>التحصين والحركات الخمس.</strong></li>
<li><strong>نقطة الارتكاز.</strong></li>
</ol>
<p>وثلاثة بنود في عقد الضابط: <em>أن تستعمل الأدوات لترى لا لتتلاعب</em>، و<em>أن تطبقها على جهتك ونفسك قبل خصمك</em>، و<em>ألا تنسى أن الهدف من كشف الإطار هو الوصول إلى الحق، لا إثبات أن لا حق</em>.</p>`,
key:'عقد الضابط: الأدوات للرؤية لا للتلاعب، وتُطبق على جهتك ونفسك أولًا، والهدف الوصول إلى الحق لا إنكاره.'}
],

worked:{
 title:'حالة محلولة: الدفاع في اجتماع حي',
 case:`في اجتماع، يقول مدير القسم عن اقتراح قدمته لتوزيع أعباء الفريق بشكل أعدل:<br><b>«بصراحة، الاقتراح ده سلبي شوية. إحنا هنا فريق واحد، ومش وقت إن كل واحد يحسب هو شال كام وزميله شال كام. وبعدين كل الفرق اللي بتنجح في الشركة شغالة بنفس طريقتنا. خلينا نركز على الإيجابي.»</b>`,
 steps:[
  {h:'التحليل السريع: الحركة الأساسية', body:'في الرد أربع حركات: اسم («سلبي»)، ومفهوم لا يُعادى («فريق واحد»)، وموضع حكم سابق («كل الفرق اللي بتنجح»)، وتحويل للسؤال من «هل التوزيع عادل؟» إلى «هل أنت إيجابي؟» (نقل من مشاوري إلى احتفالي). <em>الحركة الأساسية:</em> نقل الجنس، لأنه يخرج سؤال العدالة من الساحة كلها.'},
  {h:'اختيار حركة الرد', body:'لا ترد على الأربع. اختر الحركة التي تضرب الحركة الأساسية: <strong>ارجع إلى السؤال الأصلي</strong>.'},
  {h:'الصياغة: بلا نفي للإطار', body:'لا تقل «أنا مش سلبي» (تكرار إطار الخصم). ولا تقل «حضرتك بتحول الموضوع» (اتهام). قل بنبرة هادئة: <b>«أنا متفق إننا فريق واحد، وعشان كده بالظبط عايز الحمل يبقى متوزع على الكل. السؤال اللي قدامنا: التوزيع الحالي عادل ولا محتاج تعديل؟»</b>'},
  {h:'لماذا تعمل هذه الصياغة؟', body:'أولًا قبلت المفهوم الذي لا يُعادى («فريق واحد») واستعملته لصالحك بدل أن تحاربه. ثانيًا أعدت السؤال المشاوري بوضوح. ثالثًا لم تهاجم أحدًا، فحافظت على إيثوس حسن النية. رابعًا لم تكرر كلمة «سلبي».'},
  {h:'الخطوة التالية إن لزم', body:'إن عاد المدير إلى «كل الفرق الناجحة»، فحركة ثانية بسؤال: «ممكن نشوف أرقام توزيع الشغل عندهم؟ لو هما كده فعلًا، يبقى نتعلم منهم». هنا تسحب المقدمة المحذوفة إلى الطاولة: هل هي حقيقة أم انطباع؟'},
  {h:'فحص الإنصاف', body:'قد يكون للمدير قلق مشروع: أن يتحول الفريق إلى محاسبة متبادلة تقتل التعاون. والرد الجيد يعترف بذلك ضمنًا («أنا متفق إننا فريق واحد»)، ولا يعامل المدير كخصم شرير.'}
 ],
 verdict:'لم تكسب النقاش بإثبات أن المدير متلاعب. كسبته بإعادة السؤال إلى ساحته، مستعملًا مفهومه هو، بنبرة لا تمنحه فرصة لتصويرك كـ«سلبي». هذا هو الفرق بين محلل يعرف الأدوات، وضابط يعرف متى يستعمل أيها.'
},
yourturn:{
 title:'دورك: افحص نفسك',
 case:`اختر قناعة قوية عندك عن موضوع عام (ليس عن الدين أو الأشخاص، بل عن العمل أو المجتمع أو الاقتصاد مثلًا)، قناعة تشعر أنها «بديهية».<br>ثم اختر جهة تتعاطف معها (مؤسسة، أو تيار فكري، أو كاتب تحبه)، واختر نصًا قصيرًا لها.`,
 prompt:'طبق أدوات المنهج على نفسك وعلى جهتك: هل قناعتك «دوكسا» تحتاج إلى نزع الطبيعية؟ وهل نص جهتك فيه تأطير؟ ثم حدد نقطة ارتكازك: بأي معيار ستحكم في النهاية؟',
 points:[
  'كتبت القناعة بوضوح، وسألت عن «تاريخ ميلادها»: متى ومن أين جاءتك؟',
  'حددت من هو «المثقف العضوي» الذي نقلها إليك',
  'وجدت حسًا سليمًا أو حجة مضادة لها وفكرت فيها بجدية (تحصين)',
  'طبقت طبقتين على الأقل من البروتوكول على نص جهتك ووجدت فيه تأطيرًا فعلًا',
  'لم تسقط في السخرية («كله كذب») ولا في التبرير («جهتي لا تؤطر»)',
  'حددت نقطة ارتكاز: المعيار الذي ستحكم به على صحة القناعة بعد كشف إطارها'
 ],
 model:`<p>(مثال) <b>القناعة:</b> «الشغل الحكومي أأمن من الخاص». <b>تاريخ الميلاد:</b> سمعتها في البيت منذ الصغر، وكانت صحيحة غالبًا في جيل أهلي. <b>المثقف العضوي:</b> الأسرة والجيران، ومنظومة كاملة كانت تجعل الوظيفة الحكومية رمز الاستقرار.</p>
<p><b>التحصين:</b> الحجة المضادة: الأمان الحقيقي اليوم قد يكون في المهارة القابلة للنقل لا في الجهة. وهي حجة تستحق التفكير.</p>
<p><b>نص جهتي:</b> كاتب أحبه كتب مقالًا عن «ريادة الأعمال». طبقت عليه الأسماء والوظائف: وجدت أنه يعرّف المشكلة بأنها «خوف الشباب»، ويخفي أن كثيرًا من المشروعات تفشل لأسباب بنيوية. أي أن جهتي تؤطر أيضًا.</p>
<p><b>نقطة الارتكاز:</b> لن أحكم على القناعة بأنها «قديمة» ولا بأنها «من أهلي»، بل بالأرقام والتجربة المتاحة لوضعي أنا، وبما أراه حقًا بعد النظر، لا بما يُقال حولي.</p>`
},

<script>
'use strict';
/* ========== state ========== */
const SITE = !!window.MAHER;
const KEY = SITE ? 'maher:tafkik' : 'tafkik_v1';
const DEF = {xp:0, done:{}, maxStep:{}, ans:{}, awarded:{}, review:{}, boss:{}, last:null,
  settings:{theme:'cream', font:'naskh', size:19, lh:1.95, width:760}};
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEF);
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); S = Object.assign(clone(DEF), p); S.settings = Object.assign(clone(DEF.settings), p.settings || {}); }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ========== helpers ========== */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function toast(msg, cls){ if (SITE) { MAHER.toast(msg); return; } const t = h('div', {class: cls || ''}, msg); document.getElementById('toast').append(t); setTimeout(() => t.remove(), cls === 'big' ? 3200 : 1900); }

/* ========== ranks / xp ========== */
const RANKS = [[0,'مُجنَّد'],[150,'محلل ميداني'],[400,'ضابط تحليل'],[800,'رائد'],[1300,'رئيس قسم'],[2000,'مدير عمليات'],[3000,'رئيس الجهاز']];
function rankOf(xp){ let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k; return {name:RANKS[i][1], min:RANKS[i][0], next:RANKS[i+1] || null}; }
function award(key, n, label){
  if (S.awarded[key] || n <= 0) return;
  S.awarded[key] = 1;
  const before = rankOf(S.xp).name; S.xp += Math.round(n); save();
  toast('+' + AR(Math.round(n)) + ' XP' + (label ? ' — ' + label : ''));
  const after = rankOf(S.xp).name;
  if (after !== before) setTimeout(() => toast('ترقية: ' + after, 'big'), 700);
  updateTop();
}

/* ========== question registry & review ========== */
const QREG = {};
FILES.forEach(f => {
  if (!f.ready) return;
  (f.challenges || []).forEach((q, i) => { q.id = f.id + '-c' + i; q.file = f.id; QREG[q.id] = q; });
  (f.boss || []).forEach((q, i) => { q.id = f.id + '-b' + i; q.file = f.id; QREG[q.id] = q; });
});
const BOX_DAYS = [1, 3, 7, 14, 30];
function enqueue(id){ if (!S.review[id]) { S.review[id] = {box:0, due:Date.now() + 864e5}; } }
function enqueueWrong(id){ S.review[id] = {box:0, due:Date.now() + 6 * 3600e3}; }
function schedule(id, ok){
  const r = S.review[id] || {box:0, due:0};
  if (ok){ r.box = Math.min(r.box + 1, BOX_DAYS.length - 1); r.due = Date.now() + BOX_DAYS[r.box] * 864e5; }
  else { r.box = 0; r.due = Date.now() + 6 * 3600e3; }
  S.review[id] = r; save();
}
function dueList(){ const now = Date.now(); return Object.keys(S.review).filter(id => QREG[id] && S.review[id].due <= now); }

/* ========== question renderers ==========
   mode: practice | boss | review ; onDone(score 0..1) called once per attempt */
function renderQ(q, mode, onDone){
  const wrap = h('div', {class:'card qcard'});
  if (q.tag) wrap.append(h('div', {class:'qtag'}, q.tag));
  wrap.append(h('div', {class:'qt', html:q.q}));
  const body = h('div'); wrap.append(body);
  const fb = h('div');
  let hintsUsed = 0, reported = false;
  const report = s => { if (reported) return; reported = true; const hb = wrap.querySelector('.hintbtn'); if (hb) hb.remove(); onDone && onDone(s, hintsUsed); };

  if (q.type === 'mcq'){
    let opts = q.options.map((t, i) => ({t, i}));
    opts = shuffle(opts);
    const box = h('div', {class:'opts'});
    let first = true;
    opts.forEach(o => {
      const b = h('button', {class:'opt', html:o.t, onclick:() => {
        if (b.disabled) return;
        const ok = o.i === q.answer;
        if (mode === 'practice'){
          if (ok){
            b.classList.add('right'); box.querySelectorAll('.opt').forEach(x => x.disabled = true);
            fb.replaceChildren(h('div', {class:'feedback ok', html:'<b>صح.</b> ' + (q.explain || '')}));
            report(first ? 1 : 0);
          } else {
            b.classList.add('wrong'); b.disabled = true;
            fb.replaceChildren(h('div', {class:'feedback no', html:'<b>مش دي.</b> ' + (q.wrongNote || 'فكّر تاني، أو خد تلميح.')}));
            if (first && q.id) { enqueueWrong(q.id); save(); }
          }
          first = false;
        } else {
          box.querySelectorAll('.opt').forEach(x => x.disabled = true);
          const rightBtn = [...box.children][opts.findIndex(z => z.i === q.answer)];
          rightBtn.classList.add('right'); if (!ok) b.classList.add('wrong');
          fb.replaceChildren(h('div', {class:'feedback ' + (ok ? 'ok' : 'no'), html:(ok ? '<b>صح.</b> ' : '<b>غلط.</b> ') + (q.explain || '')}));
          report(ok ? 1 : 0);
        }
      }});
      box.append(b);
    });
    body.append(box);
  }

  else if (q.type === 'classify'){
    const items = mode === 'practice' ? q.items : shuffle(q.items);
    const sel = new Array(items.length).fill(null);
    const rows = items.map((it, k) => {
      const cats = h('div', {class:'cats'});
      q.cats.forEach((c, ci) => cats.append(h('button', {onclick:(ev) => {
        if (row.dataset.locked) return;
        sel[k] = ci; cats.querySelectorAll('button').forEach(x => x.classList.remove('sel')); ev.currentTarget.classList.add('sel');
      }}, c)));
      const row = h('div', {class:'cls-item'}, h('div', {class:'it', html:it.t}), cats);
      return row;
    });
    rows.forEach(r => body.append(r));
    const btn = h('button', {class:'btn', onclick:() => {
      if (sel.some(x => x === null)){ toast('صنّف كل البنود الأول'); return; }
      let right = 0;
      rows.forEach((r, k) => {
        r.dataset.locked = 1; r.querySelectorAll('.fix').forEach(x => x.remove());
        const ok = sel[k] === items[k].c; if (ok) right++;
        r.classList.toggle('right', ok); r.classList.toggle('wrong', !ok);
        if (!ok || items[k].why) r.append(h('div', {class:'fix', html:(ok ? '' : 'الصح: <b>' + q.cats[items[k].c] + '</b>. ') + (items[k].why || '')}));
      });
      const s = right / items.length;
      fb.replaceChildren(h('div', {class:'feedback ' + (s === 1 ? 'ok' : 'no'), html:'النتيجة: ' + AR(right) + ' من ' + AR(items.length) + (q.explain ? '<br>' + q.explain : '')}));
      if (s < 1 && q.id && mode === 'practice') { enqueueWrong(q.id); save(); }
      btn.remove(); report(s);
      if (mode === 'practice' && s < 1) fb.append(h('button', {class:'btn ghost', style:'margin-top:10px', onclick:() => wrap.replaceWith(renderQ(q, 'practice', null))}, 'جرّب تاني (من غير نقاط)'));
    }}, 'تحقّق');
    body.append(btn);
  }

  else if (q.type === 'order'){
    const pool = h('div', {class:'order-pool'}), ans = h('div', {class:'order-ans'});
    const picked = [];
    const draw = () => {
      ans.replaceChildren(...picked.map((i, n) => h('div', null, AR(n + 1) + '. ' + q.items[i])));
      if (!picked.length) ans.append(h('div', {class:'muted small', style:'background:none;border:0'}, 'اضغط البنود بالترتيب الصح...'));
    };
    shuffle(q.items.map((t, i) => i)).forEach(i => pool.append(h('button', {onclick:(ev) => { picked.push(i); ev.currentTarget.remove(); draw(); }}, q.items[i])));
    draw();
    body.append(h('div', {class:'small muted ui'}, 'ترتيبك:'), ans, pool);
    const reset = h('button', {class:'btn ghost', onclick:() => wrap.replaceWith(renderQ(q, mode, onDone))}, 'ابدأ من الأول');
    const btn = h('button', {class:'btn', onclick:() => {
      if (picked.length < q.items.length){ toast('رتّب كل البنود الأول'); return; }
      let right = 0;
      [...ans.children].forEach((d, n) => { const ok = picked[n] === n; if (ok) right++; d.classList.add(ok ? 'right' : 'wrong'); });
      const s = right / q.items.length;
      fb.replaceChildren(h('div', {class:'feedback ' + (s === 1 ? 'ok' : 'no'), html:'النتيجة: ' + AR(right) + ' من ' + AR(q.items.length) + '<br>الترتيب الصح: ' + q.items.map((t, n) => AR(n + 1) + '. ' + t).join(' ← ') + (q.explain ? '<br>' + q.explain : '')}));
      if (s < 1 && q.id && mode === 'practice') { enqueueWrong(q.id); save(); }
      btn.remove(); reset.remove(); report(s);
    }}, 'تحقّق');
    body.append(h('div', {class:'row'}, btn, reset));
  }

  if (mode === 'practice' && q.hints && q.hints.length){
    const hbox = h('div', {class:'hints'});
    const hb = h('button', {class:'btn ghost hintbtn', style:'margin-top:10px', onclick:() => {
      if (reported) return;
      hbox.append(h('div', {class:'hint', html:q.hints[hintsUsed]})); hintsUsed++;
      if (hintsUsed >= q.hints.length) hb.remove(); else hb.textContent = 'تلميح (' + AR(hintsUsed + 1) + '/' + AR(q.hints.length) + ')';
    }}, 'تلميح (١/' + AR(q.hints.length) + ')');
    wrap.append(hb, hbox);
  }
  wrap.append(fb);
  return wrap;
}

/* free-text with checklist self-grading */
function renderFree(key, spec, xpMax, label){
  const st = S.ans[key] || (S.ans[key] = {text:'', submitted:false, checks:[]});
  const card = h('div', {class:'card'});
  if (spec.title) card.append(h('h2', {class:'read', style:'margin-top:0'}, spec.title));
  if (spec.case) card.append(h('div', {class:'casebox read', html:spec.case}));
  card.append(h('p', {class:'read', html:'<b>' + spec.prompt + '</b>'}));
  const ta = h('textarea', {placeholder:'اكتب تحليلك هنا... (بيتحفظ تلقائي)'}); ta.value = st.text || '';
  ta.addEventListener('input', () => { st.text = ta.value; save(); });
  card.append(ta);
  const after = h('div');
  const showCheck = () => {
    after.replaceChildren();
    after.append(h('p', {class:'ui muted', style:'margin:14px 0 6px'}, 'علّم على كل نقطة إجابتك غطّتها فعلًا. خليك صارم مع نفسك؛ دي نقاط إلزامية، مش ديكور.'));
    spec.points.forEach((p, i) => {
      const cb = h('input', {type:'checkbox'}); cb.checked = !!st.checks[i];
      cb.addEventListener('change', () => { st.checks[i] = cb.checked; save(); });
      after.append(h('label', {class:'check'}, cb, h('span', {html:p})));
    });
    const res = h('div');
    after.append(h('button', {class:'btn sage', style:'margin-top:12px', onclick:() => {
      const n = spec.points.filter((_, i) => st.checks[i]).length, r = n / spec.points.length;
      st.score = r; save();
      res.replaceChildren(h('div', {class:'feedback ' + (r >= .8 ? 'ok' : 'no'), html:'غطّيت ' + AR(n) + ' من ' + AR(spec.points.length) + ' (' + AR(Math.round(r * 100)) + '٪). ' + (r >= .8 ? 'شغل ضابط.' : 'ارجع للنقاط اللي فاتتك واقرا الإجابة النموذجية تحت.')}));
      award(key, Math.max(5, xpMax * r), label);
      if (spec.model && !after.querySelector('.model')) after.append(h('div', {class:'card model read', style:'margin-top:14px;background:var(--bg)'}, h('h3', {style:'margin-top:0'}, 'إجابة نموذجية'), h('div', {html:spec.model})));
      card.dispatchEvent(new CustomEvent('graded'));
    }}, 'احسب النتيجة'), res);
  };
  const sub = h('button', {class:'btn', style:'margin-top:10px', onclick:() => {
    if ((ta.value || '').trim().length < 40){ toast('اكتب تحليل حقيقي الأول (سطرين على الأقل)'); return; }
    st.submitted = true; save(); sub.remove(); showCheck();
  }}, 'سلّم وقارن');
  if (st.submitted) showCheck(); else card.append(sub);
  card.append(after);
  return card;
}

/* ========== top bar & settings ========== */
function updateTop(){
  const r = rankOf(S.xp);
  document.getElementById('rankchip').textContent = r.name + ' — ' + AR(S.xp) + ' XP';
}
function applySettings(){
  if (SITE) return;
  const s = S.settings;
  document.documentElement.setAttribute('data-theme', s.theme);
  document.body.setAttribute('data-font', s.font);
  document.documentElement.style.setProperty('--fs', s.size + 'px');
  document.documentElement.style.setProperty('--lh', s.lh);
  document.documentElement.style.setProperty('--w', s.width + 'px');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
function openSettings(){
  const s = S.settings, sh = document.getElementById('settings');
  const seg = (opts, key) => h('div', {class:'seg'}, opts.map(([v, t]) => h('button', {class:s[key] === v ? 'on' : '', onclick:() => { s[key] = v; save(); applySettings(); openSettings(); }}, t)));
  const rng = (key, min, max, step, fmt) => {
    const out = h('span', null, fmt(s[key]));
    const r = h('input', {type:'range', min, max, step, value:s[key]});
    r.addEventListener('input', () => { s[key] = +r.value; out.textContent = fmt(s[key]); save(); applySettings(); });
    return [out, r];
  };
  const [o1, r1] = rng('size', 15, 26, 1, v => AR(v) + 'px');
  const [o2, r2] = rng('lh', 1.6, 2.4, .05, v => AR(v.toFixed(2)));
  const [o3, r3] = rng('width', 560, 960, 20, v => AR(v) + 'px');
  let armed = false;
  const resetBtn = h('button', {class:'btn ghost', style:'margin-top:18px;color:var(--rose)', onclick:() => {
    if (!armed){ armed = true; resetBtn.textContent = 'متأكد؟ اضغط تاني لمسح كل التقدم'; return; }
    const keep = S.settings; S = clone(DEF); S.settings = keep; save(); sh.classList.add('hidden'); updateTop(); route();
  }}, 'مسح التقدم');
  const panel = h('div', {class:'panel'},
    h('div', {class:'row'}, h('h3', null, 'إعدادات القراءة'), h('span', {class:'spacer'}), h('button', {class:'btn soft', onclick:() => sh.classList.add('hidden')}, 'تم')),
    h('label', null, 'الثيم'), seg([['cream','كريمي'],['sand','رملي'],['sepia','سيبيا'],['night','ليلي ناعم']], 'theme'),
    h('label', null, 'الخط'), seg([['naskh','نسخ (كلاسيكي)'],['sans','حديث']], 'font'),
    h('label', null, 'حجم الخط ', o1), r1,
    h('label', null, 'تباعد السطور ', o2), r2,
    h('label', null, 'عرض عمود القراءة ', o3), r3,
    resetBtn
  );
  sh.replaceChildren(panel); sh.classList.remove('hidden');
  sh.onclick = e => { if (e.target === sh) sh.classList.add('hidden'); };
}

/* ========== routing ========== */
const STEPS = [
  {k:'brief', t:'الإحاطة'}, {k:'predict', t:'توقّع'}, {k:'lesson', t:'الشرح'}, {k:'quotes', t:'من النص'},
  {k:'worked', t:'حالة محلولة'}, {k:'yourturn', t:'دورك'}, {k:'challenges', t:'التحديات'},
  {k:'critique', t:'ورقة النقد'}, {k:'explain', t:'اشرحها بكلامك'}, {k:'boss', t:'الزعيم'}
];
const app = () => document.getElementById('app');
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
function route(){
  const p = (location.hash || '#/').slice(2).split('/');
  window.scrollTo(0, 0);
  if (p[0] === 'f' && FILES[+p[1]] && isOpen(+p[1])) return viewFile(+p[1], +(p[2] || 0));
  if (p[0] === 'review') return viewReview();
  viewHome();
}
window.addEventListener('hashchange', route);
const isOpen = i => FILES[i].ready && (i === 0 || !!S.done[i - 1]);

/* ========== home ========== */
function viewHome(){
  const r = rankOf(S.xp);
  const pct = r.next ? Math.round((S.xp - r.min) / (r.next[0] - r.min) * 100) : 100;
  const doneN = Object.keys(S.done).length;
  const due = dueList().length;
  const cont = S.last && FILES[S.last.f] && isOpen(S.last.f) ? S.last : (isOpen(0) ? {f:0, s:0} : null);
  const hero = h('div', {class:'card hero'},
    h('div', {class:'qtag'}, 'المادة'),
    h('h1', null, 'فلسفة الخطاب والهيمنة الناعمة'),
    h('p', {class:'sub'}, 'تشريح التلاعب غير المرئي: أرسطو، غرامشي، فوكو، ومهندسو الرضا'),
    h('div', {class:'row ui', style:'margin-bottom:8px'}, h('b', null, 'رتبتك: ' + r.name), h('span', {class:'spacer'}), h('span', {class:'muted'}, r.next ? AR(S.xp) + ' / ' + AR(r.next[0]) + ' للترقية لـ' + r.next[1] : 'أعلى رتبة')),
    h('div', {class:'bar'}, h('i', {style:'width:' + pct + '%'})),
    h('div', {class:'row ui muted', style:'margin:10px 0 14px'}, h('span', null, 'ملفات مكتملة: ' + AR(doneN) + ' / ' + AR(FILES.length))),
    h('div', {class:'row'},
      cont ? h('button', {class:'btn', onclick:() => go('#/f/' + cont.f + '/' + cont.s)}, doneN || S.last ? 'كمّل من مكانك' : 'ابدأ الملف الأول') : null,
      h('button', {class:'btn soft', onclick:() => go('#/review')}, 'خزنة المراجعة' + (due ? ' (' + AR(due) + ')' : '')))
  );
  const how = h('details', {class:'card how'}, h('summary', null, 'إزاي تلعب'),
    h('ul', null,
      h('li', null, 'كل ملف فيه ١٠ خطوات: إحاطة ← توقّع ← شرح ← نصوص ← حالة محلولة ← دورك ← تحديات ← ورقة نقد ← اشرحها بكلامك ← الزعيم.'),
      h('li', null, 'التلميحات على ٣ درجات، وكل تلميح بيقلل نقاط السؤال. الإجابة ماتظهرش إلا بعد ما تحاول.'),
      h('li', null, 'الزعيم: لازم ٨٠٪ علشان الملف اللي بعده يتفتح. لو وقعت، المحاولة الجاية بتتلخبط أسئلتها.'),
      h('li', null, 'أي سؤال تغلط فيه بيتحط في خزنة المراجعة ويرجعلك بعد كام ساعة. واللي تجاوبه صح بيبعد أكتر (١، ٣، ٧، ١٤، ٣٠ يوم).'),
      h('li', null, 'الإجابات المكتوبة بتصححها انت بقائمة نقاط إلزامية. الأمانة هنا بتاعتك.'),
      h('li', null, 'التقدم محفوظ على الجهاز ده والمتصفح ده.')));
  const map = h('div');
  let lastPart = '';
  FILES.forEach((f, i) => {
    if (f.part !== lastPart){ map.append(h('div', {class:'part'}, f.part)); lastPart = f.part; }
    const open = isOpen(i), done = !!S.done[i];
    const status = done ? h('span', {class:'badge ok'}, 'مكتمل') : open ? h('span', {class:'badge go'}, 'مفتوح') : !f.ready ? h('span', {class:'badge'}, 'قيد الإعداد') : h('span', {class:'badge'}, 'مقفول');
    const node = h(open ? 'a' : 'div', {class:'card node' + (done ? ' done' : '') + (open ? '' : ' locked'), href:open ? '#/f/' + i + '/' + Math.min(S.maxStep[i] || 0, 9) : null, style:'margin-bottom:10px'},
      h('div', {class:'num'}, AR(i)),
      h('div', {style:'flex:1'}, h('div', {class:'t'}, f.title), h('div', {class:'s'}, f.sub)),
      status);
    map.append(node);
  });
  let armed = false;
  const reset = SITE ? h('div', {style:'text-align:center;margin:26px 0 6px'}, h('button', {class:'btn ghost', style:'font-size:13.5px;color:var(--muted)', onclick:(ev) => {
    if (!armed){ armed = true; ev.currentTarget.textContent = 'متأكد؟ اضغط تاني لمسح كل تقدم الدراسة'; return; }
    S = clone(DEF); save(); updateTop(); route();
  }}, 'مسح تقدم الدراسة')) : null;
  app().replaceChildren(hero, how, map, reset || '');
}

/* ========== file view ========== */
function viewFile(fid, si){
  const f = FILES[fid];
  const max = S.maxStep[fid] || 0;
  if (si > max) si = max;
  S.last = {f:fid, s:si}; save();
  const nav = h('div', {class:'steps'}, STEPS.map((s, i) => h('button', {class:(i === si ? 'on ' : '') + (i <= max ? 'reached' : ''), disabled:i > max, onclick:() => go('#/f/' + fid + '/' + i)}, AR(i + 1) + '. ' + s.t)));
  const head = h('div', {class:'filehead'}, h('div', {class:'k'}, 'الملف ' + AR(fid) + ' — ' + f.part), h('h1', null, f.title));
  const content = h('div');
  const next = (enabled, label) => {
    const b = h('button', {class:'btn', disabled:!enabled, onclick:() => {
      if (b.disabled) return;
      S.maxStep[fid] = Math.max(S.maxStep[fid] || 0, si + 1); save();
      go('#/f/' + fid + '/' + (si + 1));
    }}, label || 'التالي ←');
    return b;
  };
  const step = STEPS[si].k;
  let nb;

  if (step === 'brief'){
    content.append(h('div', {class:'card read', html:f.brief}),
      h('div', {class:'card read'}, h('h2', null, 'هتخرج من الملف ده وانت قادر:'), h('ul', null, f.objectives.map(o => h('li', {html:o})))));
    nb = next(true, 'استلمت المهمة ←'); nb.addEventListener('click', () => award(fid + ':brief', 10, 'إحاطة'), {capture:true});
  }

  else if (step === 'predict'){
    const p = f.predict, st = S.ans[fid + ':predict'];
    const card = h('div', {class:'card qcard'}, h('div', {class:'qtag'}, 'قبل ما تقرا أي شرح: توقّع'), h('div', {class:'qt', html:p.q}));
    const opts = h('div', {class:'opts'}), rv = h('div');
    nb = next(!!st);
    const reveal = (pick) => {
      opts.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.i; b.disabled = true; if (i === p.answer) b.classList.add('right'); else if (i === pick) b.classList.add('wrong'); });
      rv.replaceChildren(h('div', {class:'feedback ' + (pick === p.answer ? 'ok' : 'no'), html:(pick === p.answer ? '<b>توقّعك صح.</b> ' : '<b>توقّع مختلف، وده طبيعي. خلي الإجابة دي في دماغك وانت بتقرا.</b> ') + p.reveal}));
    };
    const order = S.ans[fid + ':porder'] || (S.ans[fid + ':porder'] = shuffle(p.options.map((_, i) => i)));
    order.forEach(i => { const t = p.options[i]; opts.append(h('button', {class:'opt', 'data-i':i, html:t, onclick:() => {
      if (S.ans[fid + ':predict']) return;
      S.ans[fid + ':predict'] = {pick:i}; save(); reveal(i);
      award(fid + ':predict', i === p.answer ? 15 : 10, 'توقّع'); nb.disabled = false;
    }})); });
    card.append(opts, rv); content.append(card);
    if (st) reveal(st.pick);
  }

  else if (step === 'lesson'){
    const toc = h('div', {class:'card toc'}, h('div', {class:'qtag'}, 'فهرس الشرح'), f.lesson.map((s, i) => h('a', {href:'javascript:void 0', onclick:() => document.getElementById('sec' + i).scrollIntoView({behavior:'smooth'})}, AR(i + 1) + '. ' + s.h)));
    content.append(toc);
    f.lesson.forEach((s, i) => {
      const c = h('article', {class:'card read', id:'sec' + i}, h('h2', null, AR(i + 1) + '. ' + s.h), h('div', {html:s.body}));
      if (s.field) c.append(h('div', {class:'field', html:s.field}));
      if (s.key) c.append(h('div', {class:'key', html:s.key}));
      content.append(c);
    });
    nb = next(true, 'خلّصت القراءة ←'); nb.addEventListener('click', () => award(fid + ':lesson', 40, 'الشرح'), {capture:true});
  }

  else if (step === 'quotes'){
    content.append(h('p', {class:'ui muted', style:'margin:0 4px 10px'}, 'اقتباسات قصيرة بترجمة عربية من المنهج. اقرا كل واحد، وبعدين اقرا سطر «ليه ده مهم».'));
    f.quotes.forEach(q => content.append(h('blockquote', {class:'q'}, h('p', {html:'«' + q.t + '»'}), h('cite', null, q.src), q.why ? h('div', {class:'why', html:q.why}) : null)));
    nb = next(true); nb.addEventListener('click', () => award(fid + ':quotes', 10, 'النصوص'), {capture:true});
  }

  else if (step === 'worked'){
    const w = f.worked;
    content.append(h('div', {class:'card read'}, h('h2', {style:'margin-top:0'}, w.title), h('div', {class:'casebox', html:w.case}), h('p', {class:'ui muted'}, 'قبل ما تفتح كل خطوة، حاول تتوقعها في دماغك.')));
    const stepsBox = h('div', {class:'card read'});
    content.append(stepsBox);
    let k = S.ans[fid + ':worked'] || 0;
    nb = next(k >= w.steps.length);
    const more = h('button', {class:'btn soft'}, 'افتح الخطوة الجاية');
    const draw = () => {
      stepsBox.replaceChildren(...w.steps.slice(0, k).map((s, i) => h('div', {class:'wstep'}, h('h3', null, 'الخطوة ' + AR(i + 1) + ': ' + s.h), h('div', {html:s.body}))));
      if (k < w.steps.length) stepsBox.append(more);
      else { if (w.verdict) stepsBox.append(h('div', {class:'key', html:w.verdict})); nb.disabled = false; award(fid + ':worked', 20, 'الحالة المحلولة'); }
    };
    more.onclick = () => { k++; S.ans[fid + ':worked'] = k; save(); draw(); };
    draw();
  }

  else if (step === 'yourturn'){
    const card = renderFree(fid + ':yourturn', f.yourturn, 40, 'دورك');
    content.append(card);
    nb = next(!!(S.ans[fid + ':yourturn'] || {}).score || (S.ans[fid + ':yourturn'] || {}).score === 0);
    card.addEventListener('graded', () => nb.disabled = false);
  }

  else if (step === 'challenges'){
    const list = f.challenges;
    const doneCount = () => list.filter(q => S.ans[q.id]).length;
    const prog = h('div', {class:'prog'});
    const upd = () => { prog.textContent = 'اتحل ' + AR(doneCount()) + ' من ' + AR(list.length); nb && (nb.disabled = doneCount() < list.length); };
    content.append(prog);
    list.forEach((q, i) => {
      const st = S.ans[q.id];
      const card = renderQ(Object.assign({}, q, {tag:'تحدي ' + AR(i + 1)}), 'practice', (s, hints) => {
        if (!S.ans[q.id]){ S.ans[q.id] = {score:s, hints}; save(); award(q.id, s >= 1 ? Math.max(8, 20 - 5 * hints) : 20 * s * .5, 'تحدي'); }
        upd();
      });
      if (st) card.append(h('div', {class:'done-mark'}, 'اتحل قبل كده — أول محاولة: ' + AR(Math.round(st.score * 100)) + '٪'));
      content.append(card);
    });
    nb = next(false); upd();
  }

  else if (step === 'critique'){
    content.append(h('p', {class:'ui muted', style:'margin:0 4px 10px'}, 'هنا بنقلب السلاح على نفسه: فين الأداة دي بتغلط، وفين ممكن تضرك لو استعملتها غلط.'));
    f.critique.forEach((c, i) => content.append(h('div', {class:'card read'}, h('h2', null, AR(i + 1) + '. ' + c.h), h('div', {html:c.body}))));
    nb = next(true); nb.addEventListener('click', () => award(fid + ':critique', 15, 'ورقة النقد'), {capture:true});
  }

  else if (step === 'explain'){
    const card = renderFree(fid + ':explain', Object.assign({title:'اشرحها بكلامك'}, f.explain), 40, 'الشرح بكلامك');
    content.append(card);
    const st = S.ans[fid + ':explain'] || {};
    nb = next(st.score != null);
    card.addEventListener('graded', () => nb.disabled = false);
  }

  else if (step === 'boss'){
    viewBoss(fid, content);
  }

  const navRow = h('div', {class:'navrow'},
    si > 0 ? h('button', {class:'btn ghost', onclick:() => go('#/f/' + fid + '/' + (si - 1))}, '→ السابق') : h('button', {class:'btn ghost', onclick:() => go('#/')}, '→ الخريطة'),
    nb || h('span'));
  app().replaceChildren(head, nav, content, navRow);
  const on = nav.querySelector('.on'); if (on) requestAnimationFrame(() => { nav.scrollLeft = on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2; window.scrollTo(0, 0); });
}

/* ========== boss ========== */
function viewBoss(fid, content){
  const f = FILES[fid], best = S.boss[fid];
  const intro = h('div', {class:'card bosshead'},
    h('div', {class:'qtag'}, 'الزعيم'),
    h('h2', {style:'margin:4px 0'}, f.bossTitle || 'ملف التفكيك الشامل'),
    h('p', {class:'muted ui'}, AR(f.boss.length) + ' سؤال — من غير تلميحات — لازم ٨٠٪ علشان تعدّي'),
    best != null ? h('p', {class:'ui'}, 'أحسن نتيجة: ' + AR(Math.round(best * 100)) + '٪' + (S.done[fid] ? ' — عدّيت' : '')) : null,
    h('button', {class:'btn', onclick:() => run()}, best != null ? 'محاولة جديدة' : 'ابدأ المواجهة'));
  content.replaceChildren(intro);
  function run(){
    const qs = shuffle(f.boss);
    let i = 0, total = 0; const wrong = [];
    const stage = h('div');
    content.replaceChildren(stage);
    const show = () => {
      window.scrollTo(0, 0);
      const q = qs[i];
      const nextB = h('button', {class:'btn', disabled:true}, i < qs.length - 1 ? 'السؤال الجاي ←' : 'شوف النتيجة');
      const card = renderQ(q, 'boss', s => { total += s; if (s < 1) wrong.push(q.id); nextB.disabled = false; });
      nextB.onclick = () => { if (nextB.disabled) return; i++; if (i < qs.length) show(); else finish(); };
      stage.replaceChildren(h('div', {class:'prog'}, 'سؤال ' + AR(i + 1) + ' من ' + AR(qs.length)), card, nextB);
    };
    const finish = () => {
      const score = total / qs.length, pass = score >= .8;
      S.boss[fid] = Math.max(S.boss[fid] || 0, score);
      wrong.forEach(enqueueWrong);
      if (pass){
        const first = !S.done[fid];
        S.done[fid] = true;
        S.maxStep[fid] = 9;
        [...f.challenges, ...f.boss].forEach(q => enqueue(q.id));
        save();
        if (first) award(fid + ':boss', 100, 'الزعيم');
      } else save();
      const nextFile = FILES[fid + 1];
      stage.replaceChildren(h('div', {class:'card bosshead'},
        h('div', {class:'big'}, AR(Math.round(score * 100)) + '٪'),
        h('h2', null, pass ? 'الملف اتقفل لصالحك' : 'لسه'),
        h('p', {class:'ui'}, pass ? 'أسئلة الملف اتحطت في خزنة المراجعة علشان ترجعلك على فترات.' : 'محتاج ٨٠٪. الأسئلة اللي غلطت فيها راحت الخزنة. ارجع للشرح أو التحديات وبعدين حاول تاني؛ المرة الجاية الترتيب هيتغير.'),
        pass && !nextFile ? h('p', {class:'ui', style:'font-weight:700;color:var(--accent-ink)'}, 'أنهيت المنهج كله. الملفات كلها مفتوحة للمراجعة، وخزنة المراجعة هتفضل ترجعلك الأسئلة على فترات.') : null,
        pass && nextFile ? (nextFile.ready ? h('button', {class:'btn', onclick:() => go('#/f/' + (fid + 1) + '/0')}, 'افتح الملف ' + AR(fid + 1) + ' ←') : h('p', {class:'muted ui'}, 'الملف ' + AR(fid + 1) + ' قيد الإعداد، وهيتضاف في التحديث الجاي.')) : null,
        h('div', {class:'row', style:'justify-content:center;margin-top:10px'},
          h('button', {class:'btn ghost', onclick:() => run()}, 'محاولة تانية'),
          h('button', {class:'btn ghost', onclick:() => go('#/')}, 'الخريطة'))));
      window.scrollTo(0, 0);
    };
    show();
  }
}

/* ========== review vault ========== */
function viewReview(){
  const ids = shuffle(dueList());
  const head = h('div', {class:'filehead'}, h('div', {class:'k'}, 'التكرار المتباعد'), h('h1', null, 'خزنة المراجعة'));
  if (!ids.length){
    const all = Object.values(S.review).map(r => r.due).sort((a, b) => a - b);
    const msg = all.length ? 'مفيش أسئلة مستحقة دلوقتي. أقرب سؤال هيرجع ' + new Date(all[0]).toLocaleString('ar-EG', {weekday:'long', hour:'numeric', minute:'2-digit'}) + '.' : 'الخزنة فاضية. الأسئلة بتدخلها لما تغلط في تحدي، أو لما تعدّي زعيم ملف.';
    app().replaceChildren(head, h('div', {class:'card read'}, h('p', null, msg), h('button', {class:'btn ghost', onclick:() => go('#/')}, 'الخريطة')));
    return;
  }
  let i = 0, right = 0;
  const stage = h('div');
  app().replaceChildren(head, stage);
  const show = () => {
    const q = QREG[ids[i]];
    const nb = h('button', {class:'btn', disabled:true}, i < ids.length - 1 ? 'التالي ←' : 'خلصت');
    const card = renderQ(Object.assign({}, q, {tag:'من الملف ' + AR(q.file)}), 'review', s => {
      const ok = s >= 1; if (ok) right++;
      schedule(q.id, ok);
      if (ok) award('rv:' + q.id + ':' + new Date().toDateString(), 5, 'مراجعة');
      nb.disabled = false;
    });
    nb.onclick = () => { if (nb.disabled) return; i++; window.scrollTo(0, 0); if (i < ids.length) show(); else stage.replaceChildren(h('div', {class:'card bosshead'}, h('div', {class:'big'}, AR(right) + '/' + AR(ids.length)), h('p', {class:'ui'}, 'اللي جاوبته صح هيبعد، واللي غلطت فيه هيرجعلك قريب.'), h('button', {class:'btn', onclick:() => go('#/')}, 'الخريطة'))); };
    stage.replaceChildren(h('div', {class:'prog'}, AR(i + 1) + ' من ' + AR(ids.length)), card, nb);
  };
  show();
}

/* ========== boot ========== */
applySettings(); updateTop();
if (!SITE) document.getElementById('setbtn').onclick = openSettings;
route();
