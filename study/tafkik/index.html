lesson:[
{h:'السجين الذي أراد الفاشيون أن يوقفوا عقله',
body:`<p>وُلد أنطونيو غرامشي سنة ١٨٩١ في جزيرة سردينيا، فقيرًا ومريضًا، بظهر محدب منذ طفولته. درس اللسانيات في تورينو، المدينة الصناعية الكبرى في الشمال، وهناك عاش تجربة «مجالس المصانع» حين احتل العمال المصانع في ١٩١٩–١٩٢٠. شارك في تأسيس الحزب الشيوعي الإيطالي سنة ١٩٢١، وانتُخب نائبًا في البرلمان.</p>
<p>اعتقله نظام موسوليني سنة ١٩٢٦. وتروي الرواية الشائعة أن المدعي العام قال في المحاكمة ما معناه: <em>يجب أن نمنع هذا العقل من العمل عشرين عامًا.</em> لكن العقل عمل. في السجن كتب غرامشي ما صار يُعرف بـ«دفاتر السجن»، نحو ثلاثين دفترًا وآلاف الصفحات، بين ١٩٢٩ و١٩٣٥. وكان يكتب تحت عين الرقيب، فاخترع لغة مشفرة: يسمي الماركسية «فلسفة الممارسة»، ويكتب «الجماعة الاجتماعية الأساسية» بدل «الطبقة». ومات سنة ١٩٣٧، بعد أيام من انتهاء مدة حبسه، دون أن يرى دفاتره منشورة.</p>
<p>لماذا يهمك هذا؟ لأن الطريقة التي كُتبت بها الدفاتر جزء من رسالتها. رجل محبوس يفكر في سؤال: لماذا يقبل الناس سلطة لا تخدمهم؟ ويكتب بلغة تتحايل على السلطة نفسها. أي أنه كان يمارس، وهو يكتب، ما يحلله: الصراع على الكلمات.</p>`,
field:`لاحظ حاجة: غرامشي ماكانش أكاديمي قاعد في مكتب. كان سياسي اتهزم. والمهزوم اللي بيفكر بجد بيبقى عنده سؤال أحسن من المنتصر: «إحنا خسرنا ليه، مع إن الأرقام كانت في صفنا؟». وده نفس السؤال اللي بيسأله أي حد خسر معركة في الشغل وهو فاكر إن الحق معاه.`,
key:'الدفاتر كُتبت في السجن بلغة مشفرة، حول سؤال واحد: لماذا يقبل الناس سلطة لا تخدمهم؟'},

{h:'لغز الشرق والغرب: الخندق والحصون',
body:`<p>كان أمام غرامشي لغز. نظرية الثورة التي آمن بها تتوقع أن تبدأ الثورة في البلاد الأكثر تصنيعًا. لكن الثورة نجحت في روسيا، البلد الفلاحي المتخلف، وفشلت في إيطاليا وألمانيا رغم مصانعهما وعمالهما المنظمين.</p>
<p>وجوابه من أشهر فقرات الدفاتر. يقول ما معناه: في الشرق كانت الدولة هي كل شيء، والمجتمع المدني بدائيًا هلاميًا. أما في الغرب فكانت هناك علاقة متوازنة بين الدولة والمجتمع المدني، وحين اهتزت الدولة ظهر فورًا بناء متين من المجتمع المدني. <strong>الدولة لم تكن إلا خندقًا أماميًا، وخلفه شبكة قوية من الحصون والتحصينات.</strong></p>
<p>الصورة عسكرية عن قصد. غرامشي عاش الحرب العالمية الأولى بخنادقها. في تلك الحرب كان المهاجم يقصف خط العدو الأول أيامًا، ثم يتقدم، فيكتشف أن وراء الخط الأول خطوطًا لم يمسها القصف. وكذلك الثوار في الغرب: أسقطوا الحكومة في لحظة أزمة، أو كادوا، ثم وجدوا وراءها المدرسة والكنيسة والصحافة والجمعيات والنقابات المعتدلة والأحزاب، وكلها تواصل الدفاع عن النظام بعد أن سقط خطه الأول.</p>
<p>وهنا الدرس الذي يهمك: <em>القوة الظاهرة، أي الحكومة والشرطة والقرار، ليست مركز الثقل.</em> مركز الثقل في الحصون الخلفية، حيث يتعلم الناس ما هو طبيعي وما هو معقول ومن يستحق الاحترام.</p>`,
field:`في أي شركة: المدير ده «الخندق الأمامي». ممكن يمشي بكرة. بس لو الثقافة اللي بنتها الإدارة ثابتة، هتلاقي المدير الجديد بيتصرف زي القديم، والموظفين بيدافعوا عن نفس القواعد اللي كانوا بيشتكوا منها. لأن الحصون اللي ورا، يعني التدريب والتقييم والنكت اللي بتتقال في البريك وقصص «الموظف المثالي»، لسه واقفة.`,
key:'في المجتمعات المستقرة، الحكومة خندق أمامي فقط، ووراءها حصون المجتمع المدني. مركز الثقل في الحصون.'},

{h:'السيطرة والقيادة: وجها السلطة',
body:`<p>من هذا اللغز يخرج غرامشي بالتمييز الذي يقوم عليه كل شيء. سيادة جماعة اجتماعية تظهر بطريقتين:</p>
<ul>
<li><strong>السيطرة</strong> (dominio): الإكراه، وتُمارس على الجماعات المعادية التي تريد الجماعة الحاكمة أن تصفيها أو تخضعها ولو بالقوة.</li>
<li><strong>القيادة الفكرية والأخلاقية</strong> (direzione): وتُمارس على الجماعات الحليفة والقريبة، وهي التي يسميها <em>الهيمنة</em>.</li>
</ul>
<p>والهيمنة ليست الكذب ولا غسل الأدمغة. هي، بتعبيره، <strong>«الرضا العفوي»</strong> الذي تمنحه الجماهير للاتجاه العام الذي تفرضه الجماعة الحاكمة على الحياة الاجتماعية. وكلمة «عفوي» مهمة جدًا: الناس لا يشعرون أنهم يوافقون تحت ضغط. هم يوافقون لأن الاتجاه يبدو لهم طبيعيًا ومعقولًا، ولأن للجماعة الحاكمة «هيبة» وثقة نابعة من موقعها ودورها.</p>
<p>ثم يأتي الوجه الآخر: جهاز الإكراه في الدولة، الذي يفرض الانضباط «قانونيًا» على من لا يوافقون، والذي يُعَدّ للمجتمع كله تحسبًا للحظات الأزمة حين يفشل الرضا العفوي.</p>
<p>ومن هنا التعريف الشهير: <strong>الدولة = المجتمع السياسي + المجتمع المدني، أي هيمنة مدرّعة بالإكراه.</strong> المجتمع السياسي هو الحكومة والجيش والمحاكم والشرطة. والمجتمع المدني هو المؤسسات التي تبدو «خاصة»: المدارس، والمؤسسات الدينية، والصحف، والنقابات، والأحزاب، والجمعيات. ويسمي غرامشي هذا الكل «الدولة الموسعة» أو «الدولة الكاملة».</p>`,
field:`الفرق بين «السيطرة» و«القيادة» بتشوفه في أي فريق: مدير بيمشي الشغل بالجزاءات بس ده «مسيطر»، والناس بتشتغل وهي بتعد الساعات. ومدير تاني الفريق بيدافع عن قراراته قدام الأقسام التانية من غير ما يطلب منهم، ده «قائد». والتاني أقوى بكتير، مش لأنه أطيب، لأن الناس بقت هي اللي بتحرس قراراته.`,
key:'السيطرة إكراه على الخصوم، والهيمنة قيادة فكرية وأخلاقية تصنع رضا عفويًا. والدولة الكاملة: هيمنة مدرعة بالإكراه.'},

{h:'ثمن الهيمنة: التنازل غير الجوهري',
body:`<p>هنا فكرة يغفلها من يظن أن الهيمنة مجرد دعاية. يقول غرامشي إن الهيمنة تفترض أن تُراعى مصالح الجماعات التي تُمارس عليها، وأن يتكون نوع من «توازن التسوية». أي أن الجماعة القائدة يجب أن تقدم <strong>تضحيات ذات طابع اقتصادي-فئوي</strong>. ثم يضيف الشرط الحاسم: لكن هذه التضحيات <em>لا يمكن أن تمس الجوهر</em>.</p>
<p>هذه قاعدة تحليل من الطراز الأول. الهيمنة لا تعمل بالكلام وحده؛ هي تدفع. تمنح زيادة، أو تسمح بنقابة، أو تقبل إصلاحًا. لكنها تختار <strong>ما تدفعه</strong> بعناية: أشياء تحسّن حياة المحكومين دون أن تغيّر من يقرر.</p>
<p>ويضيف غرامشي فكرة أخرى عن الجماعة التي تصبح مهيمنة: هي التي تتجاوز «اللحظة الاقتصادية-الفئوية»، أي الدفاع عن مصالحها الضيقة، وتقدم مصالحها كأنها مصالح الجميع. الجماعة التي تقول «أريد أرباحًا أعلى» ليست مهيمنة. الجماعة التي تقول «نريد نموًا يفيد الوطن كله» وتجعل الناس يرون مصلحتها في هذه الصورة، هي المهيمنة.</p>`,
field:`لما الإدارة تديك حاجة، اسأل سؤال واحد: «الحاجة دي بتغير مين بيقرر، ولا بتحسن شروط اللي بيتقرر عليه؟». الوجبة المجانية والرحلة السنوية تحسين شروط. إنك يبقى ليك صوت في نظام التقييم، ده تغيير في القرار. الهيمنة الذكية بتدي من النوع الأول بسخاء، ومن النوع التاني بالقطارة أو مابتديش خالص.`,
key:'الهيمنة تدفع ثمنًا حقيقيًا من نوع اقتصادي، لكنها لا تمس الجوهر. والسؤال الكاشف: هل التنازل يغير من يقرر، أم يحسن شروط من يُقرَّر عليه؟'},

{h:'حرب المناورة وحرب المواقع',
body:`<p>من صورة الخنادق يستخرج غرامشي استراتيجيتين:</p>
<ul>
<li><strong>حرب المناورة</strong> (أو الحركة): هجوم مباشر وسريع على قلب السلطة، الاستيلاء على الحكومة. هذه نجحت في روسيا ١٩١٧ لأن الدولة كانت كل شيء، فسقوطها كان سقوط النظام.</li>
<li><strong>حرب المواقع</strong>: صراع طويل وبطيء على المجتمع المدني نفسه، موقعًا بعد موقع: المدارس، والصحف، والجمعيات، واللغة، والذوق، والبديهيات. وهي في رأيه الحرب الوحيدة الممكنة في الغرب.</li>
</ul>
<p>والدرس العملي هنا يتجاوز الثورات. أي طرف يريد أن يغيّر نظامًا راسخًا عليه أن يسأل: <em>هل مركز الثقل في القرار نفسه، أم في الحصون التي تحرس القرار؟</em> إن كان في القرار، فالهجوم المباشر قد ينجح. وإن كان في الحصون، فالهجوم المباشر سينتهي مثل هجمات الحرب العالمية الأولى: خسائر هائلة واختراق للخط الأول فقط.</p>
<p>وانتبه للوجه الآخر: الجماعة الحاكمة أيضًا تخوض حرب مواقع، لكن دفاعية. هي تحرس مواقعها في الثقافة قبل أن يقترب أحد من مواقعها في السلطة. ومن يراقبها يجد أنها تهتم بمن يكتب المناهج ومن يملك القنوات ومن يقدم البرامج بقدر ما تهتم بمن يقود الجيش.</p>`,
field:`لو انت عايز تغير قاعدة ظالمة في الشغل، والقاعدة دي مدعومة بثقافة كاملة («إحنا كده من زمان»)، الخناقة المباشرة مع المدير هتبقى «حرب مناورة» في مكان محتاج «حرب مواقع». الأذكى إنك تكسب مواقع صغيرة الأول: زميل مقتنع، رقم بيثبت، اقتراح صغير بيتنجح، لغة جديدة للموضوع. ولما الخط الأول يقع، الحصون اللي وراه تكون اتاخدت.`,
key:'حرب المناورة تضرب القرار مباشرة، وحرب المواقع تأخذ الحصون الثقافية موقعًا بعد موقع. اسأل أين مركز الثقل قبل أن تختار.'},

{h:'الثورة السلبية والتحويل: كيف تُهزم المعارضة دون معركة',
body:`<p>لاحظ غرامشي في تاريخ إيطاليا آليتين تستعملهما الجماعة الحاكمة حين تواجه ضغطًا لا تستطيع تجاهله:</p>
<p><strong>الثورة السلبية:</strong> حين تأخذ الجماعة الحاكمة بعض مطالب المعارضين وتنفذها <em>من فوق</em>، بطريقتها وبإيقاعها، فتنزع من الحركة الشعبية سبب وجودها. التغيير يحدث، لكن بلا مشاركة من تحت، فيبقى ميزان القوة كما هو. وقد رأى غرامشي توحيد إيطاليا في القرن التاسع عشر مثالًا عليها: أمة جديدة صُنعت من فوق، دون أن تتحرك الجماهير الفلاحية.</p>
<p><strong>التحويل</strong> (trasformismo): اسم من السياسة الإيطالية في ثمانينيات القرن التاسع عشر، حين كانت الحكومات تستوعب نواب المعارضة واحدًا واحدًا في الأغلبية الحاكمة. ويوسّعه غرامشي إلى آلية عامة: <strong>امتصاص قادة الجماعات المعارضة وعناصرها النشطة</strong> في الجماعة الحاكمة، فتُقطع رؤوس الحركة دون قتال. القائد الذي كان يتكلم باسم الغاضبين يصبح موظفًا يشرح للغاضبين لماذا لا يمكن تلبية مطالبهم.</p>
<p>هاتان الآليتان أخطر على أي حركة معارضة من القمع. القمع يصنع شهداء ويوحّد الصفوف. أما الثورة السلبية فتسحب البساط من تحت القضية، والتحويل يسحب القادة من فوقها.</p>`,
field:`في الشغل بتشوف «التحويل» كل يوم: أعلى صوت في الفريق بيعترض، فجأة بيتعرض عليه يبقى «تيم ليدر» أو «منسق». وبعد شهرين بتلاقيه هو اللي بيقول للفريق «يا جماعة الإدارة عندها ظروف». مش لازم يكون باع، ممكن يكون اقتنع فعلًا لما شاف الصورة من فوق. بس النتيجة واحدة: الفريق خسر صوته من غير ما حد يتعاقب.`,
key:'الثورة السلبية: تنفيذ بعض المطالب من فوق لنزع سبب الحركة. والتحويل: ابتلاع قادتها. وكلاهما أخطر من القمع لأنه لا يصنع شهداء.'},

{h:'أزمة السلطة: حين تبقى القوة ويذهب الرضا',
body:`<p>ماذا يحدث حين تفشل الهيمنة؟ يصف غرامشي لحظة يسميها <strong>«أزمة السلطة»</strong>: الجماعة الحاكمة فقدت الرضا، فلم تعد «قائدة» بل صارت «مسيطرة» فقط، تمارس القوة القاهرة وحدها. وهذا يعني أن الجماهير انفصلت عن الأيديولوجيات التقليدية، ولم تعد تؤمن بما كانت تؤمن به.</p>
<p>ثم يكتب جملته الأشهر، التي يقتبسها الناس اليوم في كل أزمة: <em>الأزمة تكمن تحديدًا في أن القديم يموت والجديد لا يستطيع أن يولد؛ وفي هذا الفاصل تظهر أعراض مرضية كثيرة ومتنوعة.</em></p>
<p>هذه أداة تشخيص دقيقة. علامة أزمة السلطة ليست ضعف الجماعة الحاكمة، فقد تكون أقوى من أي وقت عسكريًا. العلامة هي <strong>ازدياد اعتمادها على الإكراه</strong>. حين تجد سلطة كانت تحكم بالإقناع والهيبة تنتقل إلى التهديد والعقاب في مسائل كانت تُحل بالكلام، فهي تخبرك، رغمًا عنها، أن حصونها في المجتمع المدني تتساقط.</p>
<p>وهذا هو قانون السلّم من الملف صفر، بلغة غرامشي: النزول من الدرجة الثالثة إلى الأولى علامة على خسارة الحرب على المعنى.</p>`,
field:`لما تلاقي مدير كان الفريق بيحبه، فجأة بقى بيبعت إيميلات تحذير ويحسب الدقايق، اعرف إن فيه «أزمة سلطة». هو ماقويش، هو خسر الرضا وبيعوض بالسيف. والمرحلة دي بتبقى خطيرة عليه وعلى الفريق، لأن «الأعراض المرضية» بتظهر: شلل، نميمة، تحالفات جانبية، استقالات مفاجئة.`,
key:'أزمة السلطة: بقاء القوة وذهاب الرضا. وعلامتها ازدياد الاعتماد على الإكراه. «القديم يموت والجديد لا يستطيع أن يولد».'},

{h:'خريطة الضابط: خمسة أسئلة غرامشية',
body:`<p>اجمع الملف في خمسة أسئلة تطبقها على أي مؤسسة أو مجتمع:</p>
<ol>
<li><strong>أين الخندق وأين الحصون؟</strong> ما الذي يبدو مركز السلطة، وما المؤسسات التي تحرسه من الخلف؟</li>
<li><strong>سيطرة أم قيادة؟</strong> على من تُمارس القوة، وعلى من يُمارس الإقناع؟ ومن يدافع عن النظام دون أن يُطلب منه؟</li>
<li><strong>ما الثمن المدفوع؟</strong> ما التنازلات الاقتصادية التي تقدمها الجماعة القائدة، وهل تمس الجوهر أم لا؟</li>
<li><strong>من ابتُلع؟</strong> هل هناك قادة معارضة صاروا جزءًا من الجماعة الحاكمة؟ وهل هناك مطالب نُفذت من فوق فنزعت سبب الحركة؟</li>
<li><strong>هل هناك أزمة سلطة؟</strong> هل تزداد نسبة الإكراه إلى الإقناع؟</li>
</ol>
<p>والملف القادم يدخل إلى قلب الحصون: كيف تُصنع «البديهة» نفسها، ومن هم الجنود الذين يصنعونها.</p>`,
key:'الخندق والحصون، والسيطرة والقيادة، والثمن، والمبتلَعون، ونسبة الإكراه إلى الإقناع.'}
],
quotes:[

 {t:'الدولة = المجتمع السياسي + المجتمع المدني، أي هيمنة مدرّعة بالإكراه.', src:'غرامشي، دفاتر السجن', why:'الرضا في الواجهة، والسيف في الخلف.'},

worked:{
 title:'حالة محلولة: المدير التنفيذي الجديد',
 case:`شركة متوسطة الحجم فيها غضب واسع بعد سنة من الخصومات. يأتي مدير تنفيذي جديد ويتخذ في ستة أشهر هذه الخطوات:<br><b>١)</b> يلغي الخصومات على التأخير البسيط، ويرفع بدل المواصلات قليلًا.<br><b>٢)</b> يعيّن أشهر المعترضين، وهو موظف قديم محترم، «مديرًا لتجربة الموظفين».<br><b>٣)</b> يطلق برنامج تدريب إلزاميًا اسمه «عقلية المالك»: «فكّر في الشركة كأنها شركتك».<br><b>٤)</b> يبدأ نشرة داخلية فيها قصص «أبطال الشركة» الذين عملوا ساعات إضافية في الأزمة.<br><b>٥)</b> يحتفظ بنظام التقييم القديم الذي يقرر المكافآت والفصل، دون تعديل.`,
 steps:[
  {h:'الخندق والحصون', body:'الخندق الأمامي هو الإدارة العليا وقراراتها. والحصون التي يبنيها المدير الجديد: برنامج التدريب، والنشرة، ومنصب «تجربة الموظفين». هو لا يدافع عن قراراته؛ هو يبني مؤسسات تدافع عنها نيابة عنه.'},
  {h:'من السيطرة إلى القيادة', body:'المدير السابق كان «مسيطرًا»: خصومات وعقاب. الجديد ينقل الشركة إلى «القيادة الفكرية والأخلاقية»: يريد رضا عفويًا، أن يدافع الموظفون عن الشركة كأنها شركتهم.'},
  {h:'الثمن غير الجوهري', body:'إلغاء الخصومات ورفع البدل تضحيات اقتصادية حقيقية. لكن الخطوة الخامسة تكشف الحد: <em>نظام التقييم الذي يقرر المكافآت والفصل لم يُمس</em>. هذا هو الجوهر. تحسنت شروط من يُقرَّر عليهم، ولم يتغير من يقرر.'},
  {h:'التحويل', body:'الخطوة الثانية تحويل بالحرف: قائد المعارضة صار جزءًا من الإدارة. لم يُهزم، بل استُوعب. وصوته الذي كان يتكلم باسم الغاضبين سيصير صوتًا يشرح لهم الإدارة.'},
  {h:'المعركة على الحكاية', body:'برنامج «عقلية المالك» ونشرة «الأبطال» حرب مواقع على المعنى. «المالك» لا يطالب بأجر إضافي على ساعات إضافية، و«البطل» هو من يعمل بلا حساب. الموظف الذي يطالب بحقه سيبدو بعد قليل كأنه لا يملك «عقلية المالك».'},
  {h:'التشخيص النهائي', body:'هذه ليست مؤامرة بالضرورة. قد يكون المدير مقتنعًا بكل خطوة. لكن البنية هيمنة كلاسيكية: تنازل غير جوهري، وابتلاع للقيادة، وحصون ثقافية، والسيف (نظام التقييم) باقٍ في الخلف.'}
 ],
 verdict:'لاحظ أن المدير لم يكذب ولم يقمع. حوّل شركة تُحكم بالسيف إلى شركة تُحكم بالرضا، ولم يتنازل عن شيء من الجوهر. هذا ما يجعل الهيمنة أصعب في المقاومة من الطغيان.'
},
yourturn:{
 title:'دورك: مملكة سَرَنْد (بلد متخيل)',
 case:`بعد موجة احتجاجات كبيرة في مملكة سَرَنْد المتخيلة، اتخذت الحكومة هذه الخطوات خلال عام:<br><b>١)</b> رفعت أجور موظفي الدولة ١٠٪.<br><b>٢)</b> عيّنت أبرز وجوه الاحتجاج الشبابية وزيرًا للشباب.<br><b>٣)</b> موّلت سلسلة مسلسلات عن «أبطال الوطن» وتضحياتهم.<br><b>٤)</b> أطلقت منهجًا مدرسيًا جديدًا بعنوان «الهوية والانتماء».<br><b>٥)</b> أبقت قانون الطوارئ ساريًا «احتياطيًا».<br><b>٦)</b> نفذت من فوق إصلاحًا انتخابيًا محدودًا كان من مطالب المحتجين، بصيغة صاغتها الحكومة وحدها.`,
 prompt:'حلل الخطوات الست بأدوات غرامشي: صنّف كل خطوة، وحدد الجوهر الذي لم يُمس، وتوقع ماذا سيحدث للحركة الاحتجاجية.',
 points:[
  'صنّفت رفع الأجور كتنازل اقتصادي-فئوي حقيقي لكنه غير جوهري',
  'صنّفت تعيين الوجه الشبابي كـ«تحويل»: ابتلاع قيادة الحركة',
  'صنّفت المسلسلات والمنهج كحرب مواقع على حصون المجتمع المدني (الإعلام والتعليم)',
  'صنّفت قانون الطوارئ كدرع الإكراه الباقي في الخلف («هيمنة مدرعة بالإكراه»)',
  'صنّفت الإصلاح الانتخابي من فوق كـ«ثورة سلبية» تنزع سبب الحركة دون مشاركتها',
  'حددت الجوهر الذي لم يُمس (من يملك القرار النهائي وأدوات الإكراه)، وتوقعت تفكك الحركة أو فقدانها لقضيتها لا قمعها'
 ],
 model:`<p><b>١) رفع الأجور:</b> تضحية اقتصادية حقيقية، تحسّن حياة فئة واسعة دون أن تغيّر من يقرر.</p>
<p><b>٢) الوزير الشاب:</b> تحويل كلاسيكي. الحركة فقدت وجهها الأبرز، وصار هذا الوجه يشرح سياسات الحكومة لمن كانوا يهتفون معه.</p>
<p><b>٣ و٤) المسلسلات والمنهج:</b> حرب مواقع دفاعية على الحصون: الإعلام والمدرسة. الهدف ليس إقناع المحتجين الحاليين، بل الجيل القادم.</p>
<p><b>٥) قانون الطوارئ:</b> الدرع. الرضا في الواجهة، والسيف جاهز «احتياطيًا» إن فشل الرضا.</p>
<p><b>٦) الإصلاح من فوق:</b> ثورة سلبية. المطلب نُفذ، لكن بصيغة الحكومة وإيقاعها، فلم يكسب المحتجون منه موقعًا بل خسروا قضية.</p>
<p><b>الجوهر الذي لم يُمس:</b> من يملك القرار النهائي، ومن يملك أدوات الإكراه.</p>
<p><b>التوقع:</b> الحركة على الأرجح لن تُقمع بل ستتآكل: قضيتها أُخذت، ووجهها أُخذ، وحكايتها تُنافَس على الشاشات والمدارس. ولن تعود إلا إذا ظهرت «أزمة سلطة»، أي إذا اضطرت الحكومة إلى استعمال قانون الطوارئ على نطاق واسع.</p>`
},

{h:'كل الناس فلاسفة',
body:`<p>يبدأ غرامشي من جملة تبدو غريبة: <strong>كل الناس فلاسفة</strong>. لا يقصد أن الجميع يقرؤون أفلاطون، بل أن كل إنسان يحمل «فلسفة» ضمنية: تصورًا عن العالم كامنًا في لغته، وفي حسه المشترك، وفي دينه الشعبي، وفي معتقداته وأمثاله وطرق رؤيته للأشياء.</p>
<p>ويلاحظ أن <em>كل لغة تحتوي عناصر من تصور للعالم</em>. فحين يتعلم الطفل لغته، لا يتعلم كلمات فقط، بل يتعلم معها طريقة لتقسيم العالم: ما هو محترم وما هو معيب، وما هو «رجولة» وما هو «عيب»، وما هو «شغل» وما هو «لعب».</p>
<p>والسؤال الذي يطرحه غرامشي ليس «هل لديك فلسفة؟» بل: <strong>هل فلسفتك من صنعك، أم أنك تشارك في تصور للعالم فرضته عليك بيئتك دون نقد؟</strong> أي هل تفكر بطريقة واعية ونقدية، أم أنك «تُفكَّر» بأفكار غيرك؟</p>`,
field:`جرب كده: اكتب عشر أمثال شعبية بتستعملها من غير تفكير. هتلاقيهم بيرسموا «فلسفة» كاملة: مين يستاهل الاحترام، إمتى تسكت، إمتى تتكلم، الفلوس بتيجي منين. انت ماخترتش الفلسفة دي، اتولدت فيها. وده مش عيب، ده نقطة البداية. العيب إنك تعيش طول عمرك من غير ما تفتش فيها.`,
key:'كل إنسان يحمل فلسفة ضمنية في لغته وأمثاله وحسه المشترك. والسؤال: هل هي من صنعه أم مفروضة عليه دون نقد؟'},

{h:'الحس المشترك: فلكلور الفلسفة',
body:`<p>«الحس المشترك» عند غرامشي ليس مدحًا. هو يصفه بأنه <strong>«فلكلور الفلسفة»</strong>: مزيج مجزأ وغير متماسك من تصورات متفرقة، فيه بقايا كل الفلسفات والأديان والعلوم القديمة التي مرت على المجتمع، مترسبة فوق بعضها كطبقات الأرض.</p>
<p>ولهذا هو <em>متناقض</em>. ستجد في الحس المشترك نفسه مثلًا يقول «اللي يخاف من العفريت يطلعله»، ومثلًا آخر يقول «امشي جنب الحيط». واحد يدعو إلى المواجهة، والآخر إلى التواري. والناس يستعملون هذا أو ذاك بحسب الموقف، دون أن يلاحظوا التناقض.</p>
<p>لكن غرامشي لا يحتقر الحس المشترك. هو يرى داخله نواة صحية يسميها <strong>«الحس السليم»</strong>: الخبرة العملية المتراكمة، والقدرة على رؤية الأشياء كما هي في الحياة اليومية. المعركة عنده ليست ضد الحس المشترك، بل لتنقيته: تقوية الحس السليم الذي فيه، وكشف ما ترسب فيه من أفكار تخدم غير أصحابها.</p>
<p>ولماذا يهم الحس المشترك سياسيًا؟ لأنه <strong>المخزن الذي يأخذ منه الإنثيميم مقدماته المحذوفة</strong>. من يملأ الحس المشترك بمقدمة ما، يستطيع بعدها أن يبني عليها ألف حجة لا يحتاج فيها إلى قولها.</p>`,
field:`لاحظ إن الحس المشترك فيه حاجات صح جدًا: «اللي ميعرفش يقول عدس»، يعني متحكمش من غير معرفة. ده «حس سليم». وفيه حاجات تانية ممكن تكون مزروعة لمصلحة حد: «اللي يبص لفوق يتعب»، يعني اقنع بمكانك. المهارة مش إنك ترمي الأمثال كلها، المهارة إنك تفرز.`,
key:'الحس المشترك مخزون متناقض من ترسبات قديمة، فيه نواة «حس سليم». وهو المخزن الذي يأخذ منه الإنثيميم مقدماته.'},

{h:'الوعي المتناقض: ما تفعله وما تقوله',
body:`<p>من أدق ملاحظات غرامشي فكرة <strong>«الوعي المتناقض»</strong>. يقول إن الإنسان العامل يحمل في الحقيقة وعيين نظريين:</p>
<ul>
<li>وعي <strong>ضمني في نشاطه العملي</strong>، يجمعه فعليًا بزملائه في تغيير العالم الواقعي.</li>
<li>ووعي <strong>ظاهر في كلامه</strong>، موروث من الماضي، تلقاه دون نقد.</li>
</ul>
<p>مثال يوضح الفكرة: موظف يتعاون مع زملائه فعليًا كل يوم ليسد عجز القسم، ويغطي عن زميل مريض، ويرفض ظلمًا وقع على آخر. هذا وعي عملي بالتضامن. لكن إن سألته عن رأيه قال: «كل واحد يشوف مصلحته، ومحدش بيفرق مع حد». الكلام يكرر حسًا مشتركًا تعلمه، والفعل يكشف حقيقة مختلفة.</p>
<p>ويقول غرامشي إن هذا الوعي اللفظي الموروث ليس بلا أثر: فهو قد يصل إلى حد يجعل الوعي المتناقض <em>عاجزًا عن أي فعل أو قرار أو اختيار</em>، ويُنتج حالة من الشلل الأخلاقي والسياسي. أي أن الناس قد يملكون في أفعالهم ما يكفي لتغيير أوضاعهم، لكن كلامهم الموروث يمنعهم من رؤيته.</p>`,
field:`ده من أنفع الحاجات في قراية الناس: متصدقش كلام الناس عن نفسهم بس، شوف بيعملوا إيه. الفريق اللي بيقول «كل واحد لنفسه» وهو بيغطي على بعض كل يوم، عنده تضامن حقيقي محتاج بس كلمة تسميه. واللي بيتكلم عن «الروح الواحدة» وبيطعن في زمايله في الاجتماعات، عنده العكس.`,
key:'الوعي المتناقض: وعي عملي في الفعل، ووعي موروث في الكلام. والموروث قد يشل الفعل. اقرأ الأفعال قبل الأقوال.'},

{h:'المثقفون: الجنود الذين يصنعون البديهة',
body:`<p>إذا كان الحس المشترك يُصنع، فمن يصنعه؟ هنا تأتي أشهر أفكار غرامشي: <strong>كل الناس مثقفون، لكن ليس كل الناس يؤدون في المجتمع وظيفة المثقفين.</strong> المثقف عنده ليس من يقرأ كثيرًا، بل من يؤدي <em>وظيفة تنظيمية</em> في المجتمع: ينشر الأفكار، وينظمها، ويعطيها شكلًا، ويحرسها.</p>
<p>ويميز بين نوعين:</p>
<ul>
<li><strong>المثقف العضوي</strong>: كل جماعة اجتماعية جديدة تخلق معها، بشكل عضوي، فئة أو أكثر من المثقفين يمنحونها التجانس والوعي بوظيفتها. ومثاله: الرأسمالي الصناعي يخلق معه الفني الصناعي، والاقتصادي السياسي، ومنظمي الثقافة الجديدة والقانون الجديد. هؤلاء ليسوا «مأجورين» بالضرورة؛ هم ببساطة يفكرون من داخل منطق جماعتهم ويحولونه إلى لغة عامة.</li>
<li><strong>المثقف التقليدي</strong>: فئات موجودة من قبل، كرجال الدين التقليديين والأدباء والأكاديميين القدامى، تقدم نفسها كأنها مستقلة عن أي جماعة، فوق الصراع، تمثل «استمرارية تاريخية». ويرى غرامشي أن استقلالها هذا كثيرًا ما يكون وهمًا، وأن الجماعة الصاعدة تحاول دائمًا كسبها أو استيعابها.</li>
</ul>
<p>وهنا أداة عملية: <strong>في أي مؤسسة، من هم المثقفون العضويون؟</strong> في الشركة: إدارة الموارد البشرية، ومدربو «الثقافة المؤسسية»، وكتّاب النشرة الداخلية، ومستشارو الإدارة. هؤلاء من يحوّل مصلحة الإدارة إلى «قيم» و«مبادئ» و«أفضل ممارسات».</p>`,
field:`المدرب اللي بيعمل ورشة «إدارة الضغط» للموظفين بعد ما الإدارة زودت الأعباء، هو مثقف عضوي بالمعنى ده. مش بالضرورة شرير، ممكن يكون مقتنع ومفيد فعلًا. بس لاحظ: المشكلة اتنقلت من «الأعباء زادت» لـ«انت محتاج تتعلم تدير ضغطك». المثقف العضوي بيعيد صياغة المشكلة بحيث حلها يبقى عندك انت، مش عند اللي صنعها.`,
key:'المثقف وظيفة تنظيمية لا لقب. العضوي يحوّل منطق جماعته إلى لغة عامة، والتقليدي يدّعي الاستقلال. اسأل: من مثقفو هذه المؤسسة؟'},

{h:'الكتلة التاريخية: الصمغ الذي يجمع',
body:`<p>كيف تتماسك هيمنة جماعة ما؟ يستعمل غرامشي مفهوم <strong>«الكتلة التاريخية»</strong>: وحدة بين البنية الاقتصادية من جهة، والأفكار والمؤسسات الثقافية من جهة أخرى، وتحالف بين جماعات اجتماعية مختلفة تجمعها رؤية مشتركة للعالم.</p>
<p>الكتلة التاريخية ليست طبقة واحدة. هي تحالف بين جماعات قد تكون مصالحها مختلفة، يجمعها «صمغ» أيديولوجي يجعل كل جماعة ترى في استمرار الترتيب القائم شيئًا يخصها. والأيديولوجيا هنا ليست «كذبة»، بل هي كما يقول غرامشي «الإسمنت» الذي يجمع الكتلة.</p>
<p>ولاحظ غرامشي مثالًا أعجبه تحليلًا: المؤسسة الكنسية الكاثوليكية. رأى أنها نجحت قرونًا في شيء صعب جدًا: أن تبقي «البسطاء» و«المثقفين» داخل عقيدة واحدة، فلا ينفصل اللاهوتيون عن عامة المؤمنين. وكانت تفعل ذلك بالانضباط والتنظيم، فتمنع المثقفين من الابتعاد كثيرًا، وتمنع البسطاء من الانفصال. وأي حركة تريد هيمنة دائمة عليها أن تحل المشكلة نفسها: ألا ينفصل قادتها الفكريون عن جمهورها.</p>`,
field:`لما تحلل أي «تحالف» قوي، في شركة أو بلد، اسأل: إيه الصمغ؟ مش «مين بيستفيد»، لأن كل واحد بيستفيد حاجة مختلفة. السؤال: إيه الفكرة اللي مخلية كل الأطراف دي شايفة إن بقاء الوضع ده «بتاعها»؟ لو عرفت الصمغ، عرفت فين التحالف ممكن ينفك.`,
key:'الكتلة التاريخية تحالف جماعات مختلفة يجمعه صمغ أيديولوجي. اسأل عن الصمغ لتعرف أين يمكن أن ينفك التحالف.'},

{h:'ملحق: بورديو والدوكسا',
body:`<p>بعد غرامشي بأربعة عقود، أعطى عالم الاجتماع الفرنسي <strong>بيير بورديو</strong> (١٩٣٠–٢٠٠٢) لأعمق طبقة في الحس المشترك اسمًا دقيقًا: <strong>الدوكسا</strong>.</p>
<p>يقسم بورديو عالم الأفكار في أي مجتمع إلى منطقتين:</p>
<ul>
<li><strong>ميدان الرأي</strong>: ما يُعترف بأنه قابل للنقاش. وفيه «الأرثوذكسية»، أي الرأي السائد الذي يدافع عن نفسه، و«الهرطقة»، أي الرأي المخالف الذي يتحداه.</li>
<li><strong>الدوكسا</strong>: ما لا يُناقش أصلًا، لأنه لا يخطر لأحد أن يناقشه. ليس رأيًا منتصرًا، بل شيء لم يُطرح أبدًا كرأي.</li>
</ul>
<p>والعبارة التي يعرّف بها الدوكسا تختصر كل شيء: <em>ما يمر دون أن يُقال، لأنه جاء دون أن يُقال.</em> أي أنك لم تتعلمه في درس، بل امتصصته من طريقة ترتيب البيت والشارع والمدرسة والجسد نفسه.</p>
<p>ولاحظ الفرق بين الأرثوذكسية والدوكسا: الأرثوذكسية <em>تعرف</em> أنها رأي ولذلك تدافع عن نفسها. أما الدوكسا فلا تحتاج دفاعًا، لأن لا أحد يهاجمها. ولهذا فإن أول هجوم على الدوكسا يفعل شيئًا غريبًا: <strong>يحولها إلى أرثوذكسية</strong>. بمجرد أن يسأل أحد «لماذا هذا طبيعي؟»، يصير الطبيعي رأيًا يحتاج إلى دفاع.</p>`,
field:`ده أهم سلاح في الملف: ساعات أكبر انتصار مش إنك تكسب النقاش، إنك <b>تفتح النقاش أصلًا</b>. لما حاجة كانت «طبيعي» تبقى «فيه ناس شايفة كده وفيه ناس شايفة غير كده»، انت حولت الدوكسا لميدان رأي. ومن هنا الطرف التاني لازم يدافع، والدفاع بيكلف.`,
key:'الدوكسا: ما يمر دون أن يُقال لأنه جاء دون أن يُقال. وأول سؤال عنها يحولها من بديهة إلى رأي يحتاج دفاعًا.'},

{h:'العنف الرمزي: حين يتعاون المحكوم مع حاكمه',
body:`<p>ومن الدوكسا يشتق بورديو مفهومًا ثانيًا: <strong>العنف الرمزي</strong>. وهو، بتعريفه، عنف يُمارس على الفاعل الاجتماعي <em>بتواطؤ منه</em>.</p>
<p>كيف يكون العنف بتواطؤ؟ لأن المحكوم يرى العالم بنفس المقولات التي صنعها الحاكم. فيرى التفاوت بين الناس كأنه طبيعي، ويرى نفسه «غير مؤهل» لأشياء معينة، ويختار من تلقاء نفسه ألا يطلب ما «ليس لأمثاله». ويسمي بورديو هذا «سوء التعرف»: الناس لا يتعرفون على العنف كعنف، بل يرونه كترتيب طبيعي أو كعدل.</p>
<p>مثال من بورديو نفسه: الطالب القادم من بيئة فقيرة الذي يقول «أنا مش بتاع الحاجات دي» عن الفلسفة أو الموسيقى الكلاسيكية. لم يمنعه أحد. لكنه تعلم، من آلاف الإشارات الصغيرة، أن هذه «ليست له». وهذا الاستبعاد الذاتي أنجح من أي منع رسمي.</p>
<p>ويستعمل بورديو أيضًا مفهوم <strong>«الهابيتوس»</strong>: الاستعدادات الدائمة التي يكتسبها الإنسان من بيئته، والتي تجعله يتصرف ويشعر ويحكم بطريقة «تلقائية». الهابيتوس هو المكان الذي تسكن فيه الدوكسا داخل الجسد: في طريقة الكلام والجلوس والذوق وما يبدو لك «لائقًا».</p>`,
field:`العنف الرمزي بتشوفه لما موظف شاطر ميقدمش على وظيفة أعلى عشان «دي مش لأمثالي». محدش رفضه، هو رفض نفسه نيابة عنهم. وأخطر حاجة فيه إنه بيحس إن ده «تواضع» أو «واقعية». السؤال اللي بيكسره: «مين اللي قالك إنها مش ليك؟ وإمتى؟»`,
key:'العنف الرمزي يُمارس بتواطؤ المحكوم لأنه يرى العالم بمقولات الحاكم. وأنجح صوره الاستبعاد الذاتي: «دي مش لأمثالي».'},

{h:'أداة الضابط: نزع الطبيعية',
body:`<p>يجمع الملف كله في أداة واحدة تسميها <strong>«نزع الطبيعية»</strong>: أن تأخذ أي شيء يُقدَّم كأنه طبيعي، وتكشف أن له تاريخًا، أي أنه صُنع، وبالتالي يمكن أن يُصنع غيره.</p>
<p>والأداة أربع خطوات:</p>
<ol>
<li><strong>التقط الكلمة المنوِّمة:</strong> «طبيعي»، «معروف»، «من زمان»، «كده الدنيا ماشية»، «مفيش حد بيعمل كده». هذه الكلمات علامات على دوكسا قريبة.</li>
<li><strong>اسأل عن تاريخ الميلاد:</strong> منذ متى هذا «طبيعي»؟ هل كان كذلك دائمًا وفي كل مكان؟ غالبًا ستجد أن «الطبيعي» عمره قصير، أو أنه مختلف في مجتمع مجاور.</li>
<li><strong>اسأل عن المثقف العضوي:</strong> من الذي ينشر هذه البديهة اليوم؟ في أي مؤسسة؟ ولمصلحة أي جماعة؟</li>
<li><strong>ابحث عن الحس السليم المعاكس:</strong> في الحس المشترك نفسه، ما المثل أو الخبرة التي تقول العكس؟ استعملها، لأن الناس يثقون في حسهم أكثر من أي نظرية.</li>
</ol>
<p>والملف القادم ينقلك إلى فوكو، الذي سيأخذ هذه الفكرة إلى مستوى أعمق: ليس فقط «ما يبدو طبيعيًا»، بل <strong>ما يمكن أن يُقال أصلًا</strong>، ومن يملك حق قوله.</p>`,
key:'نزع الطبيعية: التقط الكلمة المنوّمة، واسأل عن تاريخ ميلادها، وعن مثقفها العضوي، وعن الحس السليم المعاكس لها.'}
],

worked:{
 title:'حالة محلولة: الأمثال الأربعة',
 case:`أربعة أمثال شعبية متداولة:<br><b>(١)</b> «امشي جنب الحيط.»<br><b>(٢)</b> «اللي يبص لفوق يتعب.»<br><b>(٣)</b> «اللي يخاف من العفريت يطلعله.»<br><b>(٤)</b> «اللي ميعرفش يقول عدس.»`,
 steps:[
  {h:'الوظيفة: أي تصور للعالم يرسمه كل مثل؟', body:'(١) و(٢) يرسمان عالمًا الأمان فيه في التواري والقناعة: لا تبرز، ولا تطمح. (٣) يرسم العكس: الهروب من الخوف يضخمه. (٤) يرسم حكمة معرفية: لا تحكم دون علم.'},
  {h:'التناقض: الوعي المتناقض في الحس المشترك', body:'(١) و(٣) متناقضان مباشرة. الحس المشترك نفسه يحمل الدعوة إلى التواري والدعوة إلى المواجهة. والناس يختارون بينهما بحسب الموقف، دون أن يلاحظوا. هذا ما يسميه غرامشي «فلكلور الفلسفة».'},
  {h:'الفرز: الحس السليم والترسب', body:'(٤) حس سليم صاف: خبرة معرفية حقيقية. (٣) فيه حس سليم أيضًا: خبرة نفسية بأن الخوف يتغذى على الهروب. أما (١) و(٢) فيحتاجان إلى سؤال نزع الطبيعية.'},
  {h:'نزع الطبيعية: من يخدم المثل؟', body:'«امشي جنب الحيط» خبرة حقيقية في بيئة خطرة: قد تكون حكمة نجاة. لكن حين تتحول إلى قاعدة عامة لكل المواقف، فهي تخدم كل من يستفيد من أن الناس لا يطالبون. و«اللي يبص لفوق يتعب» تجعل الطموح نفسه سببًا للتعب، فتنقل المشكلة من «لماذا الصعود مسدود؟» إلى «لماذا تريد الصعود؟».'},
  {h:'الاستعمال: الحس السليم المعاكس', body:'الضابط لا يحارب الأمثال بالنظريات. يواجه مثلًا بمثل من الحس المشترك نفسه. لمن يقول «امشي جنب الحيط» في موقف ظلم واضح، يكفي أن تقول «واللي يخاف من العفريت يطلعله». أنت لم تفرض فلسفة غريبة؛ أيقظت جزءًا آخر من فلسفته هو.'}
 ],
 verdict:'الحس المشترك ليس عدوًا ولا صديقًا. هو أرض معركة متناقضة. والمهارة أن تفرز الحس السليم من الترسب، وأن تستعمل الحس المشترك ضد نفسه حين يُستعمل ضدك.'
},
yourturn:{
 title:'دورك: بديهيات بيئة العمل',
 case:`جمل تتكرر في بيئة عمل:<br><b>(أ)</b> «الموظف الشاطر بيبان في الساعات الزيادة.»<br><b>(ب)</b> «اللي بيطلب إجازة كتير مش ملتزم.»<br><b>(ج)</b> «إحنا هنا عيلة، مفيش حاجة اسمها حقي وحقك.»<br><b>(د)</b> «دي مش لأمثالنا، الترقيات دي للناس اللي ليها ضهر.»`,
 prompt:'طبق أداة نزع الطبيعية على الجمل الأربع، وحدد أين ترى الدوكسا والعنف الرمزي والمثقف العضوي.',
 points:[
  'التقطت الكلمات المنوّمة أو البنية التي تجعل كل جملة تبدو وصفًا لا رأيًا',
  'سألت عن تاريخ ميلاد جملة واحدة على الأقل (مثلًا: هل كانت الساعات الزيادة دائمًا مقياس الشطارة؟)',
  'حددت المثقف العضوي الذي ينشر هذه البديهيات (الإدارة، الموارد البشرية، الزملاء القدامى…)',
  'عرفت (د) كعنف رمزي: استبعاد ذاتي يقوم به الموظف نيابة عن غيره',
  'لاحظت أن (ج) تستعمل مفهومًا لا يُعادى («العيلة») لإخراج فكرة الحقوق من النقاش',
  'اقترحت حسًا سليمًا معاكسًا أو سؤالًا يحول بديهة واحدة على الأقل إلى رأي يحتاج دفاعًا'
 ],
 model:`<p><b>(أ)</b> تقدم معيارًا خاصًا (الساعات) كأنه تعريف «الشطارة». تاريخ الميلاد: الشطارة يمكن أن تُقاس بالنتائج لا بالساعات، وكثير من البيئات تعتبر البقاء الطويل علامة سوء تنظيم. والمثقف العضوي: من يكافئ «الحضور» بدل الإنجاز.</p>
<p><b>(ب)</b> تحوّل حقًا مكتوبًا في العقد إلى علامة أخلاقية سيئة. هي علامة ظنية تُقدَّم كأنها قاطعة.</p>
<p><b>(ج)</b> «العيلة» مفهوم لا يُعادى، يُستعمل ليجعل الحديث عن الحقوق «قلة أصل». هذه دوكسا: فكرة الحقوق لا تُهزم في النقاش، بل تُخرج من النقاش.</p>
<p><b>(د)</b> عنف رمزي صاف: الموظف يستبعد نفسه قبل أن يستبعده أحد، ويسمي ذلك واقعية.</p>
<p><b>السؤال الكاسر:</b> لـ(أ): «هو الشطارة بالساعات ولا بالنتيجة؟». لـ(ج): «حتى في العيلة كل واحد ليه حق، وإلا ماكانش فيه ميراث». هنا تستعمل حسًا سليمًا من داخل الثقافة نفسها، فتحوّل البديهة إلى رأي.</p>`

body:`<p>ميشيل فوكو (١٩٢٦–١٩٨٤) فيلسوف ومؤرخ فرنسي، لم يكتب تاريخ الأفكار بالمعنى المعتاد، بل تاريخ <strong>شروط إمكانها</strong>. كتب عن تاريخ الجنون، وعن ولادة العيادة الطبية، وعن السجون، وعن الجنسانية. وفي كل مرة كان يسأل السؤال نفسه: كيف صار ممكنًا، في عصر معين، أن يُفكَّر في شيء بطريقة معينة، وأن يُعتبر هذا التفكير «علمًا» أو «حقيقة»؟</p>

<p>ويضيف فوكو ملاحظة تقلب المعتاد: الخطاب ليس فقط ما يُترجم الصراعات أو أنظمة السيطرة، بل هو <strong>ما يُتصارع عليه، وبه</strong>. أي أن الخطاب نفسه هو السلطة التي يسعى الناس إلى امتلاكها.</p>`,
field:`فكر فيها كده: ليه في أي شركة فيه قنوات رسمية للشكوى؟ مش بس عشان تسمع الشكاوى. القنوات دي بتحدد <b>شكل</b> الشكوى، وتوقيتها، ومين يقراها، وبأي لغة تتكتب. يعني بتروّض الكلام الخطير. الشكوى اللي بتعدي من «الاستمارة» بتطلع مختلفة عن الشكوى اللي بتتقال في وش المدير قدام الكل.`,
key:'في كل مجتمع، الخطاب مراقب ومنتقى ومنظم لدرء خطره. والخطاب ليس وسيلة الصراع فقط، بل هو ما يُتصارع عليه.'},

{h:'إجراءات الإقصاء الخارجية الثلاثة',
body:`<p>يحدد فوكو ثلاثة إجراءات «خارجية» تعمل على الخطاب من الخارج:</p>
<p><strong>١. المحظور.</strong> نحن نعرف أنه ليس لنا الحق في قول كل شيء، وأننا لا نستطيع الكلام عن كل شيء في كل ظرف، وأن ليس لكل أحد أن يتكلم عن أي شيء. ويرى فوكو هنا ثلاثة أنواع من المحظور تتقاطع: <em>محظور الموضوع</em> (أشياء لا يُتكلم عنها)، و<em>طقس الظرف</em> (أشياء تُقال هنا ولا تُقال هناك)، و<em>الحق المميز للمتكلم</em> (أشياء يقولها بعض الناس فقط).</p>
<p><strong>٢. القسمة والنبذ.</strong> ومثاله الأكبر القسمة بين العقل والجنون. يلاحظ فوكو أن كلام «المجنون» كان عبر التاريخ إما لا يُسمع أصلًا، يُعامل كضجيج لا يُعتد به في محكمة ولا عقد، وإما يُعطى قيمة غريبة كأنه نبوءة تكشف حقيقة مخفية. في الحالتين، كلامه لا يدخل في التداول العادي للخطاب. والأهم: <strong>معيار من هو «المجنون» يتغير تاريخيًا</strong>، ومعه يتغير من يُسمع ومن لا يُسمع.</p>
<p><strong>٣. إرادة الحقيقة.</strong> وهي أخفاها وأقواها. القسمة بين الصحيح والخطأ تبدو طبيعية، فمن يعترض على الحقيقة؟ لكن فوكو يقول إن <em>الطريقة</em> التي نقسم بها بين الصحيح والخطأ، ما يُعد دليلًا، ومن يحق له أن يقرر، وأي مؤسسة تمنح الختم، هي نظام تاريخي تدعمه مؤسسات: الجامعات، والمختبرات، والجمعيات العلمية، والنشر. وهذا النظام يمارس ضغطًا وإقصاء على الخطابات الأخرى. ومن المفارقة أن إرادة الحقيقة تخفي نفسها: لأنها تتكلم باسم «الحقيقة»، لا يُرى أنها إقصاء.</p>`,
field:`النوع التالت ده بالذات هتشوفه كل يوم: «ده مش علمي»، «فين الدراسة؟»، «ده رأي شخصي». ساعات ده نقد مشروع جدًا. بس ساعات بيستعمل علشان يطلع كلام صحيح من الملعب لمجرد إنه مجاش في الشكل المعتمد. السؤال اللي تسأله: «هل الاعتراض على المضمون، ولا على إن الكلام ماعداش من البوابة الرسمية؟»`,
key:'ثلاثة إقصاءات خارجية: المحظور (الموضوع والظرف والمتكلم)، والقسمة والنبذ (العقل والجنون)، وإرادة الحقيقة (نظام تاريخي يقرر ما يُعد صحيحًا).'},

{h:'ندرة المتكلمين: من يدخل الملعب',
body:`<p>وبعد الإجراءات التي تعمل على الخطاب نفسه، يصف فوكو إجراءات تعمل على <strong>المتكلمين</strong>: تجعلهم نادرين. لا يدخل كل أحد إلى مناطق الخطاب، وبعض المناطق مفتوحة للجميع، وبعضها محروس بشدة.</p>
<ul>
<li><strong>الطقوس:</strong> تحدد المؤهلات التي يجب أن يملكها المتكلم، والإيماءات والسلوك والظروف والعلامات التي يجب أن تصاحب الخطاب. خطاب القاضي وخطاب الطبيب وخطاب الواعظ لا يعمل إلا داخل طقسه: المكان، واللباس، والصيغ.</li>
<li><strong>جماعات الخطاب:</strong> جماعات تحفظ خطابًا وتتداوله داخل دائرة مغلقة، وتوزعه بقواعد صارمة. ويرى فوكو أنها لم تختف مع الحداثة، بل تحولت: المهن المتخصصة بلغتها الخاصة، والتي تجعل الدخيل غير مفهوم أو غير جاد.</li>
<li><strong>المذاهب:</strong> تربط المتكلمين بأنواع معينة من القول، وتمنعهم من غيرها. والانتماء إلى مذهب يُعرف من الكلام نفسه: إذا قلت كذا فأنت منا.</li>
<li><strong>التملك الاجتماعي للخطاب:</strong> وأهم أمثلته عند فوكو <em>نظام التعليم</em>. يقول ما معناه إن كل نظام تعليمي طريقة سياسية للحفاظ على تملك الخطابات أو تعديله، بما تحمله من معارف وسلطات.</li>
</ul>`,
field:`«الجارجون» أو اللغة المتخصصة من أوضح أمثلة «جماعات الخطاب». الدكاترة بيتكلموا بلغة، والمحامين بلغة، والمستشارين بلغة. ساعات اللغة دي دقيقة وضرورية. وساعات وظيفتها الحقيقية إنها تقفل الباب: اللي مايعرفش يتكلم بيها يبان «مش فاهم» حتى لو فاهم أحسن من الكل.`,
key:'ندرة المتكلمين: الطقوس تحدد المؤهلات، وجماعات الخطاب تغلق الدائرة، والمذاهب تربط المتكلم بأقوال معينة، والتعليم يوزع حق الكلام.'},

{h:'الخطاب يكوّن الأشياء التي يتكلم عنها',
body:`<p>في كتابه «حفريات المعرفة» (١٩٦٩) يضع فوكو جملة هي أهم ما في الملف: الخطابات ليست مجموعات من العلامات تشير إلى محتويات أو تمثيلات، بل هي <strong>ممارسات تكوّن بانتظام الأشياء التي تتكلم عنها</strong>.</p>
<p>ماذا يعني هذا؟ خذ مثالًا من عمل فوكو نفسه: «المجنون» بالمعنى الحديث، أي «مريض نفسي» يحتاج إلى مؤسسة وطبيب وعلاج، لم يكن موجودًا بهذه الصورة في كل العصور. الناس الذين يتصرفون بغرابة موجودون دائمًا، لكن تحويلهم إلى «موضوع» محدد، له اسم وتصنيف ومؤسسة وخبراء، هو عمل خطاب معين نشأ في زمن معين. الخطاب لم يكتشف «المريض النفسي» كما يكتشف عالم نوعًا جديدًا من الحشرات؛ بل شارك في تكوينه كموضوع للمعرفة والتدخل.</p>
<p>ولا يعني هذا أن الأشياء «غير موجودة» أو أن كل شيء «كلام». يعني أن <em>الطريقة التي يصير بها شيء موضوعًا</em>، يُعرَّف ويُقاس ويُعالج ويُدار، هي من صنع الخطاب. والخطاب الذي يكوّن موضوعه يكوّن معه السلطة عليه: من يعرّف «المشكلة» يملك حق التدخل فيها.</p>
<p>وهنا يتصل فوكو بشميت وغرامشي بطريقة مدهشة: من يسمي «الإرهابي» أو «المتطرف» أو «المريض» أو «الموظف غير المنتج» لا يصف شخصًا فقط، بل يصنع فئة، ويصنع معها مؤسسات للتعامل معها، وخبراء لقياسها، وإجراءات لإدارتها.</p>`,
field:`في الشركات: مصطلح «الموظف منخفض الأداء» بيعمل بالظبط اللي فوكو بيقوله. أول ما المصطلح يتعمل، بيتعمل معاه نموذج تقييم، وخطة تحسين أداء، واجتماعات متابعة، وملف. الموظف اللي كان «عنده ظروف» أو «في قسم مضغوط» بقى «حالة» ليها إجراءات. الخطاب صنع الحالة، وصنع معاها السلطة عليها.`,
key:'الخطاب لا يصف الأشياء فقط، بل يكوّنها كموضوعات للمعرفة والتدخل. ومن يعرّف المشكلة يملك حق التدخل فيها.'},

{h:'الحفريات والإبستيمي: قواعد التفكير في عصر',
body:`<p>قبل «نظام الخطاب»، كتب فوكو «الكلمات والأشياء» (١٩٦٦)، واستعمل فيه مفهوم <strong>الإبستيمي</strong>: البنية الخفية التي تحدد، في عصر معين، شروط إمكان المعرفة، أي ما يمكن أن يُعتبر معرفة أصلًا، وكيف تُرتب الأشياء وتُصنف.</p>
<p>وسمّى منهجه «الحفريات»: كما يحفر عالم الآثار في طبقات الأرض ليكشف بنية مدينة قديمة، يحفر فوكو في نصوص عصر ليكشف القواعد التي كان الناس يفكرون بها دون أن يعرفوها. وهذه القواعد لا يقررها أحد، ولا يعيها أحد، لكنها تحدد كل ما يمكن أن يُقال.</p>
<p>وفي «حفريات المعرفة» يتحدث عن «التشكيلات الخطابية»: مجموعات من الأقوال تخضع لنفس قواعد التكوين، فتحدد معًا ما يمكن أن يكون موضوعًا، ومن يحق له الكلام، وما المفاهيم المتاحة، وما الاستراتيجيات الممكنة.</p>
<p>لماذا يهمك هذا كضابط؟ لأن أي نقاش عام اليوم يدور داخل تشكيل خطابي. وحين تجد أن فكرة ما «لا يمكن طرحها» ليس لأن أحدًا منعها، بل لأنها لا تجد مفاهيم تُقال بها، فأنت عند حدود التشكيل الخطابي.</p>`,
key:'الإبستيمي والتشكيل الخطابي: قواعد خفية تحدد في عصر ما الذي يمكن أن يُعتبر معرفة، ومن يتكلم، وبأي مفاهيم.'},

{h:'أسئلة فوكو الثلاثة: بدل «هل هذا صحيح؟»',
body:`<p>اجمع الملف في تحويل واحد لطريقة سؤالك. حين تسمع خطابًا، لا تكتف بسؤال «هل هذا صحيح؟». أضف ثلاثة أسئلة فوكوية:</p>
<ol>
<li><strong>من يحق له أن يقول هذا، وفي أي طقس؟</strong> ما المؤهلات التي جعلت كلامه مسموعًا؟ ومن قال الشيء نفسه دون أن يُسمع؟</li>
<li><strong>ما الذي لا يمكن قوله هنا؟</strong> ما المحظور، وما الذي يُعامل كجنون أو ضوضاء، وما الذي يُستبعد باسم «الحقيقة» أو «العلمية»؟</li>
<li><strong>ما الموضوع الذي يكوّنه هذا الخطاب؟</strong> أي فئة أو «حالة» أو «مشكلة» يصنع، وما المؤسسات والإجراءات التي تُبنى عليها؟</li>
</ol>
<p>وانتبه: هذه الأسئلة <em>تضاف</em> إلى سؤال الصحة ولا تلغيه. فوكو نفسه كثيرًا ما بدا كأنه يلغي سؤال الصحة، وهنا نختلف معه، كما سترى في ورقة النقد.</p>`,
key:'أضف إلى «هل هذا صحيح؟» ثلاثة أسئلة: من يحق له القول وفي أي طقس؟ ما الذي لا يمكن قوله؟ ما الموضوع الذي يكوّنه الخطاب؟'}
],
quotes:[
 {t:'في كل مجتمع، يكون إنتاج الخطاب مراقبًا ومنتقى ومنظمًا ومعاد التوزيع عبر إجراءات وظيفتها أن تدرأ قواه ومخاطره.', src:'فوكو، نظام الخطاب (١٩٧٠)، بتصرف', why:'الفرضية التي يقوم عليها الملف.'},
 {t:'الخطاب ليس فقط ما يترجم الصراعات، بل هو ما يُتصارع عليه وبه، السلطة التي نسعى إلى امتلاكها.', src:'فوكو، نظام الخطاب، بتصرف', why:'الكلام ليس وسيلة الصراع فقط، بل غنيمته.'},
 {t:'الخطابات ممارسات تكوّن بانتظام الأشياء التي تتكلم عنها.', src:'فوكو، حفريات المعرفة (١٩٦٩)', why:'الخطاب يصنع موضوعاته لا يصفها فقط.'},
 {t:'كل نظام تعليمي طريقة سياسية للحفاظ على تملك الخطابات أو تعديله.', src:'فوكو، نظام الخطاب، بتصرف', why:'المدرسة توزع حق الكلام.'}
],
worked:{
 title:'حالة محلولة: الموظف والمستشار',
 case:`في اجتماع لتطوير خدمة العملاء:<br>موظف بعشر سنوات خبرة: <b>«العملا بيشتكوا إن التحويل بين الأقسام بيضيع وقتهم، وإحنا مش بنقدر نحل حاجة من أول مكالمة.»</b><br>المستشار الخارجي: <b>«ده كلام انطباعي. محتاجين نشتغل data-driven.»</b><br>بعد أسبوعين، يعرض المستشار شريحة بعنوان: <b>«نقاط الاحتكاك في رحلة العميل: تعدد نقاط التسليم يرفع متوسط زمن الحل ٣٤٪»</b>. يصفق الحضور، ويُعتمد مشروع بميزانية.`,
 steps:[
  {h:'السؤال الأول: من يحق له القول وفي أي طقس؟', body:'المضمون واحد تقريبًا. لكن الموظف تكلم بصفة «موظف على الخط»، في مداخلة عابرة. والمستشار تكلم بصفة «خبير خارجي»، في طقس رسمي: عرض، وشرائح، ورقم. <em>الطقس</em> هو ما جعل كلام الثاني «جادًا».'},
  {h:'إرادة الحقيقة', body:'«ده انطباعي» و«data-driven» ليستا اعتراضًا على المضمون. هما إعلان عن نظام الحقيقة المعتمد: لا يُعد صحيحًا إلا ما جاء في صيغة رقمية من مصدر معتمد. خبرة عشر سنوات صارت «انطباعًا»، لا لأنها خاطئة بل لأنها لم تأتِ من البوابة الرسمية.'},
  {h:'جماعة الخطاب', body:'«رحلة العميل» و«نقاط الاحتكاك» و«متوسط زمن الحل» لغة جماعة خطاب: الاستشارات والإدارة. من يتكلم بها يُعتبر داخل الدائرة. ومن يقول «العملا بيشتكوا» يبدو خارجها، حتى لو كان أقرب إلى الحقيقة الميدانية.'},
  {h:'الموضوع الذي تكوّن', body:'لاحظ ما فعله الخطاب: حوّل «عملاء غاضبين وموظفين عاجزين» إلى «نقاط احتكاك في رحلة». الموضوع الجديد يمكن قياسه وإدارته بمشروع وميزانية، وصاحب الحق في إدارته هو من صاغ الموضوع: المستشار.'},
  {h:'ما الذي لم يُقل', body:'في الصيغة الأولى كان هناك سؤال ضمني: لماذا لا يملك الموظف صلاحية الحل من أول مكالمة؟ هذا سؤال عن توزيع السلطة. في صيغة المستشار اختفى السؤال، وحل محله «تقليل نقاط التسليم»، وهو حل تقني لا يمس من يملك الصلاحيات.'}
 ],
 verdict:'لم يكذب أحد، وقد يكون المشروع مفيدًا. لكن الخطاب أعاد توزيع حق الكلام: الخبرة الميدانية صارت انطباعًا، ولغة الاستشارة صارت حقيقة، والسؤال عن الصلاحيات اختفى داخل «الرحلة».'
},
yourturn:{
 title:'دورك: تقرير المدرسة',
 case:`طفل في المرحلة الابتدائية كثير الحركة في الفصل، ويقاطع المعلمة. بعد شهر يكتب الأخصائي المدرسي تقريرًا: <b>«الطالب يُظهر مؤشرات اضطراب سلوكي، ويُوصى بخطة تعديل سلوك ومتابعة أسبوعية وإخطار ولي الأمر.»</b><br>والدة الطفل تقول في الاجتماع: <b>«هو في البيت هادي، بس الفصل فيه ٤٥ طفل والمدرسة مفيهاش فسحة حقيقية.»</b> فترد الإدارة: <b>«نحترم رأيك، لكن التقرير صادر عن مختص.»</b>`,
 prompt:'حلل الموقف بأسئلة فوكو الثلاثة، مع الانتباه إلى أنك لا تحكم على صحة التقرير طبيًا.',
 points:[
  'حددت من يملك حق القول هنا (المختص) والطقس الذي يعطي كلامه وزنًا (التقرير الرسمي)',
  'لاحظت كيف استُبعد كلام الأم: لا لأنه مُفنَّد، بل لأنه لم يصدر عن «مختص»',
  'حددت الموضوع الذي كوّنه الخطاب («طالب مضطرب سلوكيًا») والإجراءات المبنية عليه (خطة، متابعة، إخطار)',
  'لاحظت السؤال الذي اختفى: ظروف الفصل (٤٥ طفلًا، لا فسحة) كسبب بديل محتمل',
  'ميّزت بين تحليل نظام الخطاب وبين الحكم على صحة التشخيص (أي لم تقل إن التقرير خطأ بالضرورة)',
  'اقترحت سؤالًا عمليًا يعيد إدخال الكلام المستبعد (مثلًا: هل قُيّم سلوكه في ظروف مختلفة؟)'
 ],
 model:`<p><b>من يحق له القول:</b> الأخصائي، بصفته «مختصًا»، في طقس رسمي هو «التقرير». هذا الطقس يجعل كلامه حقيقة إدارية.</p>
<p><b>ما الذي استُبعد:</b> كلام الأم لم يُفنَّد، بل وُضع خارج نظام الحقيقة: «نحترم رأيك» تعني أن كلامها رأي، والتقرير حقيقة. وهذه إرادة الحقيقة وهي تعمل.</p>
<p><b>الموضوع المتكوّن:</b> «طالب مضطرب سلوكيًا». وهو موضوع تُبنى عليه إجراءات: خطة، ومتابعة، وملف. ومن صاغ الموضوع يملك حق التدخل فيه.</p>
<p><b>السؤال الذي اختفى:</b> هل المشكلة في الطفل أم في فصل فيه ٤٥ طفلًا بلا فسحة؟ الخطاب نقل المشكلة من البيئة إلى الفرد.</p>

{h:'السلطة تُنتج',
body:`<p>هنا الانقلاب الأهم في الملف. يكتب فوكو ما معناه: يجب أن نكف نهائيًا عن وصف آثار السلطة بعبارات سلبية: «تستبعد»، «تقمع»، «تراقب»، «تخفي». <strong>في الحقيقة، السلطة تُنتج؛ تنتج الواقع، وتنتج مجالات من الموضوعات وطقوسًا للحقيقة.</strong></p>
<p>ماذا يعني أن السلطة تنتج؟ خذ المدرسة. هي لا تمنع الأطفال من أشياء فقط. هي <em>تنتج</em> «التلميذ المجتهد» و«التلميذ الضعيف»، وتنتج «الدرجات» و«الترتيب»، وتنتج عند الطفل نفسه صورة عن ذاته: «أنا شاطر في الرياضيات» أو «أنا مش بتاع مذاكرة». هذه الصورة لم تكن موجودة قبل النظام، والنظام صنعها.</p>
<p>ولماذا هذا أخطر من القمع؟ لأن القمع يُرى ويُقاوم. أما الإنتاج فيصنع الشخص الذي سيقاوم أو لا يقاوم. السلطة التي تقمع تقف أمامك؛ السلطة التي تنتج تقف <em>داخلك</em>، في الطريقة التي تفهم بها نفسك.</p>`,
field:`لو حد قالك «انت موظف مش طموح» ٣ سنين في تقييماتك، في الآخر ممكن تصدقها. التقييم ماقمعكش، ده «أنتج» صورة عنك، وانت لبستها. وعشان كده أخطر سؤال تسأله لنفسك: «الصورة اللي عندي عن نفسي دي، مين اللي صنعها؟ وبأي مقياس؟»`,
key:'السلطة الحديثة لا تقمع فقط، بل تنتج: موضوعات، وطقوس حقيقة، وصورًا عن الذات. والإنتاج أخطر لأنه يقف داخلك لا أمامك.'},

{h:'السلطة/المعرفة: وجهان لعملة',
body:`<p>من هنا تأتي الصيغة التي اشتهر بها فوكو: <strong>السلطة/المعرفة</strong>، بخط مائل بين الكلمتين، كأنهما شيء واحد بوجهين. ويقول ما معناه: <em>لا توجد علاقة سلطة دون أن يتكوّن معها حقل معرفة، ولا معرفة لا تفترض علاقات سلطة وتكوّنها في الوقت نفسه.</em></p>
<p>المقولة القديمة «المعرفة قوة» تعني أن من يعرف يستطيع أن يستعمل معرفته. أما فوكو فيقول شيئًا أعمق: <strong>ممارسة السلطة نفسها تنتج معرفة، والمعرفة نفسها تمكّن ممارسة السلطة.</strong> السجن يراقب المساجين، فتنشأ معرفة: علم الإجرام، وملفات، وتصنيفات للمجرمين. وهذه المعرفة تسمح بإدارة أدق للمساجين، فتنتج معرفة أدق، وهكذا.</p>
<p>وهنا يتصل الملف بسابقه. في «نظام الخطاب» رأيت كيف يكوّن الخطاب موضوعاته. وهنا ترى الآلة التي تفعل ذلك: <em>المؤسسة التي تراقب تنتج معرفة عمن تراقبه، والمعرفة تجعل المراقبة أدق</em>.</p>`,
field:`كل نظام «بيانات» في شغلك بيعمل الحلقة دي. الإدارة بتجمع داتا عن مكالماتك، فبتعرف عنك حاجات انت نفسك ماتعرفهاش: متوسط وقتك، أكتر ساعة بتتعب فيها. والمعرفة دي بتخليها تتحكم فيك أدق: تحط لك تارجت مظبوط على مقاسك بالظبط. المعرفة والسلطة هنا مش حاجتين، دي ماكينة واحدة.`,
key:'السلطة/المعرفة: ممارسة السلطة تنتج معرفة، والمعرفة تمكّن سلطة أدق. حلقة واحدة لا وجهان منفصلان.'},

{h:'أدوات الانضباط الثلاث',
body:`<p>يسمي فوكو السلطة الحديثة <strong>«الانضباط»</strong>، ويقول إنها تصنع <strong>«أجسادًا طيّعة»</strong>: أجسادًا يمكن أن تُخضع وتُستعمل وتُحوّل وتُحسَّن. ثم يحدد لها ثلاث أدوات بسيطة، سر نجاحها في بساطتها:</p>
<p><strong>١. المراقبة الهرمية.</strong> بناء يرى فيه من فوق من تحته دون أن يُرى بالضرورة. المعسكر، والمصنع، والمدرسة، صُممت كلها بحيث تكون الرؤية متدرجة: كل مستوى يرى المستوى الذي تحته. والمهم أن المراقبة مدمجة في البناء نفسه، لا في شخص بعينه.</p>
<p><strong>٢. الحكم المُطبِّع.</strong> في كل نظام انضباطي «عقوبات صغيرة» على مخالفات صغيرة: التأخير، والغياب، والإهمال، وطريقة الكلام، والهيئة. والمقياس هنا ليس «القانون» بل <em>«المعيار»</em>: ما هو «عادي». والنظام لا يعاقب من خالف القانون فقط، بل من ابتعد عن المعدل. ولهذا يسميه «مُطبِّعًا»: يدفع الجميع نحو «الطبيعي»، ويرتّبهم على سلم من الأفضل إلى الأسوأ.</p>
<p><strong>٣. الفحص.</strong> يجمع الأداتين: مراقبة تقيس، وحكم يرتّب. الامتحان المدرسي، والكشف الطبي، والتقييم الوظيفي. وللفحص أثران حاسمان: يجعل الفرد <em>مرئيًا</em> تمامًا، ويحوّله إلى <strong>«حالة»</strong> موثقة في ملف. الإنسان العادي لم يكن له ملف قبل العصر الحديث؛ الملوك فقط كانت تُكتب سيرهم. الانضباط عكس ذلك: صار كل فرد عادي موضوعًا للكتابة والتوثيق والمقارنة.</p>`,
field:`لو بتشتغل في مركز اتصال، انت عايش جوه التلات أدوات حرفيًا: الـ«مونيتورينج» مراقبة هرمية، والـ«سكور» بتاع كل مكالمة حكم مُطبِّع بيقارنك بالمتوسط، وتقييم آخر الشهر فحص بيحولك لملف. وخد بالك: كل ده ممكن يكون مفيد في تحسين الخدمة. فوكو مش بيقولك ارفضه. بيقولك اعرف هو بيعمل إيه فيك.`,
key:'المراقبة الهرمية ترى، والحكم المطبِّع يرتّب حول «العادي»، والفحص يجمعهما ويحوّل الفرد إلى حالة في ملف.'},

{h:'البانوبتيكون: السجن الذي يحرسه السجين',
body:`<p>سنة ١٧٩١ نشر الفيلسوف الإنجليزي جيريمي بنثام تصميمًا لسجن مثالي سماه <strong>«البانوبتيكون»</strong>، أي «المرئي كله». التصميم: مبنى دائري، زنازينه على المحيط، كل زنزانة مضاءة من الخارج والداخل. وفي المركز برج مراقبة بنوافذ معتمة. الحارس في البرج يرى كل الزنازين، والسجناء لا يرونه، ولا يعرفون إن كان في البرج أصلًا.</p>
<p>يرى فوكو في هذا التصميم نموذج السلطة الحديثة كلها. والآلية، بعبارته، أن الهدف هو أن يُحدث عند السجين <strong>حالة من الرؤية الواعية الدائمة تضمن الأداء الآلي للسلطة</strong>. ومبدأ بنثام أن السلطة يجب أن تكون <em>مرئية</em> (السجين يرى البرج دائمًا) و<em>غير قابلة للتحقق</em> (لا يعرف أبدًا إن كان مراقبًا الآن).</p>
<p>والنتيجة هي أعمق جملة في الملف. يقول فوكو ما معناه: من يخضع لمجال رؤية، ويعرف ذلك، يتحمل هو نفسه قيود السلطة، ويجعلها تعمل تلقائيًا على نفسه، فيصبح <strong>مبدأ إخضاعه الخاص</strong>.</p>
<p>أي أن البرج يمكن أن يكون فارغًا. لا يهم. السجين صار حارس نفسه. وهذا هو الانتقال الكامل من سلطة تحتاج حارسًا إلى سلطة يحملها المحكوم داخله.</p>`,
field:`البانوبتيكون النهارده مش مبنى. هو «اللي ممكن يتشاف». كاميرا في المكتب ممكن تكون مش شغالة، بس انت بتتصرف كأنها شغالة. مكالمة ممكن تتقيّم، فبتتكلم في كل مكالمة كأنها هتتقيّم. وحتى خارج الشغل: أي حاجة تكتبها على السوشيال ممكن حد يشوفها بعد سنين، فبتراقب نفسك قبل ما تكتب. البرج فاضي غالبًا، والحارس جواك.`,
key:'البانوبتيكون: رؤية مرئية وغير قابلة للتحقق، فيصير المراقَب حارس نفسه، والبرج يمكن أن يكون فارغًا.'},

{h:'المعيار بدل القانون: سلطة «الطبيعي»',
body:`<p>أدق ما في الانضباط أنه يحكم بـ<strong>المعيار</strong> لا بالقانون. القانون يقول: «هذا ممنوع، ومن يفعله يعاقب». أما المعيار فيقول: «هذا هو المعدل، وكل ابتعاد عنه مشكلة تحتاج تصحيحًا».</p>
<p>الفرق جوهري. القانون يقسم الناس إلى ملتزمين ومخالفين، وأغلب الناس ملتزمون فلا يُمسّون. أما المعيار فيرتّب <em>الجميع</em> على سلم، ولا أحد خارجه: كل واحد إما فوق المعدل أو تحته أو عنده. فلا أحد آمن، وكل واحد مطالب بالتحسن المستمر.</p>
<p>ومن هنا عمليات «التطبيع»: كل ما ينحرف عن المعدل يصير «غير طبيعي»، أي حالة تحتاج تدخلًا: علاجًا، أو تدريبًا، أو خطة تحسين. وهذا يذكرك بـ«نزع الطبيعية» في الملف السابق: الانضباط هو الآلة التي <em>تصنع</em> ما يُسمى «طبيعيًا».</p>`,
field:`لاحظ الفرق: «ممنوع التأخير» قانون. «متوسط وقت المكالمة في الفريق ٤ دقايق، وانت ٥» معيار. التاني أقوى بكتير، لأنه مش بيقولك انت غلط، بيقولك انت «تحت المتوسط». ولو كل الفريق اتحسن، المتوسط هيطلع، وهتلاقي نفسك تحته تاني. السباق مالوش خط نهاية.`,
key:'القانون يقسم إلى ملتزم ومخالف، والمعيار يرتّب الجميع حول «المعدل» فلا أحد آمن. والانضباط هو الآلة التي تصنع «الطبيعي».'},

{h:'نظام الحقيقة، وحيث توجد سلطة توجد مقاومة',
body:`<p>في حوار مشهور سنة ١٩٧٧ بعنوان «الحقيقة والسلطة»، يقدم فوكو مفهوم <strong>«نظام الحقيقة»</strong>: كل مجتمع له نظامه في الحقيقة، أي أنواع الخطاب التي يقبلها ويجعلها تعمل كحقيقة، والآليات التي تميز الصحيح من الخطأ، والإجراءات المعتمدة للوصول إلى الحقيقة، ومكانة من يُكلَّفون بقول ما يُعد صحيحًا.</p>
<p>وفي العصر الحديث، يرى فوكو أن الحقيقة تتمركز حول الخطاب العلمي والمؤسسات التي تنتجه، وأنها موضوع لطلب سياسي واقتصادي كبير، وأنها تُنتج وتنقل تحت سيطرة أجهزة كبرى كالجامعة والإعلام.</p>
<p>لكن فوكو لا يرسم سجنًا بلا مخرج. ففي «تاريخ الجنسانية» (المجلد الأول، ١٩٧٦) يكتب جملته الشهيرة: <strong>حيث توجد سلطة توجد مقاومة</strong>. والسلطة عنده ليست شيئًا يملكه أحد ويحرم منه آخر، بل شبكة علاقات منتشرة، وفي كل نقطة منها إمكانية مقاومة. أي أن السلطة المنتشرة في كل مكان تعني أيضًا أن المقاومة ممكنة في كل مكان، لا في مكان واحد فقط.</p>`,
field:`جملة «حيث توجد سلطة توجد مقاومة» مهمة لك عمليًا: يعني متستناش «ثورة» عشان تقاوم. المقاومة ممكنة في كل نقطة صغيرة: في إنك تسأل عن معيار التقييم، في إنك تكتب ملاحظتك على التقييم، في إنك تحتفظ بصورة عن نفسك مش صادرة من النظام. كل نقطة سلطة فيها باب.`,
key:'لكل مجتمع نظام حقيقة يحدد ما يُعد صحيحًا ومن يقوله. والسلطة شبكة منتشرة، ولذلك المقاومة ممكنة في كل نقطة منها.'}
],
quotes:[

 {t:'لا توجد علاقة سلطة دون أن يتكوّن معها حقل معرفة، ولا معرفة لا تفترض علاقات سلطة وتكوّنها.', src:'فوكو، المراقبة والمعاقبة، بتصرف', why:'تعريف السلطة/المعرفة.'},
 {t:'أن يُحدث عند السجين حالة من الرؤية الواعية الدائمة تضمن الأداء الآلي للسلطة.', src:'فوكو، المراقبة والمعاقبة، عن البانوبتيكون', why:'آلية البانوبتيكون في سطر.'},
 {t:'من يخضع لمجال رؤية ويعرف ذلك… يصبح مبدأ إخضاعه الخاص.', src:'فوكو، المراقبة والمعاقبة، بتصرف', why:'حين يصير المراقَب حارس نفسه.'},

],
worked:{
 title:'حالة محلولة: نظام الجودة في مركز الاتصال',
 case:`مركز اتصال يطبق نظامًا جديدًا:<br><b>١)</b> كل المكالمات مسجلة، ويُختار منها عشوائيًا ٥ مكالمات شهريًا لكل موظف.<br><b>٢)</b> نموذج تقييم من ٢٠ بندًا: التحية، والتعاطف، ونبرة الصوت، والالتزام بالنص، ومدة الانتظار…<br><b>٣)</b> شاشة في الصالة تعرض ترتيب الموظفين أسبوعيًا.<br><b>٤)</b> من يقل عن المتوسط يدخل «جلسة كوتشينج» وتُفتح له «خطة تطوير».<br><b>٥)</b> ملف لكل موظف فيه كل تقييماته منذ التعيين.`,
 steps:[
  {h:'البانوبتيكون: البند ١', body:'العشوائية هي جوهر البانوبتيكون. الموظف لا يعرف أي مكالمة ستُفتح، فيتصرف في كل المكالمات كأنها مراقبة. خمس مكالمات تُقيَّم فعلًا، لكن مئات تُدار بالانضباط الذاتي. البرج فارغ تقريبًا، والموظف حارس نفسه.'},
  {h:'المراقبة الهرمية: البنود ١ و٣', body:'التسجيل يجعل كل موظف مرئيًا لمن فوقه. والشاشة تجعل الجميع مرئيين لبعضهم أيضًا، فتضيف طبقة مراقبة أفقية: الزميل يرى ترتيب زميله.'},
  {h:'الحكم المُطبِّع: البندان ٢ و٤', body:'النموذج لا يقيس «مخالفات» بالمعنى القانوني، بل يقيس الابتعاد عن «المعيار»: نبرة صوت مثالية، وتعاطف مثالي. ومن تحت المتوسط لا يُعاقب بل «يُطوَّر». هذه عقوبة صغيرة في هيئة مساعدة.'},
  {h:'الفحص والملف: البند ٥', body:'كل موظف صار «حالة» موثقة منذ يومه الأول. والملف ينتج معرفة عنه قد لا يعرفها هو: نقاط ضعفه، وأسوأ أيامه، وتطوره. وهذه المعرفة تمكّن إدارة أدق له: السلطة/المعرفة كاملة.'},
  {h:'السلطة المنتجة', body:'النظام لا يمنع فقط. هو ينتج «الموظف المتميز» و«الموظف تحت المتوسط»، وينتج عند الموظف نفسه صورة عن ذاته. بعد سنة من الترتيب الأسبوعي، قد يقول موظف عن نفسه «أنا من النوع اللي تحت المتوسط»، وهي جملة لم تكن ممكنة قبل النظام.'},
  {h:'المقاومة الممكنة', body:'«حيث توجد سلطة توجد مقاومة». نقاط المقاومة هنا: السؤال عن من صمم البنود العشرين ولماذا، وطلب الاطلاع على الملف والتعليق عليه، ورفض أن يكون ترتيب الشاشة تعريفًا للذات. هذه ليست ثورة، لكنها تمنع النظام من أن يصير «طبيعة».'}
 ],
 verdict:'النظام قد يحسّن الخدمة فعلًا، وهذا ليس موضوع التحليل. الموضوع أنه يعمل بالأدوات الثلاث للانضباط والبانوبتيكون معًا، ويُنتج موظفين يراقبون أنفسهم ويعرّفون أنفسهم بمقاييسه.'
},
yourturn:{

 prompt:'حلل التطبيق بأدوات الملف: أين البانوبتيكون، والمراقبة، والحكم المطبِّع، والفحص، والسلطة/المعرفة؟ وأين يمكن المقاومة دون التخلي عن فائدته؟',

body:`<p>في محاضراته في الكوليج دو فرانس سنة ١٩٧٨ (التي نُشرت بعنوان «الأمن، الإقليم، السكان») قدّم فوكو مفهوم <strong>«الحاكمية»</strong>. والكلمة في الفرنسية تلعب على كلمتين: «الحكم» و«العقلية». أي: طريقة التفكير التي تجعل ممارسة الحكم ممكنة.</p>
<p>وأشهر تعريف للحكم عنده أنه <strong>«قيادة السلوك»</strong>. والعبارة الفرنسية فيها لعب مقصود: الفعل نفسه يعني «يقود» و«يسلك». فالحكم هو التأثير في طريقة تصرف الناس، لا بإجبارهم مباشرة، بل بترتيب الظروف التي يختارون فيها.</p>

<p>ويرى فوكو أن الدولة الحديثة انتقلت تدريجيًا من «السيادة» التي تهتم بالأرض وطاعة الرعايا، إلى «الحاكمية» التي تهتم بـ<strong>السكان</strong>: عددهم، وصحتهم، وإنتاجيتهم، ومواليدهم، وأمراضهم. وأدواتها: الإحصاء، والاقتصاد السياسي، و«أجهزة الأمن» التي لا تمنع الظواهر بل تديرها في حدود مقبولة.</p>`,

{h:'السلطة الحيوية: أن تجعل الناس يعيشون',
body:`<p>في الفصل الأخير من «تاريخ الجنسانية» (المجلد الأول، ١٩٧٦)، يقدم فوكو مقارنة حاسمة. السلطة السيادية القديمة كان جوهرها <strong>«حق أن تُميت أو تترك تعيش»</strong>: الملك يظهر قوته حين يقتل. أما السلطة الحديثة فجوهرها مقلوب: <strong>«أن تجعل الناس يعيشون، وتتركهم يموتون»</strong>.</p>
<p>ماذا يعني «أن تجعلهم يعيشون»؟ أن تهتم بالحياة نفسها: الصحة العامة، والتطعيم، والنظافة، وطول العمر، ومعدلات المواليد، والتغذية، والإنتاجية. ويسمي فوكو هذا <strong>«السلطة الحيوية»</strong>، ويقسمها إلى قطبين:</p>
<ul>
<li><strong>سياسة تشريح الجسد</strong>: الانضباط الذي رأيته في الملف السابق، الذي يعمل على الجسد الفردي ليجعله نافعًا وطيعًا.</li>
<li><strong>السياسة الحيوية للسكان</strong>: إدارة الكتلة البشرية كلها كظاهرة إحصائية: نسب المواليد والوفيات، والأوبئة، ومتوسط العمر.</li>
</ul>
<p>قد يبدو هذا أرحم بكثير من «حق الإماتة»، وفيه جانب رحيم فعلًا. لكن فوكو يلاحظ الوجه الآخر: السلطة التي تتولى «الحياة» تملك حق تعريف «الحياة الصحية» و«الإنسان المنتج» و«السلوك الخطر»، وتملك أدوات للتدخل في أدق تفاصيل العيش باسم الصحة والسلامة. ويلاحظ أيضًا مفارقة قاتمة: الحروب الحديثة صارت أكثر دموية لا أقل، لأنها تُخاض باسم «حياة» السكان وبقائهم.</p>`,
field:`لاحظ اللغة: «حفاظًا على صحتك»، «من أجل سلامتك»، «لمصلحتك». جمل كتير منها صادقة فعلًا. بس هي اللغة اللي السلطة الحيوية بتتكلم بيها. وأي حاجة بتتقال «لمصلحتك» بتبقى صعبة جدًا في الاعتراض عليها. اسأل: مين اللي حدد مصلحتي؟ وهل أنا شاركت في تعريفها؟`,
key:'السلطة القديمة: حق أن تُميت. والحديثة: أن تجعل الناس يعيشون. السلطة الحيوية تعمل على الجسد (الانضباط) وعلى السكان (الإحصاء)، وتملك حق تعريف «الحياة الصحية».'},

{h:'السلطة الرعوية: الكل وكل واحد',
body:`<p>من أين جاء شكل الحكم الذي يهتم بكل فرد؟ يقدم فوكو، في محاضرة سنة ١٩٧٩ بعنوان «الكل وكل واحد»، فكرة <strong>«السلطة الرعوية»</strong>.</p>
<p>الصورة القديمة صورة الراعي والقطيع. والراعي يختلف عن الملك: الملك يحكم أرضًا، والراعي يرعى قطيعًا يتحرك. والملك يهتم بالمدينة ككل، أما الراعي فيهتم بالقطيع كله <em>وبكل خروف على حدة</em>، يعرفه، ويتابعه، ويبحث عن الضال منه. ويرى فوكو أن التقليد الرعوي، كما تطور في المؤسسات الدينية المسيحية، أضاف عنصرًا حاسمًا: الراعي يحتاج أن يعرف <strong>ما في نفس</strong> كل فرد، عبر الاعتراف والإرشاد.</p>
<p>وأطروحة فوكو أن الدولة الحديثة ورثت هذا الشكل وعلمنته: صارت تهتم بالسكان ككتلة، وبكل فرد كحالة، في الوقت نفسه. وهذا الجمع بين «الشامل» و«الفردي» هو ما يجعل السلطة الحديثة قوية جدًا: هي تديرك كرقم في إحصاء، وتعرفك كفرد في ملف.</p>
<p>وانتبه إلى أن هذا تحليل فوكو لتقليد معين وتطوره في أوروبا، لا حكم على كل رعاية. فالرعاية في ذاتها فضيلة؛ والسؤال الذي يطرحه فوكو هو عن تحولها إلى تقنية حكم.</p>`,
key:'السلطة الرعوية ترعى «الكل وكل واحد»، وتحتاج معرفة نفس الفرد. والدولة الحديثة ورثت الجمع بين الإحصاء الشامل والملف الفردي.'},

{h:'مقاول نفسه: الحاكمية النيوليبرالية',
body:`<p>في محاضرات ١٩٧٨–١٩٧٩ (المنشورة بعنوان «ولادة السياسة الحيوية») حلل فوكو شكلًا جديدًا من الحاكمية ظهر في القرن العشرين: النيوليبرالية. وما يهمنا هنا ليس الاقتصاد، بل <strong>صورة الإنسان</strong> التي تصنعها.</p>
<p>في هذه الحاكمية، يصير الإنسان <strong>«مقاول نفسه»</strong>: هو رأس ماله، ومنتجه، ومصدر دخله. وكل شيء في حياته يُقرأ كـ«استثمار في رأس المال البشري»: التعليم استثمار، والصحة استثمار، والعلاقات «شبكة»، والوقت «موارد»، وحتى الراحة «إعادة شحن» لتزيد الإنتاجية.</p>
<p>وما يجعل هذا شكلًا من الحكم أنه <strong>يحكم عبر الحرية</strong>. لا أحد يأمرك أن تعمل أكثر. لكنك إذا كنت «مقاول نفسك»، فكل ساعة لا تستثمرها في نفسك خسارة، وكل فشل مسؤوليتك وحدك، وكل ضغط «تحدٍّ» تحتاج إلى «مرونة» لتتجاوزه. السلطة لم تعد تحتاج أن تقول لك «اعمل»؛ أنت الذي تقولها لنفسك، وتشعر أنك حر وأنت تقولها.</p>
<p>وقد طور عالم الاجتماع البريطاني نيكولاس روز هذه الفكرة في كتابه «قوى الحرية» (١٩٩٩)، فقال ما معناه إن الإنسان الحديث صار <em>«مُلزمًا بأن يكون حرًا»</em>: أن يفهم حياته كلها كسلسلة من الاختيارات التي هو مسؤول عنها وحده.</p>`,
field:`خطاب «انت براند»، «استثمر في نفسك»، «طلع أحسن نسخة منك»، «اصحى الساعة ٥ قبل الكل». فيه حاجات مفيدة فعلًا. بس لاحظ النتيجة البنيوية: لو مرتبك قليل، ده عشان «مااستثمرتش في نفسك كفاية». لو اتفصلت، ده عشان «ماطورتش مهاراتك». المشكلة اتنقلت كلها من الشركة والسوق لراسك انت. وده أنجح شكل حكم اتعمل: الناس بتلوم نفسها على اللي اتعمل فيها.`,
key:'في الحاكمية النيوليبرالية يصير الإنسان «مقاول نفسه»، وكل فشل مسؤوليته وحده. حكم عبر الحرية: «ملزم بأن يكون حرًا».'},

{h:'تقنيات الذات: الوجه الآخر',
body:`<p>في آخر حياته، غيّر فوكو اتجاهه. بعد سنوات من دراسة كيف تصنع السلطة الإنسان، بدأ يدرس كيف <strong>يصنع الإنسان نفسه</strong>. وفي حلقة دراسية سنة ١٩٨٢ (نُشرت بعنوان «تقنيات الذات») عرّفها بأنها التقنيات التي تسمح للأفراد بأن يقوموا، بوسائلهم الخاصة أو بمساعدة غيرهم، بعمليات على أجسادهم ونفوسهم وأفكارهم وسلوكهم، ليحولوا أنفسهم نحو حالة من السعادة أو الحكمة أو الكمال.</p>
<p>ودرس فوكو هنا «العناية بالذات» عند الإغريق والرومان: فحص الضمير في آخر اليوم، وكتابة الملاحظات عن النفس، والتمارين الذهنية لمواجهة المصائب، وضبط الشهوات. ورأى فيها شيئًا مختلفًا عن الانضباط الحديث: هنا الإنسان هو من يضع لنفسه غاية، ويعمل عليها بحرية.</p>
<p>وهنا الفرق الدقيق الذي يجب أن تمسكه: <strong>محاسبة النفس قد تكون أداة حكم، وقد تكون طريق حرية.</strong> وتقاليد كثيرة، دينية وفلسفية، عرفت مراقبة النفس ومحاسبتها كطريق إلى التحرر من الأهواء لا إلى الخضوع لأحد. والسؤال الفاصل ليس «هل تراقب نفسك؟» بل:</p>
<ul>
<li><strong>من وضع المعيار</strong> الذي تقيس به نفسك؟</li>
<li><strong>لمصلحة من</strong> يعمل هذا المعيار؟</li>
<li>وهل تستطيع أن <strong>تفحص المعيار نفسه</strong>، لا نفسك فقط؟</li>
</ul>`,
field:`الفرق ده عملي جدًا: لو بتحاسب نفسك آخر اليوم بمعيار انت مقتنع بيه ومختاره، زي «هل كنت صادق؟ هل ظلمت حد؟»، ده عمل على الذات حر. لو بتحاسب نفسك بمعيار اتحط لك من برة، زي «هل جبت التارجت؟ هل اشتغلت كفاية ساعات؟»، من غير ما تسأل مين حط المعيار ده وليه، يبقى انت بتشتغل «مشرف» في الشركة على نفسك ببلاش.`,
key:'تقنيات الذات: عمل الإنسان على نفسه. قد تكون طريق حرية أو أداة حكم. والفاصل: من وضع المعيار، ولمصلحة من، وهل تستطيع فحصه؟'},

{h:'خريطة السلطة عند فوكو: ثلاث طبقات',
body:`<p>اجمع ملفات فوكو الثلاثة في خريطة واحدة. السلطة عنده تطورت في ثلاث طبقات، وكلها تعمل معًا اليوم:</p>
<div class="tablewrap"><table class="t">
<tr><th>الطبقة</th><th>تعمل على</th><th>أداتها</th><th>سؤالك</th></tr>
<tr><td><b>السيادة</b></td><td>الأرض والرعايا</td><td>القانون والسيف</td><td>من يملك حق المنع والعقاب؟</td></tr>
<tr><td><b>الانضباط</b></td><td>الجسد الفردي</td><td>المراقبة والمعيار والفحص</td><td>من يراقب، وبأي معيار؟</td></tr>
<tr><td><b>الحاكمية</b></td><td>السكان والذات الحرة</td><td>الإحصاء، والحوافز، و«مقاول نفسه»</td><td>كيف رُتبت خياراتي لتقودني؟</td></tr>
</table></div>
<p>ولاحظ التطابق مع سلّم الخفاء من الملف صفر: السيادة هي «السيف»، والانضباط يعمل عند حدود «البديهة» و«المعيار»، والحاكمية تعمل في أعمق درجة: لا تفرض عليك شيئًا، بل ترتب العالم الذي «تختار» فيه بحرية.</p>
<p>والملف القادم ينقلك من النظرية إلى الصناعة: الرجال الذين حولوا هذه الآليات، قبل أن يسميها فوكو، إلى مهنة لها مكاتب وعملاء وميزانيات.</p>`,
key:'ثلاث طبقات تعمل معًا: السيادة (السيف)، والانضباط (المعيار)، والحاكمية (ترتيب الخيارات الحرة).'}
],

worked:{
 title:'حالة محلولة: برنامج «النسخة الأفضل منك»',
 case:`بعد إعادة هيكلة قلصت الفريق ٣٠٪ دون تقليص المهام، أطلقت إدارة الموارد البشرية برنامجًا:<br><b>١)</b> ورشة «المرونة النفسية: كيف تحول الضغط إلى طاقة».<br><b>٢)</b> تطبيق إنتاجية يسجل وقت التركيز ويمنح «شارات».<br><b>٣)</b> رسالة المدير: «كل واحد فيكم مسؤول عن براندو الشخصي ومستقبله».<br><b>٤)</b> «ساعات مرنة»: اشتغل وقت ما تحب، بشرط إنجاز المهام.<br><b>٥)</b> جائزة شهرية لـ«أكثر موظف استثمر في تطوير نفسه».`,
 steps:[
  {h:'الحاكمية: ترتيب الخيارات', body:'لا أحد أمر الموظفين بالعمل ساعات أطول. لكن «الساعات المرنة» مع مهام لم تقل تعني أن العمل سيمتد بـ«اختيارهم». هذا حكم بقيادة السلوك: العالم رُتب بحيث يصير العمل الطويل هو الخيار «الحر» المعقول.'},
  {h:'نقل المشكلة: من البنية إلى الفرد', body:'المشكلة الحقيقية بنيوية: الفريق قل والمهام لم تقل. لكن الورشة تعيد صياغتها كمشكلة نفسية: «حوّل الضغط إلى طاقة». المسؤولية انتقلت من توزيع العمل إلى «مرونتك» أنت.'},
  {h:'مقاول نفسه', body:'«البراند الشخصي» و«الاستثمار في النفس» لغة الحاكمية النيوليبرالية حرفيًا. مستقبلك مسؤوليتك وحدك، وإن تعثرت فهذا تقصير في استثمارك.'},
  {h:'الانضباط داخل الحرية', body:'تطبيق الإنتاجية بالشارات انضباط كلاسيكي: مراقبة وقياس ومعيار. لكنه مقدَّم كأداة «لك»، فيعمل كتقنية ذات مستعملة للحكم: أنت تراقب تركيزك بمعيار وضعه غيرك.'},
  {h:'المكافأة الرعوية', body:'جائزة «من استثمر في نفسه» تجمع الإحصاء (الكل يُقارن) والملف الفردي (كل واحد يُعرف). وهي تحوّل الاستنزاف إلى فضيلة تُكرَّم.'},
  {h:'ما يمكن فعله', body:'لا يلزم رفض البرنامج كله؛ قد تفيدك الورشة فعلًا. لكن السؤال الذي يعيد المشكلة إلى مكانها: «إحنا قلّينا ٣٠٪ والمهام زي ما هي. الحل في المرونة النفسية ولا في توزيع الشغل؟». سؤال يرفض أن تصير البنية مسألة نفسية.'}
 ],
 verdict:'البرنامج لا يحتوي أمرًا واحدًا. ومع ذلك فهو يدير الموظفين بالكامل: يرتب خياراتهم، وينقل المشكلة إلى نفوسهم، ويجعلهم يراقبون أنفسهم، ويكرّم استنزافهم. هذا هو الحكم عبر الحرية.'
},
yourturn:{
 title:'دورك: ثقافة «الساعة الخامسة صباحًا»',
 case:`محتوى منتشر على وسائل التواصل:<br><b>«الناجحين بيصحوا الساعة ٥ الفجر. لو انت لسه نايم، فيه حد بيشتغل على حلمه وانت بتضيع حلمك. اكتب أهدافك كل يوم، قيس كل ساعة من يومك، احذف أي علاقة مش بتضيفلك. الفقر اختيار، والراحة رفاهية مش من حقك لسه. انت المسؤول الوحيد عن حياتك.»</b>`,

 points:[

  'كشفت نقل المشكلات البنيوية (الفقر مثلًا) إلى اختيار فردي («الفقر اختيار»)',
  'حددت تقنيات الذات المستعملة (قياس الساعات، كتابة الأهداف) وسألت من وضع معيارها',
  'لاحظت تحويل العلاقات الإنسانية إلى «استثمار» يُحذف إن لم «يضف»',
  'فرزت عنصرًا نافعًا حقيقيًا (مثل التبكير أو كتابة الأهداف) عن الإطار الذي يقدمه',
  'صغت سؤالًا يعيد المعيار إلى صاحبه (مثلًا: نجاح بمعيار مين؟ وهل الراحة تقصير؟)'
 ],
 model:`<p><b>مقاول نفسه:</b> «انت المسؤول الوحيد عن حياتك» و«الراحة رفاهية» تحوّل الحياة كلها إلى مشروع استثماري، والفرد إلى شركة لا تتوقف.</p>
<p><b>نقل البنية إلى الفرد:</b> «الفقر اختيار» تمحو الأسباب البنيوية: السوق، والفرص، والظروف. هي أقصى صور الحكم عبر الحرية: الفقير يلوم نفسه.</p>
<p><b>تقنيات الذات:</b> قياس كل ساعة وكتابة الأهداف تقنيات قديمة يمكن أن تكون مفيدة. لكن المعيار هنا «الناجحين» بتعريف المحتوى: الإنتاجية المطلقة.</p>
<p><b>العلاقات كاستثمار:</b> «احذف أي علاقة مش بتضيفلك» تُدخل منطق الربح والخسارة في الصداقة والقرابة.</p>
<p><b>الفرز:</b> التبكير عادة نافعة في ذاتها، وتقاليد كثيرة تمدحها. المشكلة في الإطار الذي يجعلها سباقًا ويجعل الراحة ذنبًا.</p>
<p><b>السؤال:</b> «ناجح بمقياس مين؟ ولو اشتغلت ٢٠ ساعة وفضلت فقير، يبقى العيب فيّ ولا في حاجة تانية؟».</p>`
},

<p>والتر ليبمان، الصحفي والمفكر الأمريكي، كتب سنة ١٩٢٢ أن الناس لا يرون العالم، بل يرون «صورًا في رؤوسهم»، واستعمل عبارة «صناعة الرضا». وإدوارد بيرنيز، ابن أخت فرويد، حوّل الفكرة إلى مهنة سماها «العلاقات العامة»، وكتب عن «هندسة الرضا». ثم جاء علماء النفس والإدراك ليشرحوا، بالتجارب، لماذا يعمل التأطير في العقل.</p>

lesson:[
{h:'ليبمان: العالم الخارجي والصور في رؤوسنا',
body:`<p>سنة ١٩٢٢ نشر الصحفي الأمريكي <strong>والتر ليبمان</strong> كتاب «الرأي العام». وكان قد عمل في الحرب العالمية الأولى في الدعاية الحربية، فرأى من الداخل كيف تُصنع صورة العدو.</p>
<p>عنوان الفصل الأول يلخص الكتاب: <strong>«العالم الخارجي والصور في رؤوسنا»</strong>. والفكرة: العالم أكبر وأعقد وأبعد من أن يراه أي إنسان مباشرة. فنحن نتعامل لا مع العالم، بل مع <em>«بيئة زائفة»</em>: صورة صنعناها في رؤوسنا من أخبار وروايات وانطباعات. ونتصرف على أساس الصورة، لكن نتائج تصرفاتنا تقع في العالم الحقيقي.</p>
<p>ومن أشهر أفكاره <strong>«القوالب النمطية»</strong>، وهو أول من استعمل الكلمة بمعناها الاجتماعي. يقول ما معناه: <em>في أغلب الأحيان لا نرى أولًا ثم نعرّف، بل نعرّف أولًا ثم نرى.</em> نحمل في رؤوسنا قوالب جاهزة، فنرى في الواقع ما تسمح به القوالب، ونتجاهل ما لا يناسبها.</p>
<p>واستنتاج ليبمان صادم: إذا كان المواطن لا يرى العالم بل صورة عنه، فإن من يصنع الصورة يصنع الرأي. وقد كتب أن <strong>صناعة الرضا</strong> ليست فنًا جديدًا، لكنها تحسنت تقنيًا بشكل هائل، وأن الإقناع صار فنًا واعيًا بذاته وأداة منتظمة في الحكم الشعبي. وهو لم يكتب هذا محذرًا فقط، بل مقترحًا: رأى أن الحل أن يتولى «خبراء» صياغة الصورة الصحيحة للجمهور.</p>`,
field:`فكرة «نعرّف الأول وبعدين نشوف» بتشوفها كل يوم: لو اتقالك قبل ما تقابل زميل جديد إنه «متكبر»، هتلاقي نفسك شايف كل تصرف منه دليل على كده. سكوته «تكبر»، وكلامه «استعراض». القالب سبق العين. وأي حد بيعرف يزرع القالب قبل ما تشوف، بيتحكم في اللي هتشوفه.`,
key:'الناس يرون «صورًا في رؤوسهم» لا العالم. ونحن نعرّف أولًا ثم نرى. ومن يصنع الصورة يصنع الرأي: «صناعة الرضا».'},

{h:'بيرنيز: الحكومة غير المرئية',
body:`<p>إذا كان ليبمان المنظّر، فإن <strong>إدوارد بيرنيز</strong> (١٨٩١–١٩٩٥) كان المهندس. ابن أخت سيغموند فرويد، عمل في لجنة الدعاية الأمريكية في الحرب العالمية الأولى، ثم قرر أن ما نجح في الحرب يمكن أن ينجح في السلم: لبيع المنتجات، والأفكار، والسياسيين. وسمّى مهنته «مستشار العلاقات العامة».</p>
<p>في كتابه «الدعاية» (١٩٢٨) يفتتح بجمل صريحة إلى حد الصدمة. معناها: التلاعب الواعي والذكي بالعادات والآراء المنظمة للجماهير عنصر مهم في المجتمع الديمقراطي، والذين يتلاعبون بهذه الآلية الخفية يشكلون <strong>«حكومة غير مرئية»</strong> هي السلطة الحاكمة الحقيقية.</p>
<p>ثم في مقال سنة ١٩٤٧ بعنوان <strong>«هندسة الرضا»</strong> قدّم المهنة كعلم تطبيقي: كما يصمم المهندس جسرًا، يصمم مستشار العلاقات العامة «موافقة» الجمهور على فكرة أو منتج، بخطة وأهداف ومراحل.</p>
<p>وما يميز بيرنيز أنه لم يكن يبيع المنتج، بل <strong>يغير البيئة التي يُشترى فيها المنتج</strong>. لم يكن يقول «اشترِ هذا»، بل كان يصنع ظروفًا اجتماعية تجعل الشراء يبدو طبيعيًا: عادة جديدة، أو رمزًا جديدًا، أو «خبراء» يوصون، أو حدثًا تغطيه الصحف كأنه خبر لا إعلان.</p>`,
field:`الفرق بين الإعلان والعلاقات العامة عند بيرنيز هو الفرق بين «الحجة» و«البديهة» في سلّم الخفاء. الإعلان بيقولك «اشتري»، وانت عارف إنه إعلان. العلاقات العامة بتعمل «خبر» أو «موضة» أو «رأي خبرا»، فتلاقي نفسك عايز الحاجة ومش فاكر إن حد أقنعك.`,
key:'بيرنيز حوّل الإقناع إلى مهنة: «حكومة غير مرئية» تصنع البيئة التي يُتخذ فيها القرار، لا القرار نفسه. «هندسة الرضا».'},

{h:'مشاعل الحرية: درس في التأطير',
body:`<p>أشهر حملات بيرنيز تُروى عن سنة ١٩٢٩. شركة التبغ الأمريكية كانت تريد أن يدخن النساء في الشارع، وكان ذلك عيبًا اجتماعيًا وقتها. لم يقم بيرنيز بإعلان يقول «يا نساء، دخّنّ». بل فعل ما يلي:</p>
<ul>
<li>استشار، بحسب الرواية، محللًا نفسيًا قال له إن السيجارة يمكن أن تكون رمزًا لتحرر المرأة.</li>
<li>رتّب أن تسير مجموعة من الشابات في موكب عيد الفصح في نيويورك وهن يدخنّ علنًا.</li>
<li>سمّى السجائر <strong>«مشاعل الحرية»</strong>، وأبلغ الصحف مسبقًا بأن «حدثًا» سيقع.</li>
</ul>
<p>غطت الصحف الحدث كخبر عن حقوق المرأة، لا كإعلان عن السجائر. تحولت السيجارة من «عادة معيبة» إلى «رمز للحرية». ومن يعترض على المرأة المدخنة صار يبدو كأنه يعترض على حرية المرأة.</p>
<p>انظر كيف تتجمع المنهج كله في حملة واحدة: <strong>مفهوم لا يُعادى</strong> (الحرية، كما عند شميت)، و<strong>نقل الجنس</strong> من مشاوري («هل التدخين نافع؟») إلى احتفالي («من مع الحرية؟»)، و<strong>صناعة حدث</strong> تغطيه الصحافة كحقيقة (إرادة الحقيقة عند فوكو)، و<strong>حرب على البديهة</strong> (ما كان عيبًا صار عاديًا).</p>`,
field:`لاحظ الحركة اللي عملها: ما ناقشش السيجارة خالص. ماقالش إنها مفيدة ولا لذيذة. غيّر «معناها». ومن ساعتها السؤال ماعادش «السيجارة كويسة ولا لأ؟»، بقى «انت مع الحرية ولا ضدها؟». وده أخطر نوع تلاعب: لما حد يغير السؤال، مش الإجابة.`,
key:'مشاعل الحرية: لم يُناقش المنتج، بل غُيّر معناه. مفهوم لا يُعادى، ونقل للجنس، وحدث يُغطى كخبر، وبديهة جديدة.'},

{h:'لايكوف: لا تفكر في فيل',
body:`<p>بعد عقود، شرح عالم اللسانيات المعرفية <strong>جورج لايكوف</strong> لماذا يعمل هذا في العقل. في كتابه «لا تفكر في فيل» (٢٠٠٤) يبدأ بتمرين يعطيه لطلابه: «لا تفكر في فيل». والنتيجة أن الجميع يفكرون في فيل.</p>
<p>والقاعدة التي يستخرجها: <strong>نفي الإطار يفعّله</strong>. حين تقول «أنا لست كذا» فأنت تستعمل إطار خصمك وتقويه. وكل كلمة تستدعي في العقل «إطارًا»، أي بنية ذهنية كاملة من الأدوار والعلاقات والقيم.</p>
<p>ومثاله الأشهر عبارة «إعفاء ضريبي» (بالإنجليزية: «إغاثة من الضرائب»). كلمة «إغاثة» تستدعي إطارًا كاملًا: هناك مصيبة، والضرائب هي المصيبة، ومن يرفع المصيبة بطل، ومن يعارض رفعها شرير. بمجرد أن يقبل الخصم استعمال العبارة، حتى وهو يعارض السياسة، يكون قد دخل الإطار وخسر نصف المعركة.</p>
<p>والدرس للضابط مزدوج. في التحليل: <strong>اسأل عن الإطار الذي تستدعيه كل كلمة مفتاحية</strong>. وفي الدفاع: <strong>لا تكرر إطار خصمك ولو لتنفيه</strong>؛ بل سمِّ الواقعة باسمك أنت. وهذا امتداد مباشر لـ«الأسماء المتقلبة» عند هوبز في الملف صفر.</p>`,
field:`لو حد اتهمك في اجتماع إنك «سلبي»، ورديت «أنا مش سلبي!»، انت كده رسخت كلمة «سلبي» في دماغ الكل. الرد الأقوى إنك تسمي اللي بتعمله باسمك: «أنا بنبه على خطر قبل ما يحصل». انت ماخرجتش من إطاره بالنفي، خرجت منه بإطار تاني.`,
key:'نفي الإطار يفعّله. كل كلمة تستدعي إطارًا كاملًا. حلّل الإطار وراء كل كلمة مفتاحية، ولا تكرر إطار خصمك ولو لتنفيه.'},

{h:'إنتمان: الوظائف الأربع للتأطير',
body:`<p>عالم الاتصال <strong>روبرت إنتمان</strong> قدم سنة ١٩٩٣ تعريفًا صار أساس دراسات التأطير. التأطير عنده أن <strong>تنتقي بعض جوانب الواقع المدرك وتجعلها أبرز</strong> في نص تواصلي، بطريقة تروّج لأربعة أشياء:</p>
<ol>
<li><strong>تعريف المشكلة:</strong> ما الذي يحدث؟ وما الذي يُعد «مشكلة» أصلًا؟</li>
<li><strong>تشخيص السبب:</strong> من أو ما الذي تسبب فيها؟</li>
<li><strong>الحكم الأخلاقي:</strong> من المذنب ومن الضحية؟ وما الذي يستحق المدح أو الذم؟</li>
<li><strong>اقتراح العلاج:</strong> ما الحل؟ ومن يجب أن ينفذه؟</li>
</ol>
<p>هذه الوظائف الأربع أداة تحليل ممتازة لأي خبر أو بيان أو إعلان. خذ واقعة واحدة: طابور طويل أمام مخبز. إطار أول: «المشكلة: نقص الدقيق. السبب: أزمة عالمية. الحكم: لا أحد مذنب. العلاج: الصبر». وإطار ثانٍ: «المشكلة: سوء التوزيع. السبب: فساد إداري. الحكم: المسؤولون مذنبون. العلاج: محاسبة». الواقعة واحدة، والإطاران يقودان إلى عالمين مختلفين.</p>
<p>ولاحظ أن الوظيفة الرابعة هي الهدف دائمًا: <em>من يعرّف المشكلة ويحدد سببها يحدد الحل ومن ينفذه.</em> وهذا هو فوكو مرة أخرى: من يكوّن الموضوع يملك حق التدخل فيه.</p>`,
key:'التأطير عند إنتمان: انتقاء وإبراز يروّج لتعريف المشكلة، وتشخيص السبب، والحكم الأخلاقي، واقتراح العلاج. ومن يعرّف المشكلة يحدد الحل.'},

{h:'كانمان وتفيرسكي: الإطار يغير القرار',
body:`<p>سنة ١٩٨١ نشر عالما النفس <strong>دانيال كانمان وعاموس تفيرسكي</strong> تجربة صارت كلاسيكية. طُلب من مجموعة أن تتخيل أن مرضًا غير مألوف سيقتل ستمئة شخص، وأن هناك برنامجين لمواجهته:</p>
<ul>
<li>المجموعة الأولى قيل لها: البرنامج (أ) <strong>سينقذ ٢٠٠ شخص</strong> بيقين. والبرنامج (ب) فيه احتمال الثلث أن ينقذ الجميع، واحتمال الثلثين ألا ينقذ أحدًا.</li>
<li>المجموعة الثانية قيل لها: البرنامج (ج) <strong>سيموت معه ٤٠٠ شخص</strong> بيقين. والبرنامج (د) فيه احتمال الثلث ألا يموت أحد، واحتمال الثلثين أن يموت الجميع.</li>
</ul>
<p>(أ) و(ج) متطابقان رياضيًا، وكذلك (ب) و(د). ومع ذلك، في المجموعة الأولى اختار الأغلبية الكبيرة البرنامج المضمون (أ). وفي المجموعة الثانية اختار الأغلبية الكبيرة المقامرة (د). الصياغة بلغة «الإنقاذ» جعلت الناس يتجنبون المخاطرة، والصياغة بلغة «الموت» جعلتهم يقامرون.</p>
<p>والدرس: <strong>العقل البشري لا يقيم المعلومات في فراغ، بل يقيم الإطار الذي تأتي فيه</strong>. ومن يختار الإطار، المكسب أو الخسارة، النجاة أو الموت، يستطيع أن يحرك القرار دون أن يغير معلومة واحدة. وهذا ما رأيته في سؤال التوقع.</p>`,
field:`في البنوك والمبيعات ده معروف جدًا: «وفّر ٢٠٠ جنيه» غير «متخسرش ٢٠٠ جنيه». الناس بتكره الخسارة أكتر ما بتحب المكسب. فلو عايز حد يتحرك، كلمه بلغة الخسارة. ولو عايزه يفضل في مكانه، كلمه بلغة المكسب اللي معاه. اعرف ده لما حد يكلمك.`,
key:'تجربة كانمان وتفيرسكي: معلومات متطابقة، وقرارات معاكسة، لأن الإطار (إنقاذ أو موت) تغير. من يختار الإطار يحرك القرار.'},

{h:'نموذج الدعاية: المرشحات الخمسة',
body:`<p>سنة ١٩٨٨ نشر إدوارد هيرمان ونعوم تشومسكي كتابًا استعار عنوانه من ليبمان: <strong>«صناعة الرضا»</strong>. لكنهما قلبا المعنى: ما رآه ليبمان حلًا رآه هما مشكلة. وقدما «نموذج الدعاية»، الذي يفسر كيف يمكن لإعلام حر لا يخضع لرقابة رسمية أن ينتج، مع ذلك، صورة متحيزة للعالم.</p>
<p>والآلية خمسة «مرشحات» تمر بها الأخبار قبل أن تصل إليك:</p>
<ol>
<li><strong>الملكية:</strong> المؤسسات الإعلامية الكبرى شركات لها ملاك ومصالح.</li>
<li><strong>الإعلان:</strong> مصدر الدخل الأساسي هو المعلنون، لا القراء.</li>
<li><strong>المصادر:</strong> الاعتماد على مصادر رسمية وخبراء معتمدين لأنها أرخص وأسهل وأكثر «مصداقية».</li>
<li><strong>الضغط المضاد:</strong> الهجوم المنظم على أي مؤسسة تنشر ما يزعج الأقوياء.</li>
<li><strong>العدو المشترك:</strong> وكان في الأصل «معاداة الشيوعية»، ثم وُسّع لاحقًا إلى أي «عدو» يوحّد ويُستعمل للتخويف.</li>
</ol>
<p>والنقطة المهمة: لا يحتاج النموذج إلى مؤامرة ولا إلى كاذبين. كل صحفي قد يكون صادقًا تمامًا. لكن المرشحات تنتقي، قبل أن يبدأ أي صحفي، أي القصص تُحكى، ومن يُسأل، وأي القصص تبدو «مهمة». وهذا هو فوكو وغرامشي معًا في صيغة عملية.</p>`,
field:`النموذج ده محتاج تحفظ: اتنقد جامد من باحثين قالوا إنه بيبسط، وإنه مش بيفسر ليه الإعلام ساعات بيهاجم الأقوياء. بس كأداة «أسئلة» هو ممتاز: لما تقرا خبر، اسأل: مين مالك المؤسسة؟ مين بيعلن فيها؟ مين اتسأل في الخبر ومين مااتسألش؟ مين ممكن يزعل لو اتنشر العكس؟`,
key:'نموذج الدعاية: خمسة مرشحات (الملكية، الإعلان، المصادر، الضغط المضاد، العدو المشترك) تنتقي الأخبار قبل أي صحفي، دون حاجة إلى مؤامرة.'}
],

worked:{
 title:'حالة محلولة: مشاعل الحرية',
 case:`نيويورك، عيد الفصح ١٩٢٩ (كما تُروى الحملة):<br>شابات يسرن في الموكب ويدخنّ علنًا. الصحف أُبلغت مسبقًا بأن «حدثًا» سيقع. والسجائر تُسمى في التغطية «مشاعل الحرية». الحملة ممولة من شركة تبغ، ولا يظهر اسمها في الحدث.`,
 steps:[
  {h:'ليبمان: تغيير الصورة في الرأس', body:'الحملة لا تقدم معلومة عن السجائر. هي تغير «الصورة في الرأس»: من «امرأة تدخن = عيب» إلى «امرأة تدخن = امرأة حرة». والقالب الجديد سيجعل الناس «يرون» في كل امرأة مدخنة لاحقًا رمزًا للحرية.'},
  {h:'بيرنيز: صناعة البيئة لا المنتج', body:'لا إعلان عن منتج. بل «حدث» يغطيه الإعلام كخبر. الشركة الممولة غائبة عن المشهد: «حكومة غير مرئية» بالحرف.'},
  {h:'لايكوف: الإطار', body:'«مشاعل الحرية» تستدعي إطارًا كاملًا: هناك قيد (العيب)، وهناك محررات (المدخنات)، وهناك من يقف ضد التحرر (المعترضون). ومن يقول «التدخين مضر» يجد نفسه داخل هذا الإطار كأنه ضد الحرية.'},
  {h:'إنتمان: الوظائف الأربع', body:'<em>المشكلة:</em> قيود المجتمع على المرأة. <em>السبب:</em> العادات البالية. <em>الحكم:</em> المحررات بطلات. <em>العلاج:</em> أن تدخن المرأة علنًا. والسيجارة لم تعد منتجًا، صارت «علاجًا».'},
  {h:'المنهج كله في حدث واحد', body:'مفهوم لا يُعادى (شميت)، ونقل من المشاوري إلى الاحتفالي (أرسطو)، وحرب على البديهة (غرامشي)، وحدث يكتسب صفة «الخبر» (إرادة الحقيقة عند فوكو).'}
 ],
 verdict:'لم يقل أحد كذبة. لم يُطلب من أحد أن يشتري. ومع ذلك تغيرت عادة اجتماعية. هذه هي هندسة الرضا: تغيير السؤال لا الإجابة.'
},
yourturn:{
 title:'دورك: «الماس للأبد»',
 case:`سنة ١٩٤٧، صاغت وكالة الإعلانات الأمريكية «إن. دبليو. آير» لصالح شركة ماس كبرى شعار <b>«الماس للأبد»</b>. ورافقته حملة طويلة تربط خاتم الخطوبة الماسي بالحب الحقيقي والالتزام، وتقترح أن «الرجل الجاد» ينفق على الخاتم ما يعادل راتب شهرين أو أكثر. وظهرت صور نجوم مخطوبين بخواتم ماس، ومقالات عن «تقاليد الخطوبة»، ودروس تُقدَّم في المدارس الثانوية عن اختيار الماس.`,
 prompt:'حلل الحملة بأدوات الملف كلها: ليبمان، بيرنيز، لايكوف، إنتمان، كانمان.',
 points:[
  'حددت تغيير «الصورة في الرأس»: الخاتم الماسي = الحب الحقيقي والالتزام (ليبمان)',
  'حددت صناعة البيئة لا المنتج: مقالات وتقاليد ودروس ونجوم بدل إعلان مباشر (بيرنيز)',
  'حللت الإطار الذي تستدعيه «للأبد»: الديمومة، فمن لا يشتري يبدو غير ملتزم (لايكوف)',
  'طبقت الوظائف الأربع (إنتمان): المشكلة كيف تثبت جديتك، والعلاج الخاتم',
  'لاحظت «راتب شهرين» كمعيار مصنوع يحدد «الطبيعي» (الحكم المطبِّع عند فوكو)',
  'لاحظت كيف صار تقليد حديث نسبيًا يبدو كأنه «تقليد قديم» (نزع الطبيعية)'
 ],
 model:`<p><b>ليبمان:</b> الحملة لم تبع حجرًا، بل صورة: الماس = حب لا يزول. ومن يحمل هذه الصورة «يرى» في الخاتم الصغير حبًا صغيرًا.</p>
<p><b>بيرنيز:</b> البيئة صُنعت عبر مقالات وتقاليد ونجوم ودروس، فصار الماس يبدو «عادة» لا منتجًا.</p>
<p><b>لايكوف:</b> «للأبد» تستدعي إطار الديمومة والإخلاص. ومن يقترح خاتمًا أرخص يبدو داخل الإطار كأنه يقترح حبًا مؤقتًا.</p>
<p><b>إنتمان:</b> <em>المشكلة:</em> كيف يثبت الرجل جديته؟ <em>السبب:</em> الحب يحتاج دليلًا. <em>الحكم:</em> الكريم جاد، والمقتصد مشكوك فيه. <em>العلاج:</em> خاتم ماس بقيمة محددة.</p>
<p><b>المعيار المصنوع:</b> «راتب شهرين» رقم لا أصل له في أي تقليد، لكنه صار «الطبيعي» الذي يُقاس عليه الجميع.</p>
<p><b>نزع الطبيعية:</b> الخاتم الماسي كتقليد واسع حديث نسبيًا، وصُنع بحملة. لكنه يبدو اليوم كأنه «من زمان».</p>`
},

{h:'الطبقة صفر: الواقعة والإطار',
body:`<p>قبل أي أداة، افصل بين شيئين:</p>
<ul>
<li><strong>الواقعة:</strong> ما الذي حدث فعلًا؟ من فعل ماذا، ومتى، وبأي أرقام؟ اكتبها في جملة محايدة قدر الإمكان، كأنك تكتبها لمن لا يهتم بالموضوع.</li>
<li><strong>الإطار:</strong> كل ما أضيف إلى الواقعة: الكلمات المختارة، والترتيب، وما أُبرز وما أُخفي، والانفعال المرافق.</li>
</ul>
<p>هذه الخطوة وحدها تكشف نصف التلاعب. لأنك حين تحاول كتابة الواقعة بجملة محايدة، ستجد أن النص لا يعطيك معلومات كافية، أو أن أهم معلومة غائبة، أو أن «الواقعة» نفسها رأي متنكر.</p>
<p>واحفظ قاعدة: <em>الجملة المحايدة ليست بلا إطار، فلا توجد جملة بلا إطار.</em> لكنها جملة اخترت إطارها وأنت تعرف، بأقل ما يمكن من الانفعال، وبأكثر ما يمكن من الأرقام.</p>`,
