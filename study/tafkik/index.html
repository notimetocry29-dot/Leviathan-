   ===================================================================== */
[
 ['غرامشي: حرب المواقع','الهيمنة','الإكراه والرضا، والدولة كخط أمامي وخنادق المجتمع المدني'],
 ['غرامشي: حرب المواقع','صناعة البديهة','الحس المشترك والمثقف العضوي والكتلة التاريخية · ملحق بورديو: الدوكسا'],
 ['فوكو: الخطاب والسلطة','نظام الخطاب','من يحق له الكلام، وما الذي يمكن قوله أصلًا، وقواعد الإقصاء الخفية'],
 ['فوكو: الخطاب والسلطة','السلطة/المعرفة','السلطة التي تُنتج «الحقيقة»: البانوبتيكون والتطبيع والفحص'],
 ['فوكو: الخطاب والسلطة','الحاكمية وتقنيات الذات','حين يراقب الإنسان نفسه ويظن أنه حر'],
 ['التركيب والميدان','مهندسو الرضا','ليبمان وبيرنيز: من النظرية إلى المصنع · والتأطير المعرفي عند لايكوف'],
 ['التركيب والميدان','الميدان','عمليات تفكيك كاملة: إعلام وإعلانات وبيئة عمل'],
 ['التركيب والميدان','الدفاع ونقد الأداة','التحصين وإعادة التأطير، وأين تنهار هذه النظريات']
].forEach(([part, title, sub]) => FILES.push({id:FILES.length, ready:false, part, title, sub}));

</script>
<script>
'use strict';
/* ========== state ========== */
const SITE = !!window.MAHER;
const KEY = SITE ? 'maher:tafkik' : 'tafkik_v1';
const DEF = {xp:0, done:{}, maxStep:{}, ans:{}, awarded:{}, review:{}, boss:{}, last:null,
  settings:{theme:'cream', font:'naskh', size:19, lh:1.95, width:760}};
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEF);
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); S = Object.assign(clone(DEF), p); S.settings = Object.assign(clone(DEF.settings), p.settings || {}); }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ========== helpers ========== */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function toast(msg, cls){ if (SITE) { MAHER.toast(msg); return; } const t = h('div', {class: cls || ''}, msg); document.getElementById('toast').append(t); setTimeout(() => t.remove(), cls === 'big' ? 3200 : 1900); }

/* ========== ranks / xp ========== */
const RANKS = [[0,'مُجنَّد'],[150,'محلل ميداني'],[400,'ضابط تحليل'],[800,'رائد'],[1300,'رئيس قسم'],[2000,'مدير عمليات'],[3000,'رئيس الجهاز']];
function rankOf(xp){ let i = 0; for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k][0]) i = k; return {name:RANKS[i][1], min:RANKS[i][0], next:RANKS[i+1] || null}; }
function award(key, n, label){
  if (S.awarded[key] || n <= 0) return;
  S.awarded[key] = 1;
  const before = rankOf(S.xp).name; S.xp += Math.round(n); save();
  toast('+' + AR(Math.round(n)) + ' XP' + (label ? ' — ' + label : ''));
  const after = rankOf(S.xp).name;
  if (after !== before) setTimeout(() => toast('ترقية: ' + after, 'big'), 700);
  updateTop();
}

/* ========== question registry & review ========== */
const QREG = {};
FILES.forEach(f => {
  if (!f.ready) return;
  (f.challenges || []).forEach((q, i) => { q.id = f.id + '-c' + i; q.file = f.id; QREG[q.id] = q; });
  (f.boss || []).forEach((q, i) => { q.id = f.id + '-b' + i; q.file = f.id; QREG[q.id] = q; });
});
const BOX_DAYS = [1, 3, 7, 14, 30];
function enqueue(id){ if (!S.review[id]) { S.review[id] = {box:0, due:Date.now() + 864e5}; } }
function enqueueWrong(id){ S.review[id] = {box:0, due:Date.now() + 6 * 3600e3}; }
function schedule(id, ok){
  const r = S.review[id] || {box:0, due:0};
  if (ok){ r.box = Math.min(r.box + 1, BOX_DAYS.length - 1); r.due = Date.now() + BOX_DAYS[r.box] * 864e5; }
  else { r.box = 0; r.due = Date.now() + 6 * 3600e3; }
  S.review[id] = r; save();
}
function dueList(){ const now = Date.now(); return Object.keys(S.review).filter(id => QREG[id] && S.review[id].due <= now); }

/* ========== question renderers ==========
   mode: practice | boss | review ; onDone(score 0..1) called once per attempt */
function renderQ(q, mode, onDone){
  const wrap = h('div', {class:'card qcard'});
  if (q.tag) wrap.append(h('div', {class:'qtag'}, q.tag));
  wrap.append(h('div', {class:'qt', html:q.q}));
  const body = h('div'); wrap.append(body);
  const fb = h('div');
  let hintsUsed = 0, reported = false;
  const report = s => { if (reported) return; reported = true; const hb = wrap.querySelector('.hintbtn'); if (hb) hb.remove(); onDone && onDone(s, hintsUsed); };

  if (q.type === 'mcq'){
    let opts = q.options.map((t, i) => ({t, i}));
    if (mode !== 'practice') opts = shuffle(opts);
    const box = h('div', {class:'opts'});
    let first = true;
    opts.forEach(o => {
      const b = h('button', {class:'opt', html:o.t, onclick:() => {
        if (b.disabled) return;
        const ok = o.i === q.answer;
        if (mode === 'practice'){
          if (ok){
            b.classList.add('right'); box.querySelectorAll('.opt').forEach(x => x.disabled = true);
            fb.replaceChildren(h('div', {class:'feedback ok', html:'<b>صح.</b> ' + (q.explain || '')}));
            report(first ? 1 : 0);
          } else {
            b.classList.add('wrong'); b.disabled = true;
            fb.replaceChildren(h('div', {class:'feedback no', html:'<b>مش دي.</b> ' + (q.wrongNote || 'فكّر تاني، أو خد تلميح.')}));
            if (first && q.id) { enqueueWrong(q.id); save(); }
          }
          first = false;
        } else {
          box.querySelectorAll('.opt').forEach(x => x.disabled = true);
          const rightBtn = [...box.children][opts.findIndex(z => z.i === q.answer)];
          rightBtn.classList.add('right'); if (!ok) b.classList.add('wrong');
          fb.replaceChildren(h('div', {class:'feedback ' + (ok ? 'ok' : 'no'), html:(ok ? '<b>صح.</b> ' : '<b>غلط.</b> ') + (q.explain || '')}));
          report(ok ? 1 : 0);
        }
      }});
      box.append(b);
    });
    body.append(box);
  }

  else if (q.type === 'classify'){
    const items = mode === 'practice' ? q.items : shuffle(q.items);
    const sel = new Array(items.length).fill(null);
    const rows = items.map((it, k) => {
      const cats = h('div', {class:'cats'});
      q.cats.forEach((c, ci) => cats.append(h('button', {onclick:(ev) => {
        if (row.dataset.locked) return;
        sel[k] = ci; cats.querySelectorAll('button').forEach(x => x.classList.remove('sel')); ev.currentTarget.classList.add('sel');
      }}, c)));
      const row = h('div', {class:'cls-item'}, h('div', {class:'it', html:it.t}), cats);
      return row;
    });
    rows.forEach(r => body.append(r));
    const btn = h('button', {class:'btn', onclick:() => {
      if (sel.some(x => x === null)){ toast('صنّف كل البنود الأول'); return; }
      let right = 0;
      rows.forEach((r, k) => {
        r.dataset.locked = 1; r.querySelectorAll('.fix').forEach(x => x.remove());
        const ok = sel[k] === items[k].c; if (ok) right++;
        r.classList.toggle('right', ok); r.classList.toggle('wrong', !ok);
        if (!ok || items[k].why) r.append(h('div', {class:'fix', html:(ok ? '' : 'الصح: <b>' + q.cats[items[k].c] + '</b>. ') + (items[k].why || '')}));
      });
      const s = right / items.length;
      fb.replaceChildren(h('div', {class:'feedback ' + (s === 1 ? 'ok' : 'no'), html:'النتيجة: ' + AR(right) + ' من ' + AR(items.length) + (q.explain ? '<br>' + q.explain : '')}));
      if (s < 1 && q.id && mode === 'practice') { enqueueWrong(q.id); save(); }
      btn.remove(); report(s);
      if (mode === 'practice' && s < 1) fb.append(h('button', {class:'btn ghost', style:'margin-top:10px', onclick:() => wrap.replaceWith(renderQ(q, 'practice', null))}, 'جرّب تاني (من غير نقاط)'));
    }}, 'تحقّق');
    body.append(btn);
  }

  else if (q.type === 'order'){
    const pool = h('div', {class:'order-pool'}), ans = h('div', {class:'order-ans'});
    const picked = [];
    const draw = () => {
      ans.replaceChildren(...picked.map((i, n) => h('div', null, AR(n + 1) + '. ' + q.items[i])));
      if (!picked.length) ans.append(h('div', {class:'muted small', style:'background:none;border:0'}, 'اضغط البنود بالترتيب الصح...'));
    };
    shuffle(q.items.map((t, i) => i)).forEach(i => pool.append(h('button', {onclick:(ev) => { picked.push(i); ev.currentTarget.remove(); draw(); }}, q.items[i])));
    draw();
    body.append(h('div', {class:'small muted ui'}, 'ترتيبك:'), ans, pool);
    const reset = h('button', {class:'btn ghost', onclick:() => wrap.replaceWith(renderQ(q, mode, onDone))}, 'ابدأ من الأول');
    const btn = h('button', {class:'btn', onclick:() => {
      if (picked.length < q.items.length){ toast('رتّب كل البنود الأول'); return; }
      let right = 0;
      [...ans.children].forEach((d, n) => { const ok = picked[n] === n; if (ok) right++; d.classList.add(ok ? 'right' : 'wrong'); });
      const s = right / q.items.length;
      fb.replaceChildren(h('div', {class:'feedback ' + (s === 1 ? 'ok' : 'no'), html:'النتيجة: ' + AR(right) + ' من ' + AR(q.items.length) + '<br>الترتيب الصح: ' + q.items.map((t, n) => AR(n + 1) + '. ' + t).join(' ← ') + (q.explain ? '<br>' + q.explain : '')}));
      if (s < 1 && q.id && mode === 'practice') { enqueueWrong(q.id); save(); }
      btn.remove(); reset.remove(); report(s);
    }}, 'تحقّق');
    body.append(h('div', {class:'row'}, btn, reset));
  }

  if (mode === 'practice' && q.hints && q.hints.length){
    const hbox = h('div', {class:'hints'});
    const hb = h('button', {class:'btn ghost hintbtn', style:'margin-top:10px', onclick:() => {
      if (reported) return;
      hbox.append(h('div', {class:'hint', html:q.hints[hintsUsed]})); hintsUsed++;
      if (hintsUsed >= q.hints.length) hb.remove(); else hb.textContent = 'تلميح (' + AR(hintsUsed + 1) + '/' + AR(q.hints.length) + ')';
    }}, 'تلميح (١/' + AR(q.hints.length) + ')');
    wrap.append(hb, hbox);
  }
  wrap.append(fb);
  return wrap;
}

/* free-text with checklist self-grading */
function renderFree(key, spec, xpMax, label){
  const st = S.ans[key] || (S.ans[key] = {text:'', submitted:false, checks:[]});
  const card = h('div', {class:'card'});
  if (spec.title) card.append(h('h2', {class:'read', style:'margin-top:0'}, spec.title));
  if (spec.case) card.append(h('div', {class:'casebox read', html:spec.case}));
  card.append(h('p', {class:'read', html:'<b>' + spec.prompt + '</b>'}));
  const ta = h('textarea', {placeholder:'اكتب تحليلك هنا... (بيتحفظ تلقائي)'}); ta.value = st.text || '';
  ta.addEventListener('input', () => { st.text = ta.value; save(); });
  card.append(ta);
  const after = h('div');
  const showCheck = () => {
    after.replaceChildren();
    after.append(h('p', {class:'ui muted', style:'margin:14px 0 6px'}, 'علّم على كل نقطة إجابتك غطّتها فعلًا. خليك صارم مع نفسك؛ دي نقاط إلزامية، مش ديكور.'));
    spec.points.forEach((p, i) => {
      const cb = h('input', {type:'checkbox'}); cb.checked = !!st.checks[i];
      cb.addEventListener('change', () => { st.checks[i] = cb.checked; save(); });
      after.append(h('label', {class:'check'}, cb, h('span', {html:p})));
    });
    const res = h('div');
    after.append(h('button', {class:'btn sage', style:'margin-top:12px', onclick:() => {
      const n = spec.points.filter((_, i) => st.checks[i]).length, r = n / spec.points.length;
      st.score = r; save();
      res.replaceChildren(h('div', {class:'feedback ' + (r >= .8 ? 'ok' : 'no'), html:'غطّيت ' + AR(n) + ' من ' + AR(spec.points.length) + ' (' + AR(Math.round(r * 100)) + '٪). ' + (r >= .8 ? 'شغل ضابط.' : 'ارجع للنقاط اللي فاتتك واقرا الإجابة النموذجية تحت.')}));
      award(key, Math.max(5, xpMax * r), label);
      if (spec.model && !after.querySelector('.model')) after.append(h('div', {class:'card model read', style:'margin-top:14px;background:var(--bg)'}, h('h3', {style:'margin-top:0'}, 'إجابة نموذجية'), h('div', {html:spec.model})));
      card.dispatchEvent(new CustomEvent('graded'));
    }}, 'احسب النتيجة'), res);
  };
  const sub = h('button', {class:'btn', style:'margin-top:10px', onclick:() => {
    if ((ta.value || '').trim().length < 40){ toast('اكتب تحليل حقيقي الأول (سطرين على الأقل)'); return; }
    st.submitted = true; save(); sub.remove(); showCheck();
  }}, 'سلّم وقارن');
  if (st.submitted) showCheck(); else card.append(sub);
  card.append(after);
  return card;
}

/* ========== top bar & settings ========== */
function updateTop(){
  const r = rankOf(S.xp);
  document.getElementById('rankchip').textContent = r.name + ' — ' + AR(S.xp) + ' XP';
}
function applySettings(){
  if (SITE) return;
  const s = S.settings;
  document.documentElement.setAttribute('data-theme', s.theme);
  document.body.setAttribute('data-font', s.font);
  document.documentElement.style.setProperty('--fs', s.size + 'px');
  document.documentElement.style.setProperty('--lh', s.lh);
  document.documentElement.style.setProperty('--w', s.width + 'px');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
function openSettings(){
  const s = S.settings, sh = document.getElementById('settings');
  const seg = (opts, key) => h('div', {class:'seg'}, opts.map(([v, t]) => h('button', {class:s[key] === v ? 'on' : '', onclick:() => { s[key] = v; save(); applySettings(); openSettings(); }}, t)));
  const rng = (key, min, max, step, fmt) => {
    const out = h('span', null, fmt(s[key]));
    const r = h('input', {type:'range', min, max, step, value:s[key]});
    r.addEventListener('input', () => { s[key] = +r.value; out.textContent = fmt(s[key]); save(); applySettings(); });
    return [out, r];
  };
  const [o1, r1] = rng('size', 15, 26, 1, v => AR(v) + 'px');
  const [o2, r2] = rng('lh', 1.6, 2.4, .05, v => AR(v.toFixed(2)));
  const [o3, r3] = rng('width', 560, 960, 20, v => AR(v) + 'px');
  let armed = false;
  const resetBtn = h('button', {class:'btn ghost', style:'margin-top:18px;color:var(--rose)', onclick:() => {
    if (!armed){ armed = true; resetBtn.textContent = 'متأكد؟ اضغط تاني لمسح كل التقدم'; return; }
    const keep = S.settings; S = clone(DEF); S.settings = keep; save(); sh.classList.add('hidden'); updateTop(); route();
  }}, 'مسح التقدم');
  const panel = h('div', {class:'panel'},
    h('div', {class:'row'}, h('h3', null, 'إعدادات القراءة'), h('span', {class:'spacer'}), h('button', {class:'btn soft', onclick:() => sh.classList.add('hidden')}, 'تم')),
    h('label', null, 'الثيم'), seg([['cream','كريمي'],['sand','رملي'],['sepia','سيبيا'],['night','ليلي ناعم']], 'theme'),
    h('label', null, 'الخط'), seg([['naskh','نسخ (كلاسيكي)'],['sans','حديث']], 'font'),
    h('label', null, 'حجم الخط ', o1), r1,
    h('label', null, 'تباعد السطور ', o2), r2,
    h('label', null, 'عرض عمود القراءة ', o3), r3,
    resetBtn
  );
  sh.replaceChildren(panel); sh.classList.remove('hidden');
  sh.onclick = e => { if (e.target === sh) sh.classList.add('hidden'); };
}

/* ========== routing ========== */
const STEPS = [
  {k:'brief', t:'الإحاطة'}, {k:'predict', t:'توقّع'}, {k:'lesson', t:'الشرح'}, {k:'quotes', t:'من النص'},
  {k:'worked', t:'حالة محلولة'}, {k:'yourturn', t:'دورك'}, {k:'challenges', t:'التحديات'},
  {k:'critique', t:'ورقة النقد'}, {k:'explain', t:'اشرحها بكلامك'}, {k:'boss', t:'الزعيم'}
];
const app = () => document.getElementById('app');
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
function route(){
  const p = (location.hash || '#/').slice(2).split('/');
  window.scrollTo(0, 0);
  if (p[0] === 'f' && FILES[+p[1]] && isOpen(+p[1])) return viewFile(+p[1], +(p[2] || 0));
  if (p[0] === 'review') return viewReview();
  viewHome();
}
window.addEventListener('hashchange', route);
const isOpen = i => FILES[i].ready && (i === 0 || !!S.done[i - 1]);

/* ========== home ========== */
function viewHome(){
  const r = rankOf(S.xp);
  const pct = r.next ? Math.round((S.xp - r.min) / (r.next[0] - r.min) * 100) : 100;
  const doneN = Object.keys(S.done).length;
  const due = dueList().length;
  const cont = S.last && FILES[S.last.f] && isOpen(S.last.f) ? S.last : (isOpen(0) ? {f:0, s:0} : null);
  const hero = h('div', {class:'card hero'},
    h('div', {class:'qtag'}, 'المادة'),
    h('h1', null, 'فلسفة الخطاب والهيمنة الناعمة'),
    h('p', {class:'sub'}, 'تشريح التلاعب غير المرئي: أرسطو، غرامشي، فوكو، ومهندسو الرضا'),
    h('div', {class:'row ui', style:'margin-bottom:8px'}, h('b', null, 'رتبتك: ' + r.name), h('span', {class:'spacer'}), h('span', {class:'muted'}, r.next ? AR(S.xp) + ' / ' + AR(r.next[0]) + ' للترقية لـ' + r.next[1] : 'أعلى رتبة')),
    h('div', {class:'bar'}, h('i', {style:'width:' + pct + '%'})),
    h('div', {class:'row ui muted', style:'margin:10px 0 14px'}, h('span', null, 'ملفات مكتملة: ' + AR(doneN) + ' / ' + AR(FILES.length))),
    h('div', {class:'row'},
      cont ? h('button', {class:'btn', onclick:() => go('#/f/' + cont.f + '/' + cont.s)}, doneN || S.last ? 'كمّل من مكانك' : 'ابدأ الملف الأول') : null,
      h('button', {class:'btn soft', onclick:() => go('#/review')}, 'خزنة المراجعة' + (due ? ' (' + AR(due) + ')' : '')))
  );
  const how = h('details', {class:'card how'}, h('summary', null, 'إزاي تلعب'),
    h('ul', null,
      h('li', null, 'كل ملف فيه ١٠ خطوات: إحاطة ← توقّع ← شرح ← نصوص ← حالة محلولة ← دورك ← تحديات ← ورقة نقد ← اشرحها بكلامك ← الزعيم.'),
      h('li', null, 'التلميحات على ٣ درجات، وكل تلميح بيقلل نقاط السؤال. الإجابة ماتظهرش إلا بعد ما تحاول.'),
      h('li', null, 'الزعيم: لازم ٨٠٪ علشان الملف اللي بعده يتفتح. لو وقعت، المحاولة الجاية بتتلخبط أسئلتها.'),
      h('li', null, 'أي سؤال تغلط فيه بيتحط في خزنة المراجعة ويرجعلك بعد كام ساعة. واللي تجاوبه صح بيبعد أكتر (١، ٣، ٧، ١٤، ٣٠ يوم).'),
      h('li', null, 'الإجابات المكتوبة بتصححها انت بقائمة نقاط إلزامية. الأمانة هنا بتاعتك.'),
      h('li', null, 'التقدم محفوظ على الجهاز ده والمتصفح ده.')));
  const map = h('div');
  let lastPart = '';
  FILES.forEach((f, i) => {
    if (f.part !== lastPart){ map.append(h('div', {class:'part'}, f.part)); lastPart = f.part; }
    const open = isOpen(i), done = !!S.done[i];
    const status = done ? h('span', {class:'badge ok'}, 'مكتمل') : open ? h('span', {class:'badge go'}, 'مفتوح') : !f.ready ? h('span', {class:'badge'}, 'قيد الإعداد') : h('span', {class:'badge'}, 'مقفول');
    const node = h(open ? 'a' : 'div', {class:'card node' + (done ? ' done' : '') + (open ? '' : ' locked'), href:open ? '#/f/' + i + '/' + Math.min(S.maxStep[i] || 0, 9) : null, style:'margin-bottom:10px'},
      h('div', {class:'num'}, AR(i)),
      h('div', {style:'flex:1'}, h('div', {class:'t'}, f.title), h('div', {class:'s'}, f.sub)),
      status);
    map.append(node);
  });
  let armed = false;
  const reset = SITE ? h('div', {style:'text-align:center;margin:26px 0 6px'}, h('button', {class:'btn ghost', style:'font-size:13.5px;color:var(--muted)', onclick:(ev) => {
    if (!armed){ armed = true; ev.currentTarget.textContent = 'متأكد؟ اضغط تاني لمسح كل تقدم الدراسة'; return; }
    S = clone(DEF); save(); updateTop(); route();
  }}, 'مسح تقدم الدراسة')) : null;
  app().replaceChildren(hero, how, map, reset || '');
}

/* ========== file view ========== */
function viewFile(fid, si){
  const f = FILES[fid];
  const max = S.maxStep[fid] || 0;
  if (si > max) si = max;
  S.last = {f:fid, s:si}; save();
  const nav = h('div', {class:'steps'}, STEPS.map((s, i) => h('button', {class:(i === si ? 'on ' : '') + (i <= max ? 'reached' : ''), disabled:i > max, onclick:() => go('#/f/' + fid + '/' + i)}, AR(i + 1) + '. ' + s.t)));
  const head = h('div', {class:'filehead'}, h('div', {class:'k'}, 'الملف ' + AR(fid) + ' — ' + f.part), h('h1', null, f.title));
  const content = h('div');
  const next = (enabled, label) => {
    const b = h('button', {class:'btn', disabled:!enabled, onclick:() => {
      if (b.disabled) return;
      S.maxStep[fid] = Math.max(S.maxStep[fid] || 0, si + 1); save();
      go('#/f/' + fid + '/' + (si + 1));
    }}, label || 'التالي ←');
    return b;
  };
  const step = STEPS[si].k;
  let nb;

  if (step === 'brief'){
    content.append(h('div', {class:'card read', html:f.brief}),
      h('div', {class:'card read'}, h('h2', null, 'هتخرج من الملف ده وانت قادر:'), h('ul', null, f.objectives.map(o => h('li', {html:o})))));
    nb = next(true, 'استلمت المهمة ←'); nb.addEventListener('click', () => award(fid + ':brief', 10, 'إحاطة'), {capture:true});
  }

  else if (step === 'predict'){
    const p = f.predict, st = S.ans[fid + ':predict'];
    const card = h('div', {class:'card qcard'}, h('div', {class:'qtag'}, 'قبل ما تقرا أي شرح: توقّع'), h('div', {class:'qt', html:p.q}));
    const opts = h('div', {class:'opts'}), rv = h('div');
    nb = next(!!st);
    const reveal = (pick) => {
      opts.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === p.answer) b.classList.add('right'); else if (i === pick) b.classList.add('wrong'); });
      rv.replaceChildren(h('div', {class:'feedback ' + (pick === p.answer ? 'ok' : 'no'), html:(pick === p.answer ? '<b>توقّعك صح.</b> ' : '<b>توقّع مختلف، وده طبيعي. خلي الإجابة دي في دماغك وانت بتقرا.</b> ') + p.reveal}));
    };
    p.options.forEach((t, i) => opts.append(h('button', {class:'opt', html:t, onclick:() => {
      if (S.ans[fid + ':predict']) return;
      S.ans[fid + ':predict'] = {pick:i}; save(); reveal(i);
      award(fid + ':predict', i === p.answer ? 15 : 10, 'توقّع'); nb.disabled = false;
    }})));
    card.append(opts, rv); content.append(card);
    if (st) reveal(st.pick);
  }

  else if (step === 'lesson'){
    const toc = h('div', {class:'card toc'}, h('div', {class:'qtag'}, 'فهرس الشرح'), f.lesson.map((s, i) => h('a', {href:'javascript:void 0', onclick:() => document.getElementById('sec' + i).scrollIntoView({behavior:'smooth'})}, AR(i + 1) + '. ' + s.h)));
    content.append(toc);
    f.lesson.forEach((s, i) => {
      const c = h('article', {class:'card read', id:'sec' + i}, h('h2', null, AR(i + 1) + '. ' + s.h), h('div', {html:s.body}));
      if (s.field) c.append(h('div', {class:'field', html:s.field}));
      if (s.key) c.append(h('div', {class:'key', html:s.key}));
      content.append(c);
    });
    nb = next(true, 'خلّصت القراءة ←'); nb.addEventListener('click', () => award(fid + ':lesson', 40, 'الشرح'), {capture:true});
  }

  else if (step === 'quotes'){
    content.append(h('p', {class:'ui muted', style:'margin:0 4px 10px'}, 'اقتباسات قصيرة بترجمة عربية من المنهج. اقرا كل واحد، وبعدين اقرا سطر «ليه ده مهم».'));
    f.quotes.forEach(q => content.append(h('blockquote', {class:'q'}, h('p', {html:'«' + q.t + '»'}), h('cite', null, q.src), q.why ? h('div', {class:'why', html:q.why}) : null)));
    nb = next(true); nb.addEventListener('click', () => award(fid + ':quotes', 10, 'النصوص'), {capture:true});
  }

  else if (step === 'worked'){
    const w = f.worked;
    content.append(h('div', {class:'card read'}, h('h2', {style:'margin-top:0'}, w.title), h('div', {class:'casebox', html:w.case}), h('p', {class:'ui muted'}, 'قبل ما تفتح كل خطوة، حاول تتوقعها في دماغك.')));
    const stepsBox = h('div', {class:'card read'});
    content.append(stepsBox);
    let k = S.ans[fid + ':worked'] || 0;
    nb = next(k >= w.steps.length);
    const more = h('button', {class:'btn soft'}, 'افتح الخطوة الجاية');
    const draw = () => {
      stepsBox.replaceChildren(...w.steps.slice(0, k).map((s, i) => h('div', {class:'wstep'}, h('h3', null, 'الخطوة ' + AR(i + 1) + ': ' + s.h), h('div', {html:s.body}))));
      if (k < w.steps.length) stepsBox.append(more);
      else { if (w.verdict) stepsBox.append(h('div', {class:'key', html:w.verdict})); nb.disabled = false; award(fid + ':worked', 20, 'الحالة المحلولة'); }
    };
    more.onclick = () => { k++; S.ans[fid + ':worked'] = k; save(); draw(); };
    draw();
  }

  else if (step === 'yourturn'){
    const card = renderFree(fid + ':yourturn', f.yourturn, 40, 'دورك');
    content.append(card);
    nb = next(!!(S.ans[fid + ':yourturn'] || {}).score || (S.ans[fid + ':yourturn'] || {}).score === 0);
    card.addEventListener('graded', () => nb.disabled = false);
  }

  else if (step === 'challenges'){
    const list = f.challenges;
    const doneCount = () => list.filter(q => S.ans[q.id]).length;
    const prog = h('div', {class:'prog'});
    const upd = () => { prog.textContent = 'اتحل ' + AR(doneCount()) + ' من ' + AR(list.length); nb && (nb.disabled = doneCount() < list.length); };
    content.append(prog);
    list.forEach((q, i) => {
      const st = S.ans[q.id];
      const card = renderQ(Object.assign({}, q, {tag:'تحدي ' + AR(i + 1)}), 'practice', (s, hints) => {
        if (!S.ans[q.id]){ S.ans[q.id] = {score:s, hints}; save(); award(q.id, s >= 1 ? Math.max(8, 20 - 5 * hints) : 20 * s * .5, 'تحدي'); }
        upd();
      });
      if (st) card.append(h('div', {class:'done-mark'}, 'اتحل قبل كده — أول محاولة: ' + AR(Math.round(st.score * 100)) + '٪'));
      content.append(card);
    });
    nb = next(false); upd();
  }

  else if (step === 'critique'){
    content.append(h('p', {class:'ui muted', style:'margin:0 4px 10px'}, 'هنا بنقلب السلاح على نفسه: فين الأداة دي بتغلط، وفين ممكن تضرك لو استعملتها غلط.'));
    f.critique.forEach((c, i) => content.append(h('div', {class:'card read'}, h('h2', null, AR(i + 1) + '. ' + c.h), h('div', {html:c.body}))));
    nb = next(true); nb.addEventListener('click', () => award(fid + ':critique', 15, 'ورقة النقد'), {capture:true});
  }

  else if (step === 'explain'){
    const card = renderFree(fid + ':explain', Object.assign({title:'اشرحها بكلامك'}, f.explain), 40, 'الشرح بكلامك');
    content.append(card);
    const st = S.ans[fid + ':explain'] || {};
    nb = next(st.score != null);
    card.addEventListener('graded', () => nb.disabled = false);
  }

  else if (step === 'boss'){
    viewBoss(fid, content);
  }

  const navRow = h('div', {class:'navrow'},
    si > 0 ? h('button', {class:'btn ghost', onclick:() => go('#/f/' + fid + '/' + (si - 1))}, '→ السابق') : h('button', {class:'btn ghost', onclick:() => go('#/')}, '→ الخريطة'),
    nb || h('span'));
  app().replaceChildren(head, nav, content, navRow);
  const on = nav.querySelector('.on'); if (on) requestAnimationFrame(() => { nav.scrollLeft = on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2; window.scrollTo(0, 0); });
}

/* ========== boss ========== */
function viewBoss(fid, content){
  const f = FILES[fid], best = S.boss[fid];
  const intro = h('div', {class:'card bosshead'},
    h('div', {class:'qtag'}, 'الزعيم'),
    h('h2', {style:'margin:4px 0'}, f.bossTitle || 'ملف التفكيك الشامل'),
    h('p', {class:'muted ui'}, AR(f.boss.length) + ' سؤال — من غير تلميحات — لازم ٨٠٪ علشان تعدّي'),
    best != null ? h('p', {class:'ui'}, 'أحسن نتيجة: ' + AR(Math.round(best * 100)) + '٪' + (S.done[fid] ? ' — عدّيت' : '')) : null,
    h('button', {class:'btn', onclick:() => run()}, best != null ? 'محاولة جديدة' : 'ابدأ المواجهة'));
  content.replaceChildren(intro);
  function run(){
    const qs = shuffle(f.boss);
    let i = 0, total = 0; const wrong = [];
    const stage = h('div');
    content.replaceChildren(stage);
    const show = () => {
      window.scrollTo(0, 0);
      const q = qs[i];
      const nextB = h('button', {class:'btn', disabled:true}, i < qs.length - 1 ? 'السؤال الجاي ←' : 'شوف النتيجة');
      const card = renderQ(q, 'boss', s => { total += s; if (s < 1) wrong.push(q.id); nextB.disabled = false; });
      nextB.onclick = () => { if (nextB.disabled) return; i++; if (i < qs.length) show(); else finish(); };
      stage.replaceChildren(h('div', {class:'prog'}, 'سؤال ' + AR(i + 1) + ' من ' + AR(qs.length)), card, nextB);
    };
    const finish = () => {
      const score = total / qs.length, pass = score >= .8;
      S.boss[fid] = Math.max(S.boss[fid] || 0, score);
      wrong.forEach(enqueueWrong);
      if (pass){
        const first = !S.done[fid];
        S.done[fid] = true;
        S.maxStep[fid] = 9;
        [...f.challenges, ...f.boss].forEach(q => enqueue(q.id));
        save();
        if (first) award(fid + ':boss', 100, 'الزعيم');
      } else save();
      const nextFile = FILES[fid + 1];
      stage.replaceChildren(h('div', {class:'card bosshead'},
        h('div', {class:'big'}, AR(Math.round(score * 100)) + '٪'),
        h('h2', null, pass ? 'الملف اتقفل لصالحك' : 'لسه'),
        h('p', {class:'ui'}, pass ? 'أسئلة الملف اتحطت في خزنة المراجعة علشان ترجعلك على فترات.' : 'محتاج ٨٠٪. الأسئلة اللي غلطت فيها راحت الخزنة. ارجع للشرح أو التحديات وبعدين حاول تاني؛ المرة الجاية الترتيب هيتغير.'),
        pass && nextFile ? (nextFile.ready ? h('button', {class:'btn', onclick:() => go('#/f/' + (fid + 1) + '/0')}, 'افتح الملف ' + AR(fid + 1) + ' ←') : h('p', {class:'muted ui'}, 'الملف ' + AR(fid + 1) + ' قيد الإعداد، وهيتضاف في التحديث الجاي.')) : null,
        h('div', {class:'row', style:'justify-content:center;margin-top:10px'},
          h('button', {class:'btn ghost', onclick:() => run()}, 'محاولة تانية'),
          h('button', {class:'btn ghost', onclick:() => go('#/')}, 'الخريطة'))));
      window.scrollTo(0, 0);
    };
    show();
  }
}

/* ========== review vault ========== */
function viewReview(){
  const ids = shuffle(dueList());
  const head = h('div', {class:'filehead'}, h('div', {class:'k'}, 'التكرار المتباعد'), h('h1', null, 'خزنة المراجعة'));
  if (!ids.length){
    const all = Object.values(S.review).map(r => r.due).sort((a, b) => a - b);
    const msg = all.length ? 'مفيش أسئلة مستحقة دلوقتي. أقرب سؤال هيرجع ' + new Date(all[0]).toLocaleString('ar-EG', {weekday:'long', hour:'numeric', minute:'2-digit'}) + '.' : 'الخزنة فاضية. الأسئلة بتدخلها لما تغلط في تحدي، أو لما تعدّي زعيم ملف.';
    app().replaceChildren(head, h('div', {class:'card read'}, h('p', null, msg), h('button', {class:'btn ghost', onclick:() => go('#/')}, 'الخريطة')));
    return;
  }
  let i = 0, right = 0;
  const stage = h('div');
  app().replaceChildren(head, stage);
  const show = () => {
    const q = QREG[ids[i]];
    const nb = h('button', {class:'btn', disabled:true}, i < ids.length - 1 ? 'التالي ←' : 'خلصت');
    const card = renderQ(Object.assign({}, q, {tag:'من الملف ' + AR(q.file)}), 'review', s => {
      const ok = s >= 1; if (ok) right++;
      schedule(q.id, ok);
      if (ok) award('rv:' + q.id + ':' + new Date().toDateString(), 5, 'مراجعة');
      nb.disabled = false;
    });
    nb.onclick = () => { if (nb.disabled) return; i++; window.scrollTo(0, 0); if (i < ids.length) show(); else stage.replaceChildren(h('div', {class:'card bosshead'}, h('div', {class:'big'}, AR(right) + '/' + AR(ids.length)), h('p', {class:'ui'}, 'اللي جاوبته صح هيبعد، واللي غلطت فيه هيرجعلك قريب.'), h('button', {class:'btn', onclick:() => go('#/')}, 'الخريطة'))); };
    stage.replaceChildren(h('div', {class:'prog'}, AR(i + 1) + ' من ' + AR(ids.length)), card, nb);
  };
  show();
}

/* ========== boot ========== */
applySettings(); updateTop();
if (!SITE) document.getElementById('setbtn').onclick = openSettings;
route();

</script>
